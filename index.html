    const per = r.lines.reduce((t, l, i) => t + l.qty * prices[i], 0);
    const virt = DK.virtualRecurring(S, now).filter((v) => v.recurringId === r.id).map((v) => ({ date: v.date, so: null, total: per }));
    const real = S.sos.filter((so) => so.recurringId === r.id && so.occurrence >= DK.addDays(now, -30)).map((so) => ({ date: so.occurrence, so, total: soTotal(so) }));
    const skipped = r.skips.filter((d) => d >= now && !real.some((x) => x.date === d)).map((d) => ({ date: d, skipped: true }));
    const rows = [...virt, ...real, ...skipped].sort((a, b) => a.date.localeCompare(b.date));
    const acts = can("sales") ? (r.active ? `<button type="button" class="btn" data-act="recState" data-v="pause" ${dis("sales")}>Pause</button><button type="button" class="btn btn-d" data-act="recState" data-v="end" ${dis("sales")}>End</button>` : !ended ? `<button type="button" class="btn btn-p" data-act="recState" data-v="resume" ${dis("sales")}>Resume</button>` : "") : "";
    const picker = can("sales") && !ended ? linePicker("addRecurringLine", "price", "Price", "smallest", () => 0) : "";
    return `${head(`${esc(r.name)} ${r.active ? `<span class="badge b-green">Active</span>` : `<span class="badge">${ended ? "Ended" : "Paused"}</span>`}`, `${link("customer", r.customerId, esc(c?.name))} · ${esc(tier(c?.tierId)?.name || "No tier")} · ${CADENCE[r.cadence]} from ${fdate(r.start)}${r.end ? " to " + fdate(r.end) : ""} · about ${money(per)} per order at today's prices`, acts, ["recurring", "Recurring orders"])}
      ${section("Items each order", `${r.lines.length ? table(["Product", ">Qty", ">Price today", ">Extended", ""], r.lines.map((l, i) => { const p = P(l.productId), u = unitOf(p, l.unitId); return `<tr><td>${esc(p.name)}<div class="small code">${esc(p.sku)}</div></td><td class="n">${qty(l.qty)} ${esc(u.name)}</td><td class="n">${money(prices[i])}</td><td class="n">${money(l.qty * prices[i])}</td><td class="n">${can("sales") ? `<button type="button" class="btn btn-s btn-d" data-act="rmRecLine" data-v="${l.id}" ${dis("sales")}>Remove</button>` : ""}</td></tr>`; })) : empty("No items yet. Nothing is planned until you add at least one.")}
        ${picker ? `<form class="card section rec-pick" data-form="addRecurringLine">${picker}<p class="note" style="margin:0">Each order is priced at the customer's current tier price when it's created.</p><div class="actions"><button class="btn btn-p">Add item</button></div></form>` : ""}`)}
      ${section(`Planned orders (${rows.filter((x) => !x.skipped && (!x.so || x.so.status !== "cancelled") && x.date >= now).length} ahead)`, rows.length ? `<div class="tw" style="max-height:520px;overflow:auto"><table><thead><tr><th>Ships</th><th>Order</th><th class="n">Total</th><th>Status</th><th></th></tr></thead><tbody>${rows.map((x) => {
        const so = x.so, skip = x.skipped || so?.status === "cancelled";
        return `<tr class="${skip ? "t-faint" : ""}"><td class="nowrap">${fdate(x.date)}</td><td>${so ? link("so", so.id, esc(so.number)) : `<span class="small">not yet created</span>`}</td><td class="n">${x.total ? money(x.total) : "—"}</td>
          <td>${skip ? `<span class="small">Skipped</span>` : so ? badge(so.status) : `<span class="badge">planned</span>`}</td>
          <td class="n nowrap">${!skip && !so && can("sales") ? `<button type="button" class="btn btn-s" data-act="planRec" data-id="${r.id}" data-v="${x.date}" ${dis("sales")}>Open</button>` : ""}${!skip && (!so || ["draft", "confirmed"].includes(so.status)) && can("sales") ? ` <button type="button" class="btn btn-s" data-act="skipRec" data-id="${r.id}" data-v="${x.date}" ${dis("sales")}>Skip</button>` : ""}</td></tr>`;
      }).join("")}</tbody></table></div>` : empty(r.active ? "Add items to plan the next 12 months." : "Nothing planned while paused."))}
      <p class="note" style="margin:0">Open turns that one delivery into a draft sales order at today's prices, ready to edit and confirm. Opened orders are kept if you pause or end the recurring order.</p>
      ${section("Schedule", `<form class="card form" data-form="updateRecurring"><fieldset class="form" style="border:0;padding:0;margin:0;grid-column:span 12" ${ended ? "disabled" : dis("sales")}>
        ${field("Name", inp("name", r.name, "required"), "c4")}${field("Repeats", sel("cadence", Object.entries(CADENCE), r.cadence), "c4")}${field("First ship / pickup date", inp("start", r.start, 'type="date" required'), "c4")}${field("Last date (optional)", inp("end", r.end, 'type="date"'), "c4")}
        ${can("sales") && !ended ? `<div class="actions"><button class="btn btn-p">Save schedule</button></div>` : ""}</fieldset></form>`)}`;
  };
  FORMS.updateRecurring = (o) => commit("updateRecurring", { ...o, id: ui.id }, { msg: "Saved" });
  FORMS.addRecurringLine = (o) => commit("addRecurringLine", { productId: o.productId, unitId: o.unitId, qty: o.qty, recurringId: ui.id }, { msg: "Item added" });
  ACTS.rmRecLine = (el) => commit("removeRecurringLine", { recurringId: ui.id, lineId: el.dataset.v });
  ACTS.planRec = (el) => commit("planRecurring", { id: el.dataset.id, date: el.dataset.v }, { after: (soId) => go("so", soId), msg: "Draft order created at today's prices" });
  ACTS.skipRec = (el) => ask(`Skip the ${fdate(el.dataset.v)} order?`, "That one order won't be made. The rest of the schedule stays.", "Skip order", () => commit("skipRecurring", { id: el.dataset.id, date: el.dataset.v }, { msg: "Skipped" }));
  ACTS.recState = (el) => {
    const v = el.dataset.v;
    const run = () => commit("setRecurringState", { id: ui.id, action: v }, { msg: (n) => (v === "resume" ? "Resumed. The next 12 months are planned again." : `${v === "pause" ? "Paused" : "Ended"}. ${n} planned order${n === 1 ? "" : "s"} removed; orders you opened are kept.`) });
    if (v === "resume") run();
    else ask(v === "pause" ? "Pause this recurring order?" : "End this recurring order?", "Planned orders that haven't been opened are removed. Opened orders are kept.", v === "pause" ? "Pause" : "End", run);
  };


  // ---------- MUST CHECK ----------
  const mustCheckBox = () => `<div class="mc-box" data-testid="must-check" role="note" aria-label="MUST CHECK, signature required"><div class="mc-title">MUST CHECK</div><div class="mc-space"></div><div class="mc-line"></div><div class="mc-sig">Signature</div></div>`;
  ACTS.mustCheck = () => { const so = S.sos.find((x) => x.id === ui.id); commit("setMustCheck", { id: so.id, on: !so.mustCheck }, { msg: so.mustCheck ? "MUST CHECK removed" : "Marked MUST CHECK" }); };

  // ---------- pull ticket ----------
  PAGES.pullTicket = () => {
    const so = S.sos.find((x) => x.id === ui.id);
    if (!so) return empty("That sales order no longer exists.");
    const t = DK.pullTicket(S, so);
    const showShop = DK.layoutsOf(S).length > 1;
    const c = S.customers.find((x) => x.id === so.customerId);
    const pc = DK.printCfg(S);
    const rows = (list, short) => `<div class="pt-tw"><table class="pt-table"><colgroup><col style="width:28px"><col><col style="width:96px"><col style="width:112px"><col style="width:130px"><col style="width:64px"><col style="width:64px"></colgroup>
      <thead><tr><th aria-label="Pulled"></th><th>Item</th><th>${short ? "" : "Section · Shelf"}</th><th>${short || !pc.pull.showLot ? "" : "Lot"}</th><th class="n">${short ? "Short by" : "Pull"}</th><th class="pt-pp">Pulled</th><th class="pt-pp">Packed</th></tr></thead>
      <tbody>${list.map((r) => `<tr><td><span class="pt-box" aria-hidden="true"></span></td><td><b>${esc(r.name)}</b>${pc.pull.showSku ? `<div class="pt-sku">${esc(r.sku)}</div>` : ""}</td><td class="pt-spot" data-testid="pt-spot">${short ? "" : r.section ? `<b>${esc(r.section)}</b>${r.shelf ? `<div>Shelf ${esc(r.shelf)}</div>` : ""}` : `<span class="pt-none">—</span>`}</td><td class="pt-lot">${short || !pc.pull.showLot ? "" : esc(r.lot || "—")}${pc.pull.showLot && r.expires ? `<div>exp ${fdate(r.expires)}</div>` : ""}</td><td class="n"><b>${esc(DK.ticketQty(r))}</b></td><td class="pt-pp"><span class="pt-line" aria-label="Pulled"></span></td><td class="pt-pp"><span class="pt-line" aria-label="Packed"></span></td></tr>`).join("")}</tbody></table></div>`;
    const printCss = `<style>@media print { .topbar, .side, .toast, .pending, .busy-bar, body::before, .wrap > :not(.print-area) { display: none !important; } .shell { display: block !important; min-height: 0 !important; } .main { padding: 0 !important; min-height: 0 !important; } #app { min-height: 0 !important; } .wrap { display: block !important; max-width: none !important; animation: none !important; transform: none !important; } html, body { background: #fff !important; height: auto !important; margin: 0 !important; padding: 0 !important; } .pt { border: 0 !important; box-shadow: none !important; padding: 0 !important; max-width: none !important; } } @page { size: letter; margin: 0.5in; }</style>`;
    const done = so.status !== "draft" && so.status !== "confirmed";
    return `${printCss}${head(`Pull ticket · ${esc(so.number)}`, "Items grouped by section, A to Z", `<button type="button" class="btn btn-p" data-act="printNow">Print / PDF</button>`, ["so", so.number, so.id])}
      ${done ? `<div class="banner banner-warn">This order is ${esc(so.status)}; the ticket shows where its items are in stock now.</div>` : ""}
      <div class="print-area"><article class="pt" data-testid="pull-ticket">
        <header class="pt-head"><div><div class="pt-kicker">${esc(pc.header.name)} · Pull ticket</div>${pc.header.address || pc.header.phone ? `<div class="small">${esc([pc.header.address.replace(/\s*\n\s*/g, ", "), pc.header.phone].filter(Boolean).join(" · "))}</div>` : ""}<h1>${esc(so.number)}</h1><div>${esc(c?.name || "")}</div>${pc.pull.showBarcode ? `<svg class="bc" data-code="${esc(so.number)}" style="height:34px;width:170px;margin-top:6px" preserveAspectRatio="none" role="img" aria-label="Barcode ${esc(so.number)}"></svg>` : ""}</div>
          <dl><dt>Ships</dt><dd>${fdate(so.ship)}</dd><dt>Lines</dt><dd>${so.lines.length}</dd><dt>Printed</dt><dd>${esc(new Date().toLocaleString("en-US", { month: "short", day: "numeric", year: "numeric", hour: "numeric", minute: "2-digit" }))}</dd></dl>${so.mustCheck ? mustCheckBox() : ""}</header>
        ${pc.pull.showNotes && so.notes ? `<p class="pt-note">Note: ${esc(so.notes)}</p>` : ""}
        ${!so.lines.length ? `<p>This order has no lines yet.</p>` : ""}
        ${t.shops.map((shop) => `<section>${showShop ? `<h2 class="pt-shop">${esc(shop.name)}</h2>` : ""}${shop.sections.map((sec) => `<div class="pt-sec" data-section="${esc(sec.name)}"><h3>${esc(sec.name)}</h3>${rows(sec.rows)}</div>`).join("")}</section>`).join("")}
        ${t.short.length ? `<div class="pt-sec" data-section="Not in stock"><h3 class="pt-short">Not in stock</h3>${rows(t.short, true)}</div>` : ""}
        ${pc.pull.showLabelLine ? `<div class="row" data-testid="ticket-labels" style="margin-top:14px;align-items:flex-end;gap:8px"><b>Box labels printed:</b><span style="display:inline-block;min-width:4rem;border-bottom:1px solid #111;text-align:center">${so.labelCount ?? ""}</span></div>` : ""}
        <footer class="pt-sign" data-testid="ticket-signatures">${["Pulled by", "Packed by"].map((x) => `<div><div class="pt-sline"></div><span>${x}</span></div>`).join("")}</footer>${pc.header.footer ? `<p class="small" style="white-space:pre-line;text-align:center">${esc(pc.header.footer)}</p>` : ""}
      </article></div>`;
  };


  // =====================================================================
  // Part 3: Messages, Tutorials, Knowledge base
  // =====================================================================
  const HELP = {"tutorials":[{"id":"order-flow","title":"From order to invoice (the full order flow)","summary":"How an order moves from the sales rep to the pick ticket, the warehouse, Delivery/Order Management and the invoice.","who":"Sales rep, warehouse, Delivery/Order Management","steps":[{"text":"Sales rep: open Sales orders, choose the customer and create the order. Add each product, unit and price.","href":"/sales","linkLabel":"Sales orders"},{"text":"Sales rep: set the ship date and check the Deliver to address (it comes from the customer; change it on the order if this delivery goes elsewhere)."},{"text":"Sales rep: if the order needs extra care, tap Mark MUST CHECK. A red MUST CHECK box with a signature line prints in the corner of the pick ticket."},{"text":"Sales rep: tap Send to pull. The order is now Ready to pull."},{"text":"Tap Print pull ticket. It lists items by section of the shop, A to Z, with blank Pulled and Packed lines and Pulled by / Packed by signature lines."},{"text":"Warehouse: pull the items, fill in the ticket and sign it, then hand the ticket back to Delivery/Order Management."},{"text":"Anyone in sales or warehouse: open the order and tap Mark pulled. Stock comes out of the oldest lots first. To choose exact lots instead, use Mark pulled from chosen lots (or scan to pick)."},{"text":"Delivery/Order Management: check the returned ticket against the order, then tap Mark completed. Made a mistake? Send back to Pulled."},{"text":"Delivery/Order Management or sales: on a Completed order, set the sales tax % (leave 0 for resale-exempt customers) and tap Create invoice."},{"text":"Print the invoice. It shows the billing location address, the delivery address and which shop it ships from.","href":"/invoices","linkLabel":"Invoices"}],"tip":"The bar at the top of every order shows where it is: Draft, Ready to pull, Pulled, Completed, Invoiced."},{"id":"pull-ticket","title":"Print and use a pull ticket","summary":"Get a one-page ticket the warehouse can walk the shop with.","who":"Sales rep, warehouse","steps":[{"text":"Open the order (it must be Draft or Ready to pull) and tap Print pull ticket.","href":"/sales","linkLabel":"Sales orders"},{"text":"Check the header: customer, ship date, number of lines. MUST CHECK shows in red at the top right if it was set."},{"text":"Tap Print / PDF. Letter size, black and white."},{"text":"Lines are grouped by the section of the shop where the stock is, and A to Z inside each section. Each line names the lot to pull from."},{"text":"Anything short on stock appears under Not in stock with how much is missing."},{"text":"Tick the box and fill in Pulled and Packed for each line, then sign Pulled by and Packed by at the bottom."}],"tip":"If you own more than one shop, the ticket groups by shop first, then section."},{"id":"receive","title":"Receive a purchase order","summary":"Bring stock in, split into lots, and print labels.","who":"Staff, warehouse","steps":[{"text":"Staff: create a purchase order for the vendor, add lines and mark it Ordered.","href":"/purchasing","linkLabel":"Purchasing"},{"text":"When the truck arrives, open Receiving and choose the order.","href":"/receiving","linkLabel":"Receiving"},{"text":"Enter what actually arrived for each line and the location it goes to (and an expiry date where it applies)."},{"text":"Save. Each delivery becomes a lot with its own code, cost and received date."},{"text":"Open Lot labels from the order to print a label for each lot.","href":"/labels","linkLabel":"Labels"},{"text":"If the order is only partly delivered it stays open. Close the order when nothing more is coming."}]},{"id":"labels","title":"Print lot and product labels","summary":"Labels for a roll printer or an ordinary printer.","who":"Warehouse, staff","steps":[{"text":"Open Labels, or tap Print label on a product or Lot labels on a purchase order.","href":"/labels","linkLabel":"Labels"},{"text":"Choose lots or products and the number of labels for each."},{"text":"In Settings → Printing, choose Label printer (thermal or roll) or Regular printer (plain paper). This is saved on that computer only.","href":"/settings","linkLabel":"Settings"},{"text":"Tap Print. Each label has a scannable barcode for the lot."}]},{"id":"floor-plan","title":"Draw your shop in Location in shop","summary":"Shape sections to match the real floor, set the size in feet, and mark doors.","who":"Warehouse, admin","steps":[{"text":"Open Location in shop. If you own several shops, use the shop menu to pick one or add another.","href":"/floor-plan","linkLabel":"Location in shop"},{"text":"Enter the real width of the floor in feet. The grid and the sizes shown update to match."},{"text":"Tap a section to select it. Drag it to move. Drag a corner dot to reshape it, tap a + to add a corner, double-tap a corner to remove it."},{"text":"Drag the handles on the outer frame to resize and the round handle to rotate."},{"text":"Add an Entry or Exit and name it if you have more than one."},{"text":"Pick a product and tap a section to set where it lives (its home). Stock that is somewhere else shows differently so you can tell."}]},{"id":"counter","title":"Ring up a counter sale","summary":"A walk-in sale that is paid for on the spot.","who":"Sales","steps":[{"text":"Open Counter sale. Walk-in is the default customer.","href":"/counter","linkLabel":"Counter sale"},{"text":"Scan or search for products and set quantities."},{"text":"Choose how the customer pays: cash, card or check. For a card terminal, send the amount to the terminal."},{"text":"Finish the sale. Stock is pulled, the order is completed and an invoice is created and marked paid in one step."}]},{"id":"returns","title":"Record a return and give a credit","summary":"Put resellable items back in stock, write off damaged ones, and credit the customer.","who":"Sales, warehouse","steps":[{"text":"Open the order the goods came from (it must be Pulled, Completed or Invoiced)."},{"text":"Under Returns & credits, tap Record a return."},{"text":"Enter the quantity for each line. Leave Restock ticked for items that can be resold; untick for damaged items (they are written off as shrink)."},{"text":"Add a reason and save. The credit uses the price on the order plus the invoice's tax."},{"text":"Mark the credit Applied (used on a later invoice) or Refunded (money returned).","href":"/returns","linkLabel":"Returns & credits"}]},{"id":"payments","title":"Take a deposit or payment","summary":"Record money against an order or invoice.","who":"Sales","steps":[{"text":"Open the order or the invoice and find the Payments panel."},{"text":"Before an order is invoiced, a payment is a deposit. After, it counts toward the invoice."},{"text":"Pick the method, enter the amount (and tip if any) and save."},{"text":"When payments cover the invoice total it is marked paid automatically. A mistaken payment can be voided, which reopens the invoice.","href":"/payments","linkLabel":"Payments"}]},{"id":"recurring","title":"Set up a recurring order","summary":"Orders that repeat each week for a customer.","who":"Sales","steps":[{"text":"Open the customer and tap Recurring order next to New sales order.","href":"/customers","linkLabel":"Customers"},{"text":"Name it, choose the days it repeats and add the products."},{"text":"Planned orders appear under Sales orders → Recurring (planned) and move to your list a week before they ship."},{"text":"Edit any one planned order without changing the rest, or skip it. Pause or end the whole series from the recurring order page."}]},{"id":"web-store","noImages":true,"title":"Connect the web store","summary":"Bring website stock counts and orders into the app.","who":"Admin","steps":[{"text":"Open Settings → Web store.","href":"/settings/web-store","linkLabel":"Web store"},{"text":"Copy the webhook address and secret into your ordering website's settings."},{"text":"Use Sync now to bring in current stock counts. Live webhooks keep it up to date after that."},{"text":"Each web order becomes a Ready to pull sales order, once. The website stays the source of truth for stock numbers."}]},{"id":"messenger","title":"Use Messages","summary":"Chat with your team, start a group, react and send GIFs.","who":"Everyone","steps":[{"text":"Open Messages. Team channels (Everyone, plus the one for your role) are on the left.","href":"/messages","linkLabel":"Messages"},{"text":"Tap New chat → One person to message someone directly, or Group to name a group and tick who is in it (at least two others)."},{"text":"Type and press Enter to send. Shift+Enter starts a new line."},{"text":"Tap ☺ + under a message to react. Tap a reaction to add or remove yours."},{"text":"Tap GIF to search GIFs. If it asks for a link, an admin hasn't added a GIPHY key yet; paste a GIF link instead."},{"text":"A number beside a chat (and beside Messages in the menu) shows what you haven't read."}]},{"id":"users","noImages":true,"title":"Add people and set their role","summary":"Who can do what.","who":"Admin","steps":[{"text":"Ask the person to sign up on the login page. New people start inactive."},{"text":"Open Settings → Users & roles.","href":"/admin/users","linkLabel":"Users & roles"},{"text":"Choose their role and turn them active. Admin: everything. Staff: products, vendors, purchasing, receiving. Warehouse: locations, stock, pulling. Sales: customers, orders, invoices. Delivery/Order Management: completes pulled orders, invoices."}],"tip":"The first person to sign up becomes the admin."}],"articles":[{"id":"order-statuses","category":"Orders","title":"What each order status means","body":["Draft: the sales rep is still building the order. It can be edited or deleted.","Ready to pull: the order was sent to the warehouse and the pick ticket can be printed. Lines are locked.","Pulled: the items were taken from stock (oldest lots first, or lots you chose). Stock counts drop at this point.","Sent back to sales: Delivery/Order Management found a problem on a pulled order. Sales fixes the quantities and sends it on, and it returns to Pulled.","Completed: Delivery/Order Management checked the returned pick ticket. Only completed orders can be invoiced.","Invoiced: an invoice exists. If the invoice is voided, the order goes back to Completed.","Cancelled: the order was cancelled before it was pulled, or sales denied a customer order (the customer sees the reason). Orders with payments recorded can't be cancelled until the payments are voided.","The bar at the top of every order shows where it is. The step it is on is filled in, with who does the next job underneath."],"images":["The step bar on an order that is Pulled and waiting for Delivery/Order Management."]},{"id":"roles","category":"Orders","title":"Who can do what","body":["Admin can do everything, including adding users and the web store connection.","Sales can create and edit orders, set MUST CHECK, send orders to pull, invoice, take payments and manage customers.","Warehouse can mark orders pulled, record returns, move and count stock, and edit the shop floor plan.","Staff manage products, vendors, purchase orders and receiving.","Delivery/Order Management marks pulled orders Completed (or sends them back), creates and voids invoices, and builds delivery routes.","Routing: Delivery/Order Management, warehouse and admins can change routes. Everyone else can look at them.","Customer is for a shop that orders from you. A customer login only gets the Shop page and their own display settings. See Customer logins and the shop. This is separate from the Staff role.","Everyone signed in and active can read orders, stock and use Messages."]},{"id":"customer-logins","category":"Orders","title":"Customer logins, the shop and the sales catalog","body":["A customer with a login can browse your items, see their own prices and add things to a cart. The cart is saved on their account, so it is still there next time they sign in. When they place it, it becomes a draft sales order that sales approves. See Shopping cart and order summary. They cannot see anything else in the system.","Before a login can be set up the customer needs a name, an address, a phone number, a route and a sales rep. The route is one to three letters, such as NOR, and groups deliveries. The rep is the sales person who looks after that customer. Usual payment is optional: leave it on Ask on each order and the customer picks cash, card or check every time.","Two discounts, kept separate. The sales discount % comes off every price. The cash discount % only applies when an order is paid in cash. Both are set on the customer page by sales or an admin.","Setting up a login takes two people. Sales or an admin opens Customer logins, picks the customer, types the person's name, a username and a password, and presses Create login. Give the username and password to the customer. They sign in with just those on the login page. Staff keep signing in with their email.","A different sales person or admin then presses Verify on the same row. To change a password, type a new one on the row and press Set. Nobody can verify a login they set up themselves. Until it is verified the customer cannot shop. Remove takes the access away again.","Prices a customer sees come from, in order: a price set just for them, otherwise the tier price (or the usual markup) less the customer's Discount %. Set the discount on the customer page. They also see the exact number available, which is stock on hand less what is already waiting on confirmed orders.","The Sales catalog is the same list for staff. Pick a customer and each item shows what they would pay. Type a price under This customer only to give them a special price, or under the tier price to change it for everyone in that tier. Leave a box empty to go back to the normal price. Add items to the cart and press Create draft order.","Open orders lists every order a customer sent in, with the assigned rep shown on each. The rep also sees a number beside Open orders in the menu. Press Approve to send it to be pulled, Edit to change it first, or Deny and type a reason. The customer sees Denied with your reason. Until you decide, they see Waiting for approval.","On the shop page a customer sees their orders with the items on each. Buy again shows things they have ordered before, and Add these to the cart copies a past order into the cart."],"images":["Create the login here with a username and password. The customer account must already have a route, address, phone and sales rep.","A second person presses Verify before the customer can shop.","On the Sales catalog, type a price for this customer only, or change the tier price.","The customer's shop shows their price and how many are available. Press Add.","Send order turns the cart into a draft order for sales to approve.","Open orders shows the assigned rep on each order, with Approve, Edit and Deny."]},{"id":"cart","category":"Orders","title":"Shopping cart and order summary","body":["Press Add on any item and it goes into the cart. The count on the cart button at the top of the shop goes up.","Press the cart button and the cart slides in from the right. Change amounts there, or press View cart & order summary. Close it with ✕, Keep shopping, or by tapping outside it. The cart is saved on the customer's account, not the device.","On the cart page, change a quantity with the - and + buttons or type it in. Save for later moves a line out of the order but keeps it on the page; Move to cart brings it back.","The order summary on the right is the live invoice: items, how much their prices save, the cash discount if they pay cash, and the estimated total. It updates as the cart changes. Print prints it.","Stock is not held while something sits in a cart. If there is not enough, the cart says Only N left and the order cannot ask for more than is there.","Pick how they will pay, add a note, and press Place order. There is no extra review step. The order goes to Open orders for sales to approve. Saved for later items stay behind."]},{"id":"customer-page","category":"Orders","title":"Customer page: shopping for a customer on the phone or at the counter","body":["Sales and admins have Selling → Customer page. Pick a customer (your own customers are listed first) and you see the shop exactly as they see it, with their prices.","You build your own cart for that customer. It is separate from the customer's own online cart, and each customer has their own cart for you.","If the customer already has items in their online cart, a bar says so. Press Pull in their online cart to add those items to yours. Their own cart is left as it was.","Orders you place from the Customer page are approved right away and go straight to Ready to pull. They do not wait in Open orders."]},{"id":"returned-labels-routes","category":"Orders","title":"Sending an order back, box labels and route sheets","body":["Pulled orders get checked before they are invoiced. If something is wrong, Delivery/Order Management types what sales needs to fix in the box on the order and presses Send back to sales. The order moves to Sent back to sales and shows the note.","Sales then changes the quantity on each line to what was really pulled. A quantity can only go down. The difference goes back on the shelf, into the same lots it came from, and the cost updates. Set a line to 0 to take it off. Press Save and send to Delivery/Order Management and it returns to Pulled for the check. If sales cannot fix it, use Returns & credits instead.","Box labels: once an order is ready to pull, type how many boxes on the order page and press Print box labels. Each label carries the shop name, the address it is going to, the route, Box 1 of 3 style numbering and the same barcode as the pull sheet. They print on the label printer chosen in Settings. The count is saved and shows on the pull sheet in the line Box labels printed.","Invoices: Print an invoice and you get two copies, a Customer copy and an Office copy, one after the other.","Route sheets: Routing groups orders by the customer's 3 letter route. Pick a route code at the top to see only those orders. Scan each invoice in, press Closest to farthest, then print. Every stop shows how many boxes to expect, from the label count, and the bottom of the sheet totals the boxes. Each route code keeps its own sheet for the day."],"images":["Delivery/Order Management sends a pulled order back to sales with a note.","Sales sees the note and lowers the quantities. The difference goes back on the shelf.","Type how many boxes, then print the labels.","One label per box: shop, address, route, Box 1 of 3, and the order barcode.","The pull sheet shows how many box labels were printed.","Pick a route code to see only that route's orders.","The route sheet shows boxes expected per stop and in total.","Print gives a customer copy and an office copy."]},{"id":"passwords-printouts","category":"Settings","title":"Passwords, resets and customizing printouts","body":["Changing your password: open Settings, find Password, type the current one and the new one twice. This works for everyone, customers included.","Forgot password: the sign-in page has a Forgot password link. The customer types their username. If the customer account has an Email, a reset link goes to that address. If it has no email, the customer's request appears for sales and admin under Customer logins (with a number beside it in the menu). Press Approve, and the customer then opens My reset was approved on the same page and chooses a new password. An approval stays valid for 24 hours and works once. The page gives the same answer whether or not the username exists.","Password hint (customers): in Settings, Password, a customer can add an optional hint. After a wrong password the sign-in page offers Show password hint. Anyone who types the username can see the hint, so the app refuses hints that contain the password.","Sending reset links needs the server set up with a site address and an email service key. Without them, every reset goes through approval.","Customize printouts (admin only, under Settings): set the business name, address, phone and footer that print on invoices, pull sheets and route sheets. On the invoice you can change the Customer copy and Office copy titles, add terms and a note, and show or hide SKU, order notes, barcode and resale certificate. Pull sheets can hide SKU, lot and expiry, notes, the barcode and the Box labels printed line. Route sheets can hide the phone and the expected box count. Box labels can hide the address and the route. The shop name, Box x of y and the barcode always print. There is no logo.","Printers: under Settings, Printing, type the name of your label printer and your regular printer as they appear in the print dialog. Browsers cannot list or pick printers by themselves, so the name is a reminder: box labels say to choose the label printer, and other printouts show the regular printer's name on the Print button. The names are saved on that computer only, so each workstation can have its own."]},{"id":"must-check","category":"Orders","title":"MUST CHECK","body":["Sales reps can flag any order MUST CHECK with a button at the top of the order, at any status.","The red MUST CHECK box shows on the order and prints in the top right of the pull ticket with a line underneath for a signature.","Remove it with the same button once the check is done."]},{"id":"delivery-address","category":"Orders","title":"Delivery address vs location address","body":["A customer has a location address (where the business is) and an optional delivery address.","A new order copies the delivery address, or the location address if there is no delivery address. You can change it on that one order under Details → Deliver to.","Invoices show both: Bill to · location, and Deliver to. They also show which shop the order ships from (set Ships from on the order if you have more than one shop).","Routing uses the order's Deliver to address, so fix it on the order if a stop looks wrong."],"images":["Deliver to on a draft order. Change it here when this delivery goes somewhere else.","An invoice with Bill to, Deliver to and Ships from."]},{"id":"pull-ticket-guide","category":"Orders","title":"Reading and signing a pull ticket","body":["Open an order that is Ready to pull and tap Print pull ticket. It is one letter-size page, black and white.","The header shows the order number, customer, ship date and number of lines. A red MUST CHECK box with a signature line prints in the top right when the order has that flag.","Lines are grouped by the shop section where the stock is now, A to Z inside each section. Each line names the lot to pull from. Anything short on stock is listed under Not in stock with how much is missing.","Each line has a tick box and blank Pulled and Packed lines. At the bottom are Pulled by and Packed by signature lines. Fill them in and hand the ticket back to Delivery/Order Management."],"images":["The ticket header, with order, customer and ship date.","A section of the ticket with the tick box, lot, quantity, and Pulled and Packed lines.","The Pulled by and Packed by signature lines at the bottom."]},{"id":"routing-day","category":"Orders","title":"Routing: build a day's delivery route","body":["Open Selling → Routing. Pick the Delivery day. The list is every Completed or Invoiced order that ships that day from the chosen shop. The route starts at the shop's address and ends at the last stop; there is no trip back.","Tap Closest to farthest to sort the stops by distance from the shop, or use the up and down arrows to set the order yourself. Remove takes an order off the route and it moves to Not on this route, where Add puts it back.","Under each stop you can see the delivery address and the miles from the stop before it. The total shows the number of stops, miles and a driving-time estimate.","Open in Google Maps opens the whole route in Google Maps with every stop in order. More than 10 stops are split into several links, each one starting where the last ended.","Type the driver's name, then Save route to keep the order. Print route sheet prints a sheet with a tick box beside each stop.","You can also add orders by scanning an invoice barcode. See Adding orders to a route by scanning the invoice.","In the full app the first time an address is used it is looked up with Google and remembered. This needs the Google Maps key (see Setting up Google Maps for Routing). In the demo the map positions are made up."],"images":["Pick the delivery day. The orders that ship that day are listed.","Closest to farthest sorts the stops by distance from the shop.","Use the arrows to move a stop up or down.","Open in Google Maps opens the whole route.","Print route sheet prints the driver's copy."]},{"id":"maps-setup","category":"Settings","title":"Setting up Google Maps for Routing (admin)","body":["Routing needs a Google Maps key so it can find addresses and open real roads. Without it you can still order stops by hand and use the Open in Google Maps links.","In Google Cloud (console.cloud.google.com) create a project and attach billing. Google asks for a card, but this use normally stays within the free monthly credit.","Under APIs & Services → Library enable Geocoding API and Routes API. Under Credentials create an API key.","Edit the key: under Application restrictions choose Websites and add your site's address. Under API restrictions allow only those two APIs. This stops anyone else using the key.","In the app open Settings → Maps & routing (admins only). Paste the key and save. Also fill in each shop's address on that page; the route starts there."],"images":["Maps & routing settings: paste the key here.","Each shop's address is the starting point of its routes."]},{"id":"gif-setup","category":"Messages","title":"Setting up GIF search in Messages (admin)","body":["GIF search uses GIPHY. Without a key people can still paste a GIF link into a message.","Go to developers.giphy.com, sign in, choose Create an App and pick API (not SDK). Copy the key it gives you.","Add it where the app is hosted as an environment variable named GIPHY_API_KEY, then redeploy. On Vercel that is Project → Settings → Environment Variables.","New GIPHY keys start in a limited beta mode, which is fine for a small team. Apply for production access later if you hit the limit.","Then the GIF button in a chat opens a search box."],"images":["The GIF button is next to the message box."]},{"id":"scan-box-return","category":"Stock","title":"Returning a received box to the vendor (scan the box label)","body":["Every lot you receive gets a label with a barcode (Lot labels on the purchase order, or Labels). Print one label per physical box; they all carry the same lot code.","To start a return, scan the box label on the Scan page, with a handheld scanner or the Camera button on a phone. The lot page opens.","Under Return to vendor you will see the vendor and their email, the purchase order, product, quantity received, cost, lot code and received date.","Tap Email vendor to open a draft addressed to the vendor with all of that filled in. Add the reason and send it from your mail app. Copy details copies the same text.","If the vendor has no email, add it on the vendor page first. Credits you receive from the vendor are not tracked in the app yet."],"images":["Lot labels on a received purchase order print a barcode label for each lot.","Scan the box label (or type its code) on the Scan page.","Return to vendor on the lot page. Email vendor opens the draft."]},{"id":"scan-route","category":"Orders","title":"Adding orders to a route by scanning the invoice","body":["Every invoice prints a barcode of its invoice number at the bottom right.","On Routing, scan that barcode (scanner or Camera) to add the order to the day's route. Scanning an order number works too.","Only Completed or Invoiced orders can be added. An order that ships on a different day is added and marked with its ship date.","Scanning an order that is already on the route just tells you so. Tap Save route to keep the changes."],"images":["The invoice barcode, bottom right of every invoice.","Scan the barcode into the box on Routing."]},{"id":"pull-order","category":"Stock","title":"How stock is chosen when an order is pulled","body":["Mark pulled takes stock from the oldest lots first (by received date), so older flowers go first.","Mark pulled from chosen lots lets you pick exact lots or scan them. The quantities must add up to the line.","If there isn't enough stock, the order is blocked and nothing is taken. The pick ticket lists what is short."]},{"id":"lots","category":"Stock","title":"Lots, units and costs","body":["Every delivery creates a lot with a code, received date, expiry date, location and cost.","Products have a base unit (usually the stem) and other units such as bunch or box, each with a conversion. Stock is always counted in the base unit.","Cost uses FIFO: an order's cost is the cost of the lots it was pulled from. Margin on an order is price minus that cost.","Landed cost includes freight shared across the lines of a purchase order."]},{"id":"shrink","category":"Stock","title":"Shrink, adjustments and counts","body":["Shrink is stock that is lost, damaged or thrown out. Record it with a reason so reports show where losses come from.","An adjustment corrects a lot's quantity after a count.","Resellable returns go back into the lots they came from. Returned items marked not resellable are written off as shrink automatically."]},{"id":"floor-plan-faq","category":"Stock","title":"Shop floor plan basics","body":["Each shop has its own layout and its own sections. Sections can be any shape.","Sizes are in feet, based on the floor width you enter. The grid shows foot squares.","A product's home is the section where it belongs. Stock sitting somewhere else is shown so you can find and move it.","The pull ticket groups lines by the section the stock is in right now.","Moving a section to another shop clears its old shape and the product homes that pointed to it."]},{"id":"sections-shelves","category":"Stock","title":"Sections and shelves inside a location","body":["A location (Cooler 1) can hold sections (Rack A, Bucket row), and each section can have shelves (1, 2, 3 or Top, Middle, Bottom).","Add one: Location in shop → Edit layout → + Add section. Pick the location, or + New location…, name the section and list its shelves. 1-4 makes shelves 1 to 4. It appears on the plan inside its location; drag and resize it like any area.","Tap a section to edit, rename or delete it. Tap a location to rename it or add a section to it.","Where stock sits: on a lot's page, set Section and shelf. Moving stock to another location clears it.","An item's usual spot: on the item's page, under its home area, set Usual section and shelf.","Pull tickets show Section · Shelf for each line: the stock's own spot, else the item's usual spot when the stock is in its home location. Lines are sorted by section, then shelf."]},{"id":"documents","category":"Settings","title":"Documents: Word editor and signing","body":["Documents (in the menu) has three tabs: Word editor, Send for signing, and To sign. Every staff role can use them; customers only sign what they're sent.","Word editor: write with headings, fonts, sizes, colours, lists and links. It saves as you type. Import .docx brings in a Word file and Export .docx gives one back. Your documents are private: nobody else can see them.","Writing diary: text is tagged with the day you wrote it. Start new day begins a fresh count; edits to older text keep their original day, but the word change counts for today.","Send for signing: + Add PDF, then Mark fields to place Signature, Initials, Text and Checkbox boxes on the pages (common ones like Signature: and Date: are suggested for you). Send to… emails a signing link from your account; replies come to your account email.","Who can sign: if the email belongs to a DKaydent login, that person signs while signed in to that account (it appears under their To sign). Anyone else types the email the link was sent to before it opens.","Signing: type or draw a signature and initials, tap each box to fill it, fill text boxes, then Submit. The signed PDF gets a certificate page (who, how they were checked, sender, IP, device and time). The sender is emailed when it's signed, and Sent shows it with a Download button.","Email uses the same Resend setup as password resets (RESEND_API_KEY). Without it, Send to… shows the link to copy and send yourself."]},{"id":"labels-faq","category":"Stock","title":"Label printing","body":["Choose Label printer for a roll or thermal printer, or Regular printer for plain paper, in Settings → Printing.","That choice is saved on the computer you are using, so each workstation can use its own printer.","If labels print with extra blank pages, check the printer's paper size is set to the label size in your print dialog.","Every label shows the day it was printed."]},{"id":"invoices-faq","category":"Money","title":"Invoices, tax and terms","body":["Terms come from the customer (Net 30 by default) and set the due date.","Sales tax is typed when you create the invoice. Leave 0 for resale-exempt customers; the resale certificate number is kept on the customer and printed on the invoice.","Void an open invoice to correct the order; it goes back to Completed so you can invoice again. Paid invoices, or invoices with payments, can't be voided until the payments are voided."]},{"id":"payments-faq","category":"Money","title":"Deposits, partial payments and terminals","body":["Money taken before invoicing is a deposit and is applied to the invoice when it is created.","Partial payments keep the invoice open and show the balance.","Card payments can be sent to a payment terminal. If a payment is declined it stays on record as declined and does not count.","Voiding a payment reopens a paid invoice."]},{"id":"returns-faq","category":"Money","title":"Returns and credits","body":["You can only return what was sold, and not more than what is still returnable on the line.","The credit is at the price on the order plus the invoice's tax rate.","A credit starts Open. Mark it Applied when it is used on a later invoice, or Refunded when money is returned."]},{"id":"recurring-faq","category":"Orders","title":"Recurring orders","body":["A recurring order creates planned draft orders on the days you choose.","Planned orders stay under Recurring (planned) until a week before they ship, then join the normal list.","Editing a planned order marks it as edited, and it is left alone if you later change the series.","Skipping a planned order cancels just that one."]},{"id":"web-store-faq","category":"Web store","title":"How the web store connection behaves","body":["The website is the source of truth for stock numbers. Counts come in as the supply figure; what you pull in the app is subtracted from them.","Each web order creates one Ready to pull order, even if the website sends it twice.","A cancelled web order cancels the matching order only if it hasn't been pulled yet.","Use Sync now any time, and check the log on the Web store page if a number looks wrong."]},{"id":"messages-faq","category":"Messages","title":"Messages: channels, privacy and GIFs","body":["Team channels are shared: Everyone, Sales, Warehouse and Buyers. You only see the channels for your role (admins see all).","Direct chats and groups are private to the people in them. Admins can't read them.","Messages are kept; there is no edit or delete yet.","GIF search needs a GIPHY key (see Setting up GIF search in Messages). Without it you can paste a GIF link.","Messages arrive live. If your host doesn't support live updates, the page refreshes every 5 seconds.","New chat starts a direct chat or a group. A number beside a chat, and beside Messages in the menu, is what you haven't read."],"images":["New chat starts a direct chat or a group.","GIF opens the GIF search (or asks for a link if no key is set up)."]},{"id":"appearance","category":"Settings","title":"Appearance and printing settings","body":["Settings → Customize page sets the colour palette and light, dark or follow-my-device. There are 10 ready-made palettes, including High contrast (stronger borders and extra-dark text). It is saved on that device.","Make your own: pick one colour, type a hex code, or choose a photo and tap one of the colours found in it. The rest of the theme is worked out for you, with text kept easy to read in light and dark. The photo is read in your browser and is not uploaded or kept. Your theme is saved on that device only; Go back to the default colours clears it.","Font: pick any of 12 open-source typefaces for yourself, including OpenDyslexic (made to help people with dyslexia), Lexend and Atkinson Hyperlegible (both made for easier reading). Choose Palette default to go back. Each person's choice is saved on their own device.","Invoices, labels and pull tickets always print in black and white whatever palette is chosen.","Printing settings (label or regular printer) are saved per computer."],"images":["The Font section of Settings → Customize page. Tap a font to use it right away."]},{"id":"help-guide","category":"Settings","title":"Using Tutorials and the Knowledge base","body":["Settings → Tutorials has step-by-step guides for the main jobs. Each step has a picture with an orange box and arrow showing what to tap or fill in.","Tap a name at the top of the page to jump to a guide. Links beside a step open the right page.","Settings → Knowledge base explains how things work. Search finds articles and tutorials, best match first, and marks the matching words; it understands plurals and word endings (shelves finds shelf). Pick a category to narrow it.","Anyone on the team can tap + Write an article to add what they know: a title, a category (or a new one) and the text, one paragraph per point. You can edit or remove your own articles.","Admin can edit or remove any article, hide one (Show hidden brings it back into view for admin), and reword a built-in article. Restore original puts a built-in article back the way it shipped.","Tutorials show the demo's screens, so colours and fonts may differ slightly from yours."],"images":["Tutorials and Knowledge base are in the Help part of Settings.","Every step has a picture with an arrow.","Search the Knowledge base by any word."]},{"id":"phone","category":"Settings","title":"Using the app on a phone","body":["Tap the menu button at the top left to open the slide-in menu. Groups (Buying, Stock, Selling, Reports & data, Settings) fold open and closed, and the app remembers which are open.","Floor plans, labels and pull tickets work on a phone, but print from a computer when you can.","Messages opens on the chat list on a phone. Tap a chat to open it and the arrow to go back."]},{"id":"import-export","category":"Settings","title":"Import and export data","body":["Reports & data → Import data brings in products, vendors and customers from CSV files. A preview shows problems before anything is saved.","Export CSV buttons on lists download what you are looking at."]}],"cats":["Orders","Stock","Money","Web store","Messages","Settings"]};
  // The demo has no web store or user admin screens, so those guides are left out here.
  const HELP_SKIP = new Set(["web-store", "users", "web-store-faq", "maps-setup", "gif-setup"]);
  const HELP_GO = { "/sales": "sales", "/invoices": "invoices", "/purchasing": "purchasing", "/receiving": "receiving", "/labels": "labels", "/settings": "settings", "/floor-plan": "floorplan", "/counter": "counter", "/returns": "returns", "/payments": "payments", "/customers": "customers", "/messages": "messages" };

  const chatState = () => (ui.chat ||= { active: "team-everyone", thread: false, newOpen: false, mode: "dm", picker: null, gif: false });
  const readKey = () => "dk-chat-read-" + ui.role;
  const readMap = () => { try { return JSON.parse(store.get(readKey(), "{}")); } catch { return {}; } };
  const markRead = (id) => { const m = readMap(); m[id] = new Date().toISOString(); store.set(readKey(), JSON.stringify(m)); };
  const chatsFor = () => DK.chatChannelsFor(S, ui.role);
  const chatMsgs = (id) => ((S.chat && S.chat.messages) || []).filter((m) => m.ch === id);
  const unreadIn = (id) => { const r = readMap()[id] || ""; return chatMsgs(id).filter((m) => m.by !== ui.role && m.at > r).length; };
  function chatUnreadTotal() { return mode === "loading" || mode === "empty" ? 0 : chatsFor().reduce((n, c) => n + unreadIn(c.id), 0); }
  const personName = (r) => DK.PEOPLE[r] || "Someone";
  const chanLabel = (c) => (c.kind === "dm" ? personName(c.members.find((m) => m !== ui.role) || "") : c.name);
  const EMOJI = ["👍", "❤️", "😂", "🎉", "👀", "✅", "🔥", "🙏", "😮", "😢", "💐", "🌹", "🚚", "❗", "👏", "💯"];
  const tFmt = (d) => new Date(d).toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });
  const dFmt = (d) => new Date(d).toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });

  PAGES.messages = () => {
    const st = chatState();
    const chans = chatsFor();
    if (!chans.some((c) => c.id === st.active)) st.active = chans[0].id;
    const cur = chans.find((c) => c.id === st.active);
    markRead(cur.id);
    const msgs = chatMsgs(cur.id).slice(-150);
    const rx = (S.chat && S.chat.reactions) || {};
    const row = (c, pre) => { const n = c.id === cur.id ? 0 : unreadIn(c.id); return `<li><button type="button" data-act="chatPick" data-v="${esc(c.id)}" ${c.id === cur.id ? 'aria-current="true"' : ""} data-channel="${esc(chanLabel(c))}"><span class="trunc"><span class="faint">${pre}</span> ${esc(chanLabel(c))}</span>${n ? `<span class="nav-badge" aria-label="${n} unread">${n}</span>` : ""}</button></li>`; };
    let lastDay = "", prev = null;
    const thread = msgs.map((m) => {
      const day = dFmt(m.at), showDay = day !== lastDay; lastDay = day;
      const mine = m.by === ui.role, showName = !prev || prev.by !== m.by || showDay; prev = m;
      const counts = {};
      for (const [who, e] of rx[m.id] || []) { (counts[e] ||= { n: 0, mine: false, who: [] }); counts[e].n++; counts[e].who.push(personName(who)); if (who === ui.role) counts[e].mine = true; }
      return `${showDay ? `<div class="chat-day">${day}</div>` : ""}<div class="chat-msg ${mine ? "mine" : ""}">
        ${showName ? `<div class="chat-who"><b>${mine ? "You" : esc(personName(m.by))}</b> · ${tFmt(m.at)}</div>` : ""}
        <div class="chat-bubble" data-msg="${esc(m.body || "gif")}">${esc(m.body)}${m.gif ? `<img src="${esc(m.gif)}" alt="GIF" loading="lazy" referrerpolicy="no-referrer" onerror="this.replaceWith(Object.assign(document.createElement('span'),{textContent:' (GIF couldn\u2019t load)'}))">` : ""}</div>
        <div class="chat-react">${Object.entries(counts).map(([e, c]) => `<button type="button" class="rx ${c.mine ? "on" : ""}" aria-pressed="${c.mine}" title="${esc(c.who.join(", "))}" data-act="chatReact" data-id="${m.id}" data-v="${e}">${e} ${c.n}</button>`).join("")}
          <button type="button" class="rx add" data-act="chatPicker" data-v="${m.id}" aria-label="Add reaction" aria-expanded="${st.picker === m.id}">☺ +</button></div>
        ${st.picker === m.id ? `<div class="rx-pick" role="group" aria-label="Reactions">${EMOJI.map((e) => `<button type="button" data-act="chatReact" data-id="${m.id}" data-v="${e}" aria-label="React ${e}">${e}</button>`).join("")}</div>` : ""}
      </div>`;
    }).join("");
    const others = Object.keys(DK.PEOPLE).filter((r) => r !== ui.role);
    const dialog = st.newOpen ? `<div class="modal-bg" data-act="chatNewClose"><div class="modal" role="dialog" aria-modal="true" aria-label="New chat" data-stop>
        <div class="tabs" role="tablist"><button type="button" role="tab" aria-selected="${st.mode === "dm"}" data-act="chatMode" data-v="dm">One person</button><button type="button" role="tab" aria-selected="${st.mode === "group"}" data-act="chatMode" data-v="group">Group</button></div>

  // ---- Routing (demo): the day's completed orders, stop order, distances and Google Maps links
  const ROUTE_OK = ["completed", "invoiced"];
  const routeDay = () => {

  };
  const routeSave = (d, ids, extra = {}) => commit("routeSave", { date: d.date, code: d.code, start: extra.start ?? d.start, driver: extra.driver ?? d.driver, stops: ids });
  const routeLegs = (d) => {
    let prev = DK.routeGeo(d.start), total = 0;
    const rows = d.ids.map((id) => {
      const o = d.byId.get(id), pt = DK.routeGeo(o.deliveryAddress);
      let mi = null;
      if (pt && prev) { mi = DK.miles(prev, pt); total += mi; prev = pt; }

    return { rows, total };
  };
  const routeMap = (d, legs) => {

    const X = (v) => pad + ((v - c) / (e - c || 1)) * (W - pad * 2), Y = (v) => H - pad - ((v - a) / (b - a || 1)) * (H - pad * 2);
    return `<svg class="route-map" viewBox="0 0 ${W} ${H}" role="img" aria-label="Sketch of the route: the shop, then each stop in order"><rect x="0" y="0" width="${W}" height="${H}" rx="14" class="rm-bg"/>

  };

      ${!d.elig.length ? empty("No completed orders ship on this day. Try another date (the sample data has orders on most days in October).") : `

          ${legs.rows.length ? `<p class="small faint" style="margin:0 0 8px">Starts at the shop, ends at the last stop (no trip back).</p><ol class="route-list">${legs.rows.map(stopRow).join("")}</ol>

  Object.assign(ACTS, {
