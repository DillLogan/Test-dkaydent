<style>
/* Layout: app shell like the real product — sidebar of operations on the left, working surface on the right; collapses to a top bar on phones.
   Palette: cool stone neutrals with a slight leaf bias, cooler-green brand, peony as the "demo" marker. */
:root {
  --bg: #f6f7f5;
  --surface: #ffffff;
  --surface-2: #f0f2ef;
  --line: #dfe3dd;
  --line-soft: #ebeee9;
  --fg: #1d221e;
  --muted: #5f6a62;
  --faint: #8b958d;
  --brand: #2e5234;
  --brand-hover: #3d6844;
  --brand-soft: #e6efe5;
  --brand-ink: #24432a;
  --peony: #a33f62;
  --peony-soft: #f8e9ef;
  --good: #2f6b3a;
  --warn: #9a5b00;
  --warn-soft: #fdf3e2;
  --bad: #b42318;
  --bad-soft: #fdecea;
  --info: #1f5c99;
  --info-soft: #e8f1fa;
  --violet: #6b46a8;
  --violet-soft: #f1ecfa;
  --shadow: 0 1px 2px rgba(20, 30, 22, 0.06);
  --font: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121513; --surface: #1a1e1b; --surface-2: #222723; --line: #323933; --line-soft: #29302a;
    --fg: #e7ebe6; --muted: #a3ada5; --faint: #7c867e;
    --brand: #7fb487; --brand-hover: #95c49c; --brand-soft: #22332546; --brand-ink: #b9dcbd;
    --peony: #e48aa9; --peony-soft: #3a222c;
    --good: #8fca98; --warn: #e2b05c; --warn-soft: #3a2e17; --bad: #f08b80; --bad-soft: #3d1f1c;
    --info: #8dbbe8; --info-soft: #1c2b3b; --violet: #c0a6ec; --violet-soft: #2c2440;
    --shadow: none;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121513; --surface: #1a1e1b; --surface-2: #222723; --line: #323933; --line-soft: #29302a;
  --fg: #e7ebe6; --muted: #a3ada5; --faint: #7c867e;
  --brand: #7fb487; --brand-hover: #95c49c; --brand-soft: #22332546; --brand-ink: #b9dcbd;
  --peony: #e48aa9; --peony-soft: #3a222c;
  --good: #8fca98; --warn: #e2b05c; --warn-soft: #3a2e17; --bad: #f08b80; --bad-soft: #3d1f1c;
  --info: #8dbbe8; --info-soft: #1c2b3b; --violet: #c0a6ec; --violet-soft: #2c2440;
  --shadow: none;
  color-scheme: dark;
}

/* In-page choice from Settings (Light / Dark). "System" sets nothing and follows the viewer's theme. Declared last so it wins. */
:root[data-app-theme="light"] {
  --bg: #f6f7f5; --surface: #ffffff; --surface-2: #f0f2ef; --line: #dfe3dd; --line-soft: #ebeee9;
  --fg: #1d221e; --muted: #5f6a62; --faint: #8b958d;
  --brand: #2e5234; --brand-hover: #3d6844; --brand-soft: #e6efe5; --brand-ink: #24432a;
  --peony: #a33f62; --peony-soft: #f8e9ef;
  --good: #2f6b3a; --warn: #9a5b00; --warn-soft: #fdf3e2; --bad: #b42318; --bad-soft: #fdecea;
  --info: #1f5c99; --info-soft: #e8f1fa; --violet: #6b46a8; --violet-soft: #f1ecfa;
  --shadow: 0 1px 2px rgba(20, 30, 22, 0.06);
  color-scheme: light;
}
:root[data-app-theme="dark"] {
  --bg: #121513; --surface: #1a1e1b; --surface-2: #222723; --line: #323933; --line-soft: #29302a;
  --fg: #e7ebe6; --muted: #a3ada5; --faint: #7c867e;
  --brand: #7fb487; --brand-hover: #95c49c; --brand-soft: #22332546; --brand-ink: #b9dcbd;
  --peony: #e48aa9; --peony-soft: #3a222c;
  --good: #8fca98; --warn: #e2b05c; --warn-soft: #3a2e17; --bad: #f08b80; --bad-soft: #3d1f1c;
  --info: #8dbbe8; --info-soft: #1c2b3b; --violet: #c0a6ec; --violet-soft: #2c2440;
  --shadow: none;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font: 14px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--brand); }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---------- shell ---------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  background: var(--surface); border-bottom: 1px solid var(--line);
  padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.brand { display: flex; flex-direction: column; line-height: 1.1; margin-right: auto; cursor: pointer; background: none; border: 0; padding: 0; text-align: left; }
.brand small { font-size: 10px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--brand); }
.brand b { font-size: 16px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 500; white-space: nowrap; }
.chip-demo { background: var(--peony-soft); color: var(--peony); }
.chip-live::before, .chip-local::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.chip-live { background: var(--brand-soft); color: var(--good); }
.chip-local { background: var(--warn-soft); color: var(--warn); }
.role { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); white-space: nowrap; }
.role select { padding: 5px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; color: var(--fg); }

.shell { display: grid; grid-template-columns: 210px minmax(0, 1fr); min-height: calc(100% - 56px); }
.side { border-right: 1px solid var(--line); background: var(--surface); padding: 16px 10px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 53px); align-self: start; height: calc(100vh - 53px); overflow-y: auto; }
.side h6 { margin: 14px 8px 4px; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--faint); font-weight: 600; }
.side button { display: block; width: 100%; text-align: left; background: none; border: 0; border-radius: 6px; padding: 6px 8px; color: var(--fg); cursor: pointer; }
.side button:hover { background: var(--surface-2); }
.side button[aria-current="page"] { background: var(--brand-soft); color: var(--brand-ink); font-weight: 600; }
.main { min-width: 0; padding-block: 24px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1120px; margin: 0 auto; display: grid; gap: 24px; }
@media (min-width: 900px) { .main { padding-left: 32px; padding-right: max(32px, env(safe-area-inset-right, 0px)); } }
@media (max-width: 820px) {
  .shell { display: block; }
  .side { position: static; height: auto; display: flex; gap: 2px; overflow-x: auto; padding: 6px 8px; border-right: 0; border-bottom: 1px solid var(--line); }
  .side h6 { display: none; }
  .side button { width: auto; white-space: nowrap; }
}

/* ---------- type & blocks ---------- */
h1 { font-size: 24px; line-height: 1.2; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
h2 { font-size: 17px; margin: 0; }
h3 { font-size: 14px; margin: 0; }
.sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
.back { background: none; border: 0; padding: 0; color: var(--muted); cursor: pointer; font-size: 13px; margin-bottom: 6px; }
.back:hover { color: var(--fg); }
.head { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-start; justify-content: space-between; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.section { display: grid; gap: 10px; }
.section-head { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; box-shadow: var(--shadow); min-width: 0; }
.grid2 { display: grid; gap: 24px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); }
.stats { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 200px), 1fr)); }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; text-align: left; cursor: default; }
button.stat { cursor: pointer; }
button.stat:hover { border-color: var(--brand); }
.stat .k { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.stat .v { font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; margin-top: 2px; }
.stat .h { font-size: 12px; color: var(--muted); }
.v.warn { color: var(--warn); } .v.bad { color: var(--bad); }
.empty { border: 1px dashed var(--line); border-radius: var(--r); padding: 28px 16px; text-align: center; color: var(--muted); background: var(--surface); }
.note { font-size: 12px; color: var(--muted); }
.banner { border-radius: var(--r); padding: 10px 14px; font-size: 13px; border: 1px solid; }
.banner-bad { background: var(--bad-soft); color: var(--bad); border-color: color-mix(in srgb, var(--bad) 30%, transparent); }
.banner-ok { background: var(--brand-soft); color: var(--brand-ink); border-color: color-mix(in srgb, var(--brand) 25%, transparent); }
.banner-warn { background: var(--warn-soft); color: var(--warn); border-color: color-mix(in srgb, var(--warn) 30%, transparent); }
.banner-demo { background: var(--peony-soft); color: var(--fg); border-color: color-mix(in srgb, var(--peony) 25%, transparent); display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
.banner-demo b { color: var(--peony); }

/* ---------- tables ---------- */
.tw { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th { text-align: left; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); background: var(--surface-2); border-bottom: 1px solid var(--line); padding: 8px 12px; white-space: nowrap; }
td { border-bottom: 1px solid var(--line-soft); padding: 8px 12px; vertical-align: top; }
tr:last-child td { border-bottom: 0; }
tfoot td { border-top: 1px solid var(--line); border-bottom: 0; }
.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.code { font-family: var(--mono); font-size: 12px; white-space: nowrap; }
.small { font-size: 12px; color: var(--muted); }
.lnk { background: none; border: 0; padding: 0; color: var(--brand); cursor: pointer; text-align: left; font: inherit; }
.lnk:hover { text-decoration: underline; }
.nowrap { white-space: nowrap; }
.t-warn { color: var(--warn); font-weight: 600; } .t-bad { color: var(--bad); font-weight: 600; } .t-good { color: var(--good); } .t-faint { color: var(--faint); }
tr.flash td { background: var(--brand-soft); }

/* ---------- badges ---------- */
.badge { display: inline-block; border-radius: 999px; padding: 1px 8px; font-size: 11.5px; font-weight: 600; white-space: nowrap; text-transform: capitalize; background: var(--surface-2); color: var(--muted); }
.b-blue { background: var(--info-soft); color: var(--info); }
.b-amber { background: var(--warn-soft); color: var(--warn); }
.b-green { background: var(--brand-soft); color: var(--good); }
.b-violet { background: var(--violet-soft); color: var(--violet); }
.b-red { background: var(--bad-soft); color: var(--bad); }

/* ---------- forms ---------- */
.btn { transition: background-color .15s ease, border-color .15s ease, color .15s ease, box-shadow .15s ease, transform .12s ease; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 7px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); font-weight: 500; cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-p { background: var(--brand); border-color: var(--brand); color: var(--surface); }
.btn-p:hover { background: var(--brand-hover); }
.btn-d { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 35%, transparent); }
.btn-d:hover { background: var(--bad-soft); }
.btn-s { padding: 3px 8px; font-size: 12px; }
.form { display: grid; gap: 12px; grid-template-columns: repeat(12, minmax(0, 1fr)); }
.form > * { grid-column: span 12; min-width: 0; }
@media (min-width: 640px) { .c2 { grid-column: span 2; } .c3 { grid-column: span 3; } .c4 { grid-column: span 4; } .c5 { grid-column: span 5; } .c6 { grid-column: span 6; } .c8 { grid-column: span 8; } }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; }
label.f { display: grid; gap: 4px; min-width: 0; }
label.f > span, .lbl { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
input, select, textarea { width: 100%; padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); min-width: 0; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand); }
input[type="checkbox"] { width: auto; }
input:disabled, select:disabled, textarea:disabled { background: var(--surface-2); color: var(--muted); }
.check { display: flex; align-items: center; gap: 6px; font-size: 13px; }
.w-auto { width: auto; } .w-24 { width: 96px; } .w-32 { width: 128px; } .w-48 { width: 192px; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 12px; color: var(--muted); cursor: pointer; white-space: nowrap; margin-bottom: -1px; }
.tabs button[aria-selected="true"] { border-color: var(--brand); color: var(--fg); font-weight: 600; }
details > summary { cursor: pointer; list-style: none; }
details > summary::-webkit-details-marker { display: none; }

/* ---------- overlays ---------- */
.toast { position: fixed; z-index: 50; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-size: 13px; box-shadow: 0 6px 24px rgba(0,0,0,.2); max-width: calc(100% - 32px); }
.pending { position: fixed; z-index: 45; right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
.modal-bg { position: fixed; inset: 0; z-index: 60; background: rgba(10, 14, 11, 0.45); display: grid; place-items: center; padding: 16px; }
.modal { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 20px; width: min(440px, 100%); display: grid; gap: 14px; }
.busy-bar { position: fixed; top: env(safe-area-inset-top, 0px); left: 0; right: 0; height: 2px; z-index: 40; background: linear-gradient(90deg, transparent, var(--brand), transparent); background-size: 50% 100%; background-repeat: no-repeat; animation: slide 1s linear infinite; }
@keyframes slide { from { background-position: -50% 0; } to { background-position: 150% 0; } }

/* ---------- labels ---------- */
.labels { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr)); }
.label-card { background: #fff; color: #111; border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; display: grid; gap: 2px; }
.label-card .t { font-weight: 650; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.label-card .sku { font-family: var(--mono); font-size: 11px; color: #555; }
.label-card svg { width: 100%; height: 54px; display: block; }
.label-card .lc { text-align: center; font-family: var(--mono); font-weight: 700; letter-spacing: 0.08em; }
.label-card .m { font-size: 11px; color: #444; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---------- bars in reports ---------- */
.bar { height: 6px; border-radius: 3px; background: var(--brand); opacity: 0.75; min-width: 2px; }
.bar-bg { background: var(--surface-2); border-radius: 3px; width: 100%; min-width: 60px; }

/* ---------- motion ---------- */
.btn:not(:disabled):hover { transform: translateY(-1px); box-shadow: 0 2px 6px -2px color-mix(in srgb, var(--fg) 25%, transparent); }
.btn:not(:disabled):active { transform: translateY(0) scale(.98); box-shadow: none; }
button.stat, .theme-opt, .label-card { transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease; }
button.stat:hover, .theme-opt:hover, .label-card:hover { transform: translateY(-2px); box-shadow: 0 8px 20px -10px color-mix(in srgb, var(--fg) 40%, transparent); }
.side button { transition: background-color .15s ease, color .15s ease, transform .15s ease; }
.side button:hover { transform: translateX(2px); }
tbody tr { transition: background-color .15s ease; }
tbody tr:hover td { background: color-mix(in srgb, var(--brand-soft) 70%, transparent); }
.lnk { background: linear-gradient(currentColor, currentColor) 0 100% / 0 1px no-repeat; transition: background-size .2s ease; }
.lnk:hover { text-decoration: none; background-size: 100% 1px; }
.tabs button { transition: color .15s ease, border-color .2s ease; }
input, select, textarea { transition: border-color .15s ease, box-shadow .15s ease; }
.chip, .badge { transition: background-color .2s ease, color .2s ease; }
@keyframes page-in { from { opacity: .55; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes pop-in { from { opacity: 0; transform: translateY(8px) scale(.97); } to { opacity: 1; transform: none; } }
@keyframes toast-in { from { opacity: 0; transform: translate(-50%, 10px); } to { opacity: 1; transform: translate(-50%, 0); } }
.page-in { animation: page-in .22s ease-out both; }
.modal-bg { animation: fade-in .16s ease-out both; }
.modal { animation: pop-in .2s ease-out both; }
.toast { animation: toast-in .22s ease-out both; }
.pending { animation: pop-in .22s ease-out both; }
html.theme-anim, html.theme-anim *, html.theme-anim *::before, html.theme-anim *::after {
  transition: background-color .3s ease, border-color .3s ease, color .3s ease, fill .3s ease, box-shadow .3s ease !important;
}

/* ---------- settings ---------- */
.theme-opts { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); }
.theme-opt { display: grid; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; cursor: pointer; text-align: left; color: var(--fg); }
.theme-opt[aria-checked="true"] { border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand); }
.theme-opt .dot { width: 16px; height: 16px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; transition: background-color .15s ease, border-color .15s ease; }
.theme-opt[aria-checked="true"] .dot { background: var(--brand); border-color: var(--brand); }
.theme-opt[aria-checked="true"] .dot::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--surface); }
.mini { display: flex; height: 76px; border-radius: 6px; overflow: hidden; border: 1px solid var(--line); }
.mini > div { flex: 1; display: flex; gap: 4px; padding: 6px; }
.mini .s { width: 24%; border-radius: 3px; }
.mini .m { flex: 1; display: flex; flex-direction: column; gap: 4px; }
.mini .t { height: 5px; width: 65%; border-radius: 3px; }
.mini .c { flex: 1; border-radius: 3px; border: 1px solid; }
.mini .b { height: 7px; width: 35%; border-radius: 3px; }
.mini .L { background: #f6f7f5; } .mini .L .s, .mini .L .c { background: #ffffff; border-color: #dfe3dd; } .mini .L .t { background: #1d221e; } .mini .L .b { background: #2e5234; }
.mini .D { background: #121513; } .mini .D .s, .mini .D .c { background: #1a1e1b; border-color: #323933; } .mini .D .t { background: #e7ebe6; } .mini .D .b { background: #7fb487; }

@media (prefers-reduced-motion: reduce) {
  .btn:not(:disabled):hover, button.stat:hover, .theme-opt:hover, .label-card:hover, .side button:hover { transform: none; }
}

/* ---------- part 2: photos, floor plan, receiving, payments ---------- */
.ic { display: flex; align-items: center; gap: 10px; }
.thumb { flex: none; border-radius: 6px; object-fit: cover; border: 1px solid var(--line); background: var(--surface-2); vertical-align: middle; }
.thumb.ph, .photo-big.ph { display: inline-grid; place-items: center; font-size: 11px; font-weight: 650; color: hsl(var(--h, 140) 35% 30%); background: hsl(var(--h, 140) 45% 90%); border-color: transparent; }
:root[data-theme="dark"] .thumb.ph, :root[data-app-theme="dark"] .thumb.ph, :root[data-theme="dark"] .photo-big.ph, :root[data-app-theme="dark"] .photo-big.ph { color: hsl(var(--h, 140) 45% 80%); background: hsl(var(--h, 140) 25% 22%); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]):not([data-app-theme="light"]) .thumb.ph, :root:not([data-theme="light"]):not([data-app-theme="light"]) .photo-big.ph { color: hsl(var(--h, 140) 45% 80%); background: hsl(var(--h, 140) 25% 22%); } }
.photo { display: grid; gap: 8px; }
.photo-big { width: 100%; max-height: 260px; aspect-ratio: 4 / 3; object-fit: cover; border-radius: var(--r); border: 1px solid var(--line); }
.photo-big.ph { display: grid; align-content: center; justify-items: center; gap: 4px; font-size: 28px; }
ul.plain { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
ul.plain li { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.lbl { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.kw { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line); border-radius: 999px; padding: 1px 4px 1px 10px; font-size: 12px; background: var(--surface); }
.kw.warn { border-color: color-mix(in srgb, var(--warn) 40%, transparent); color: var(--warn); background: var(--warn-soft); }
.kw button { border: 0; background: none; color: var(--faint); cursor: pointer; border-radius: 999px; padding: 0 5px; font-size: 14px; line-height: 1.2; }
.kw button:hover { background: var(--bad-soft); color: var(--bad); }
tr.bad-row td { background: var(--bad-soft); } tr.warn-row td { background: var(--warn-soft); }
.t-faint { color: var(--faint); } tr.strike td { text-decoration: line-through; }
.dim { opacity: .6; }

/* floor plan */
.fp-grid { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr) 300px; align-items: start; }
@media (max-width: 900px) { .fp-grid { grid-template-columns: minmax(0, 1fr); } }
.plan { position: relative; width: 100%; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); overflow: hidden; touch-action: none; }
.plan.mini { display: block; padding: 0; cursor: pointer; touch-action: auto; }
.plan-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: fill; opacity: .55; pointer-events: none; }
.plan-grid { position: absolute; inset: 0; background-image: linear-gradient(var(--line-soft) 1px, transparent 1px), linear-gradient(90deg, var(--line-soft) 1px, transparent 1px); background-size: 5% 8%; }
.area { position: absolute; border: 2px solid var(--c); background: color-mix(in srgb, var(--c) 16%, transparent); border-radius: 6px; padding: 4px 6px; overflow: hidden; display: flex; flex-direction: column; gap: 2px; cursor: pointer; transition: box-shadow .15s ease, background-color .15s ease; color: var(--fg); }
.area:hover, .area:focus-visible { background: color-mix(in srgb, var(--c) 26%, transparent); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 30%, transparent); }
.area .nm { font-size: 12px; font-weight: 650; line-height: 1.2; }
.area .ct { font-size: 11px; color: var(--muted); }
.plan.mini .area { padding: 2px 4px; } .plan.mini .area span { font-size: 9px; font-weight: 600; }
.area.sel { box-shadow: 0 0 0 3px var(--brand); }
.area.home { border-style: solid; border-width: 3px; }
.area.away { background: color-mix(in srgb, #d97706 30%, transparent); border-color: #d97706; }
.area.here { background: color-mix(in srgb, var(--c) 34%, transparent); }
.area .tag { align-self: flex-start; font-size: 10px; font-weight: 700; border-radius: 999px; padding: 0 6px; }
.t-home { background: var(--brand); color: var(--surface); } .t-away { background: #d97706; color: #fff; }
.area.pulse { animation: plan-pulse 1.6s ease-in-out 3; }
@keyframes plan-pulse { 0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--c) 45%, transparent); } 50% { box-shadow: 0 0 0 10px transparent; } }
.plan.editing .area { cursor: move; } .plan.editing { outline: 2px dashed var(--brand); outline-offset: 3px; }
.area .rz { position: absolute; right: 0; bottom: 0; width: 22px; height: 22px; cursor: nwse-resize; display: grid; place-items: end; padding: 2px; color: color-mix(in srgb, var(--fg) 70%, transparent); touch-action: none; }
.area .rz svg { display: block; }
.plan-empty { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; }
.door { position: absolute; z-index: 3; display: inline-flex; align-items: center; gap: 4px; max-width: 45%; padding: 1px 8px; border: 2px solid #fff; border-radius: 999px; color: #fff; font: 600 11px/1.5 inherit; white-space: nowrap; box-shadow: 0 1px 3px rgb(0 0 0 / .25); cursor: pointer; }
.door .dl { overflow: hidden; text-overflow: ellipsis; }
.door-entry { background: #2e6b3a; } .door-exit { background: #b45309; }
.door.sel { box-shadow: 0 0 0 3px var(--brand); }
.plan.editing .door { cursor: grab; touch-action: none; } .plan.editing .door:active { cursor: grabbing; }
.door-badge { color: #fff; border-radius: 999px; padding: 1px 8px; font-size: 12px; font-weight: 700; }
.stack { display: flex; flex-direction: column; gap: 8px; }
.stack + .stack { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
.pt { max-width: 8.5in; margin: 0 auto; background: #fff; color: #111; border: 1px solid #d6d3d1; border-radius: var(--r); padding: 32px; font-size: 13px; }
.pt-head { display: flex; justify-content: space-between; gap: 24px; border-bottom: 2px solid #111; padding-bottom: 10px; margin-bottom: 16px; }
.pt-head h1 { margin: 0; font-size: 24px; color: #111; }
.pt-kicker { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #57534e; }
.pt-head dl { display: grid; grid-template-columns: auto auto; gap: 0 12px; margin: 0; text-align: right; } .pt-head dt { color: #57534e; } .pt-head dd { margin: 0; }
.pt-note { color: #44403c; margin: 0 0 12px; }
.pt-shop { font-size: 17px; margin: 18px 0 6px; color: #111; }
.pt-sec { margin-bottom: 14px; break-inside: avoid; }
.pt-sec h3 { margin: 0 0 4px; padding: 3px 8px; background: #f0efed; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: #111; }
.pt-sec h3.pt-short { background: #fef3c7; }
.pt-table { width: 100%; table-layout: fixed; border-collapse: collapse; }
.pt-table th { text-align: left; font-size: 11px; font-weight: 600; color: #57534e; border-bottom: 1px solid #a8a29e; padding: 3px 4px; }
.pt-table td { border-bottom: 1px solid #e7e5e4; padding: 6px 4px; vertical-align: top; }
.pt-table .n { text-align: right; white-space: nowrap; }
.pt-box { display: inline-block; width: 14px; height: 14px; border: 1.5px solid #111; }
.pt-sku, .pt-lot { font-family: ui-monospace, monospace; font-size: 11px; color: #57534e; } .pt-lot div { font-family: inherit; }
.swatch { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--surface); background: var(--c); box-shadow: 0 0 0 1px var(--line); cursor: pointer; }
.swatch.on { box-shadow: 0 0 0 2px var(--fg); }
.key { display: inline-block; width: 10px; height: 10px; border-radius: 3px; vertical-align: -1px; }
.key.home { border: 2px solid var(--brand); } .key.away { background: #d97706; }
@media (prefers-reduced-motion: reduce) { .area.pulse { animation: none; } }

/* receiving */
.weeks { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.wk { display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 8px; padding: 7px 12px; border-bottom: 1px solid var(--line-soft); align-items: start; }
.wk:last-child { border-bottom: 0; } .wk-l { padding-top: 4px; }
@media (max-width: 600px) { .wk { grid-template-columns: minmax(0, 1fr); } }
.shp { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; font: inherit; font-size: 12px; background: var(--surface); color: var(--fg); cursor: pointer; max-width: 100%; transition: transform .15s ease, box-shadow .15s ease; }
.shp:hover { transform: translateY(-1px); box-shadow: 0 2px 6px rgba(0, 0, 0, .08); }
.shp .tr { max-width: 170px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.shp.in_transit { background: var(--info-soft); border-color: color-mix(in srgb, var(--info) 30%, transparent); }
.shp.arrived { background: var(--warn-soft); border-color: color-mix(in srgb, var(--warn) 30%, transparent); }
.shp.received { background: var(--brand-soft); color: var(--brand-ink); }
.shp.late { background: var(--bad-soft); border-color: color-mix(in srgb, var(--bad) 45%, transparent); color: var(--bad); }
.shp.virtual { border-style: dashed; background: transparent; color: var(--muted); }
.steps { display: flex; flex-wrap: wrap; gap: 6px; list-style: none; margin: 0; padding: 0; }
.steps li { border: 1px solid var(--line); border-radius: 999px; padding: 2px 12px; font-size: 12px; color: var(--muted); }
.steps li.done { background: var(--brand-soft); color: var(--brand-ink); border-color: transparent; }
.steps li.cur { background: var(--brand); color: var(--surface); border-color: var(--brand); font-weight: 600; }
.po-picks { display: grid; gap: 6px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); }
.po-picks .card { padding: 8px 10px; }

/* payments / counter */
.charge { border: 2px solid var(--info); background: var(--info-soft); border-radius: var(--r); padding: 14px; display: grid; gap: 10px; }
.charge.approved { border-color: var(--brand); background: var(--brand-soft); }
.charge.declined, .charge.timeout, .charge.cancelled { border-color: color-mix(in srgb, var(--bad) 50%, transparent); background: var(--bad-soft); }
.charge-t { font-size: 19px; font-weight: 650; }
.charge .sim { border: 1px dashed var(--line); border-radius: var(--r); background: var(--surface); padding: 10px; display: grid; gap: 8px; }
.counter { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr) 320px; align-items: start; }
@media (max-width: 900px) { .counter { grid-template-columns: minmax(0, 1fr); } }
.cart-side .tot { font-size: 18px; font-weight: 650; border-top: 1px solid var(--line); padding-top: 6px; }
.cart-side .btn-p { width: 100%; justify-content: center; }
.drop { position: absolute; z-index: 20; left: 0; right: 0; top: 100%; margin: 4px 0 0; padding: 4px; list-style: none; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: 0 8px 24px rgba(0, 0, 0, .12); }
.drop button { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; background: none; border: 0; padding: 6px 8px; border-radius: 6px; font: inherit; color: var(--fg); cursor: pointer; }
.drop button:hover { background: var(--surface-2); }
.receipt { max-width: 440px; width: 100%; margin: 0 auto; }

/* label printing */
.mode-opts { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); }
.mode-opts .theme-opt { text-align: left; }
.psheet { display: flex; flex-wrap: wrap; align-content: flex-start; }
.psheet.loose { gap: 12px; }
.paper { background: #fff; margin: 0 auto; box-shadow: 0 1px 4px rgba(0, 0, 0, .12); }
.plabel { background: #fff; color: #111; display: flex; flex-direction: column; overflow: hidden; border: 1px solid #d6d3d1; border-radius: 3px; }
.plabel.cut { border: 0; border-radius: 0; outline: 0.5pt dashed #9ca3af; }
.pl-t { font-weight: 650; line-height: 1.1; display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; }
.pl-sku { font-family: var(--mono); font-weight: 400; color: #555; }
.pl-bc { width: 100%; display: block; }
.pl-c { text-align: center; font-family: var(--mono); font-weight: 700; letter-spacing: .08em; line-height: 1; }
.pl-m { color: #444; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.15; }
.rec-pick .f.c3:last-child { display: none; }

.mc-col { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
.mc-box { width: 240px; flex-shrink: 0; border: 3px solid #dc2626; border-radius: 6px; background: #fff; color: #dc2626; padding: 8px 12px; print-color-adjust: exact; -webkit-print-color-adjust: exact; }
.mc-title { text-align: center; font-size: 24px; line-height: 1; font-weight: 900; letter-spacing: .05em; }
.mc-space { height: 48px; } .mc-line { border-top: 2px solid #dc2626; }
.mc-sig { margin-top: 2px; font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; }
.mc-tag { display: inline-block; border: 1px solid #dc2626; color: #dc2626; border-radius: 4px; padding: 0 4px; font-size: 10px; font-weight: 700; letter-spacing: .03em; white-space: nowrap; }
.pt-head dl { margin-left: auto; }

/* ---------- Florist look: softer type, shapes and motion (same as the full app) ---------- */
:root { --ease: cubic-bezier(0.22, 1, 0.36, 1); --r: 16px; }
body { font: 14.5px/1.55 var(--font); }
h1, h2, .brand b, .stat .v, .disp { font-family: var(--display); font-weight: var(--dw); letter-spacing: -0.01em; }
h1 { font-size: 32px; line-height: 1.15; }
h2 { font-size: 20px; }
.sub { font-size: 15px; }
::selection { background: color-mix(in srgb, var(--brand) 25%, transparent); }
:focus-visible { outline: 2px solid var(--brand-hover); outline-offset: 2px; }

/* labels and headers in sentence case */
label.f > span, .lbl { font-size: 13.5px; font-weight: 500; letter-spacing: 0; text-transform: none; color: var(--muted); }

<body>
<div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js"></script>
<script>
/* DKaydent Wholesale demo — business engine.
 * Mirrors the rules of the Supabase functions in the real app:
 * unit conversion, landed cost, FIFO / hand-picked fulfillment,
 * returns back to the exact lots, voids, role checks.
 * Every operation runs on a cloned state, so a thrown error changes nothing. */
(function (root) {
  "use strict";

  const ROLES = { admin: "Admin", buyer: "Buyer", warehouse: "Warehouse", sales: "Sales" };
  const ROLE_HELP = {
    admin: "Everything, including resetting the demo",
    buyer: "Products, vendors, purchase orders, receiving",
    warehouse: "Locations, receiving, moves, shrink, counts, fulfillment",
    sales: "Customers, pricing, sales orders, fulfillment, invoices, returns",
  };
  const can = (role, ...rs) => role === "admin" || rs.includes(role);

  class UserError extends Error {}
  const fail = (m) => {
    throw new UserError(m);
  };
  const need = (ctx, ...rs) => {
    if (!can(ctx.role, ...rs))
      fail(`The ${ROLES[ctx.role]} role can't do that. Needs ${rs.map((r) => ROLES[r]).join(" or ")}. Switch roles at the top.`);
  };

  // ---------- small helpers ----------
  let idCounter = 0;
  const uid = (p) => `${p}${(Date.now() % 1679616).toString(36)}${(idCounter++ % 1296).toString(36)}${Math.random().toString(36).slice(2, 5)}`;
  const round2 = (n) => Math.round((Number(n) + Number.EPSILON) * 100) / 100;
  const pad = (n, w) => String(n).padStart(w, "0");
  const ymd = (iso) => {
    const d = new Date(iso);
    return `${d.getFullYear()}-${pad(d.getMonth() + 1, 2)}-${pad(d.getDate(), 2)}`;
  };
  const addDays = (date, n) => {
    const d = new Date(date + "T12:00:00");
    d.setDate(d.getDate() + n);
    return ymd(d.toISOString());
  };
  const daysBetween = (a, b) => Math.round((Date.parse(b + "T12:00:00") - Date.parse(a + "T12:00:00")) / 86400000);
  const num = (v) => (v === "" || v === null || v === undefined ? null : Number(v));
  const req = (v, m) => (v === null || v === undefined || (typeof v === "string" && !v.trim()) ? fail(m) : v);

  const byId = (list, id, what) => list.find((x) => x.id === id) || fail(`${what} not found`);
  const product = (s, id) => byId(s.products, id, "Product");
  const unit = (p, unitId) => p.units.find((u) => u.id === unitId) || fail("Unit not found for that product");
  const lotCode = (s, now) => {
    const d = ymd(now).slice(2).replace(/-/g, "");
    return `L${d}-${pad(s.seq.lot++, 4)}`;
  };
  const move = (s, ctx, m) => {
    const rec = { id: uid("m"), at: ctx.now, by: ROLES[ctx.role] };
    for (const k in m) if (m[k] !== null && m[k] !== undefined) rec[k] = typeof m[k] === "number" ? Math.round(m[k] * 1e4) / 1e4 : m[k];
    s.moves.push(rec);
  };

  // ---------- catalog ----------
  function createProduct(s, ctx, a) {
    need(ctx, "buyer");
    const sku = req(a.sku, "SKU is required").trim().toUpperCase();
    if (s.products.some((p) => p.sku === sku)) fail(`SKU ${sku} already exists`);
    const base = req(a.baseUnit, "Base unit is required").trim().toLowerCase();
    if (!["flower", "hard_good"].includes(a.kind)) fail("Choose a type");
    const p = {
      id: uid("p"),
      sku,
      name: req(a.name, "Name is required").trim(),
      kind: a.kind,
      category: a.category || null,
      variety: a.variety || null,
      color: a.color || null,
      grade: a.grade || null,
      stem: num(a.stem),
      baseUnit: base,
      shelfLife: num(a.shelfLife),
      reorder: num(a.reorder) || 0,
      active: true,
      notes: a.notes || null,
      units: [{ id: uid("u"), name: base, factor: 1 }],
    };
    for (const u of a.units || []) {
      if (u.name && u.factor > 0 && u.name !== base && !p.units.some((x) => x.name === u.name))
        p.units.push({ id: uid("u"), name: u.name.toLowerCase(), factor: Number(u.factor) });
    }
    s.products.push(p);
    return p.id;
  }
  function updateProduct(s, ctx, a) {
    need(ctx, "buyer");
    const p = product(s, a.id);
    const sku = req(a.sku, "SKU is required").trim().toUpperCase();
    if (s.products.some((x) => x.sku === sku && x.id !== p.id)) fail(`SKU ${sku} already exists`);
    Object.assign(p, {
      sku,
      name: req(a.name, "Name is required").trim(),
      kind: a.kind,
      category: a.category || null,
      variety: a.variety || null,
      color: a.color || null,
      grade: a.grade || null,
      stem: num(a.stem),
      shelfLife: num(a.shelfLife),
      reorder: num(a.reorder) || 0,
      active: !!a.active,
      notes: a.notes || null,
    });
  }
  function addUnit(s, ctx, a) {
    need(ctx, "buyer");
    const p = product(s, a.productId);
    const name = req(a.name, "Enter a unit name").trim().toLowerCase();
    const f = Number(a.factor);
    if (!(f > 0)) fail(`Enter how many ${p.baseUnit} one ${name} holds`);
    if (p.units.some((u) => u.name === name)) fail(`${p.name} already has a "${name}" unit`);
    p.units.push({ id: uid("u"), name, factor: f });
  }
  function removeUnit(s, ctx, a) {
    need(ctx, "buyer");
    const p = product(s, a.productId);
    const u = unit(p, a.unitId);
    if (u.name === p.baseUnit) fail("The base unit can't be removed");
    const used = s.pos.some((po) => po.lines.some((l) => l.unitId === u.id)) || s.sos.some((so) => so.lines.some((l) => l.unitId === u.id));
    if (used) fail(`"${u.name}" is used on orders, so it can't be removed`);
    p.units = p.units.filter((x) => x.id !== u.id);
    s.tierPrices = s.tierPrices.filter((t) => t.unitId !== u.id);
  }
  function setTierPrice(s, ctx, a) {
    need(ctx, "sales");
    const price = Number(a.price);
    if (!(price >= 0) || a.price === "") fail("Enter a price");
    const t = s.tierPrices.find((x) => x.tierId === a.tierId && x.unitId === a.unitId);
    if (t) t.price = price;
    else s.tierPrices.push({ id: uid("tp"), tierId: a.tierId, unitId: a.unitId, price });
  }
  function removeTierPrice(s, ctx, a) {
    need(ctx, "sales");
    s.tierPrices = s.tierPrices.filter((t) => t.id !== a.id);
  }

  // ---------- parties & places ----------
  const VENDOR_KINDS = ["grower", "distributor", "supplier"];
  function saveVendor(s, ctx, a) {
    need(ctx, "buyer");
    const rec = {
      name: req(a.name, "Vendor name is required").trim(),
      kind: VENDOR_KINDS.includes(a.kind) ? a.kind : "grower",
      contact: a.contact || null,
      email: a.email || null,
      phone: a.phone || null,
      country: a.country || null,
      terms: a.terms || null,
      notes: a.notes || null,
      active: a.active === undefined ? true : !!a.active,
    };
    if (a.id) return Object.assign(byId(s.vendors, a.id, "Vendor"), rec).id;
    const v = { id: uid("v"), ...rec };
    s.vendors.push(v);
    return v.id;
  }
  function saveCustomer(s, ctx, a) {
    need(ctx, "sales");
    const terms = a.terms === "" || a.terms === undefined ? 30 : Number(a.terms);
    if (!Number.isInteger(terms) || terms < 0) fail("Payment terms must be a whole number of days");
    const rec = {
      name: req(a.name, "Business name is required").trim(),
      tierId: a.tierId || null,
      contact: a.contact || null,
      email: a.email || null,
      phone: a.phone || null,
      address: a.address || null,
      terms,
      resale: a.resale || null,
      notes: a.notes || null,
      active: a.active === undefined ? true : !!a.active,
    };
    if (a.id) return Object.assign(byId(s.customers, a.id, "Customer"), rec).id;
    const c = { id: uid("c"), ...rec };
    s.customers.push(c);
    return c.id;
  }
  function saveTier(s, ctx, a) {
    need(ctx, "sales");
    const name = req(a.name, "Tier name is required").trim();
    const markup = Number(a.markup);
    if (!Number.isFinite(markup)) fail("Enter a markup %");
    if (s.tiers.some((t) => t.name.toLowerCase() === name.toLowerCase() && t.id !== a.id)) fail("That tier already exists");
    if (a.id) Object.assign(byId(s.tiers, a.id, "Tier"), { name, markup });
    else s.tiers.push({ id: uid("t"), name, markup });
  }
  function createLocation(s, ctx, a) {
    need(ctx, "warehouse");
    const name = req(a.name, "Location name is required").trim();
    if (s.locations.some((l) => l.name.toLowerCase() === name.toLowerCase())) fail("That location already exists");
    s.locations.push({ id: uid("l"), name, kind: a.kind || "cooler", temp: num(a.temp), active: true });
  }
  function toggleLocation(s, ctx, a) {
    need(ctx, "warehouse");
    const l = byId(s.locations, a.id, "Location");
    l.active = !l.active;
  }

  // ---------- purchasing ----------
  function createPO(s, ctx, a) {
    need(ctx, "buyer");
    byId(s.vendors, req(a.vendorId, "Choose a vendor"), "Vendor");
    const po = {
      id: uid("po"),
      number: `PO-${s.seq.po++}`,
      vendorId: a.vendorId,
      status: "draft",
      orderDate: null,
      expected: a.expected || null,
      freight: 0,
      other: 0,
      notes: a.notes || null,
      createdAt: ctx.now,
      lines: [],
    };
    s.pos.push(po);
    return po.id;
  }
  function updatePO(s, ctx, a) {
    need(ctx, "buyer");
    const po = byId(s.pos, a.id, "Purchase order");
    if (["received", "cancelled"].includes(po.status)) fail("This PO is closed");
    const freight = Number(a.freight || 0);
    const other = Number(a.other || 0);
    if (!(freight >= 0) || !(other >= 0)) fail("Freight and other charges can't be negative");
    Object.assign(po, { orderDate: a.orderDate || null, expected: a.expected || null, freight, other, notes: a.notes || null });
  }
  function addPOLine(s, ctx, a) {
    need(ctx, "buyer");
    const po = byId(s.pos, a.poId, "Purchase order");
    if (po.status !== "draft") fail("Lines can only change while the PO is a draft");
    const p = product(s, a.productId);
    unit(p, a.unitId);
    const qty = Number(a.qty);
    const cost = Number(a.cost);
    if (!(qty > 0)) fail("Enter a quantity");
    if (!(cost >= 0) || a.cost === "") fail("Enter the vendor cost per unit");
    po.lines.push({ id: uid("pl"), productId: p.id, unitId: a.unitId, qty, cost, receivedBase: 0 });
  }
  function removePOLine(s, ctx, a) {
    need(ctx, "buyer");
    const po = byId(s.pos, a.poId, "Purchase order");
    if (po.status !== "draft") fail("Lines can only change while the PO is a draft");
    po.lines = po.lines.filter((l) => l.id !== a.lineId);
  }
  function setPOStatus(s, ctx, a) {
    need(ctx, "buyer");
    const po = byId(s.pos, a.id, "Purchase order");
    const nothingReceived = po.lines.every((l) => l.receivedBase === 0);
    if (a.status === "ordered") {
      if (po.status !== "draft") fail("Only drafts can be marked ordered");
      if (!po.lines.length) fail("Add at least one line before marking the PO as ordered");
      po.orderDate = po.orderDate || ymd(ctx.now);
    } else if (a.status === "draft" || a.status === "cancelled") {
      if (po.status !== "ordered" || !nothingReceived) fail("Only ordered POs with nothing received can change back");
    } else fail("Unknown status");
    po.status = a.status;
  }
  function deletePO(s, ctx, a) {
    need(ctx, "buyer");
    const po = byId(s.pos, a.id, "Purchase order");
    if (po.status !== "draft") fail("Only draft POs can be deleted");
    s.pos = s.pos.filter((x) => x.id !== po.id);
  }
  function poUplift(po) {
    const sub = po.lines.reduce((t, l) => t + l.qty * l.cost, 0);
    return sub > 0 ? (po.freight + po.other) / sub : 0;
  }
  function receivePO(s, ctx, a) {
    need(ctx, "buyer", "warehouse");
    const po = byId(s.pos, a.id, "Purchase order");
    if (!["ordered", "partially_received"].includes(po.status)) fail("Only ordered purchase orders can be received");
    const uplift = poUplift(po);
    let any = false;
    for (const r of a.lines || []) {
      const q = Number(r.qty);
      if (!(q > 0)) continue;
      const line = po.lines.find((l) => l.id === r.lineId) || fail("Line is not on this purchase order");
      const loc = r.locationId || a.locationId;
      if (!loc) fail("Choose a location for every received line");
      byId(s.locations, loc, "Location");
      const p = product(s, line.productId);
      const u = unit(p, line.unitId);
      const qtyBase = q * u.factor;
      const lot = {
        id: uid("lot"),
        code: (r.lotCode || "").trim() || lotCode(s, ctx.now),
        productId: p.id,
        locationId: loc,
        poId: po.id,
        poLineId: line.id,
        receivedAt: ctx.now,
        expires: r.expires || (p.shelfLife ? addDays(ymd(ctx.now), p.shelfLife) : null),
        qtyReceived: qtyBase,
        qty: qtyBase,
        cost: Math.round((line.cost / u.factor) * (1 + uplift) * 1e5) / 1e5,
      };
      s.lots.push(lot);
      move(s, ctx, { lotId: lot.id, productId: p.id, locationId: loc, kind: "receive", qty: qtyBase, ref: po.number });
      line.receivedBase += qtyBase;
      any = true;
    }
    if (!any) fail("Enter a quantity for at least one line");
    const done = po.lines.every((l) => l.receivedBase >= l.qty * unit(product(s, l.productId), l.unitId).factor - 1e-9);
    po.status = done ? "received" : "partially_received";
  }
  function closePO(s, ctx, a) {
    need(ctx, "buyer");
    const po = byId(s.pos, a.id, "Purchase order");
    if (po.status !== "partially_received") fail("Only partially received purchase orders can be closed");
    po.status = "received";
  }

  // ---------- inventory ----------
  const lotOf = (s, id) => byId(s.lots, id, "Lot");
  function checkQty(q, lot) {
    if (!(q > 0) || q > lot.qty + 1e-9) fail(`Quantity must be more than 0 and no more than ${fmtQty(lot.qty)}`);
  }
  function transfer(s, ctx, a) {
    need(ctx, "warehouse");
    const lot = lotOf(s, a.lotId);
    const q = Number(a.qtyBase);
    if (!a.toLocationId) fail("Choose a destination");
    if (a.toLocationId === lot.locationId) fail("Lot is already in that location");
    checkQty(q, lot);
    let dest = lot;
    const from = lot.locationId;
    if (Math.abs(q - lot.qty) < 1e-9) {
      lot.locationId = a.toLocationId;
    } else {
      lot.qty -= q;
      dest = { ...lot, id: uid("lot"), code: lot.code + "-S", locationId: a.toLocationId, qtyReceived: q, qty: q };
      s.lots.push(dest);
    }
    move(s, ctx, { lotId: lot.id, productId: lot.productId, locationId: from, kind: "transfer_out", qty: -q, ref: lot.code });
    move(s, ctx, { lotId: dest.id, productId: lot.productId, locationId: a.toLocationId, kind: "transfer_in", qty: q, ref: lot.code });
    return dest.id;
  }
  function shrink(s, ctx, a) {
    need(ctx, "warehouse");
    const lot = lotOf(s, a.lotId);
    const q = Number(a.qtyBase);
    if (!(a.reason || "").trim()) fail("A reason is required");
    checkQty(q, lot);
    lot.qty -= q;
    move(s, ctx, { lotId: lot.id, productId: lot.productId, locationId: lot.locationId, kind: "shrink", qty: -q, reason: a.reason, ref: lot.code });
  }
  function adjust(s, ctx, a) {
    need(ctx, "warehouse");
    const lot = lotOf(s, a.lotId);
    const counted = Number(a.counted);
    if (!(a.reason || "").trim()) fail("A reason is required");
    if (!(counted >= 0) || a.counted === "") fail("Counted quantity can't be negative");
    const delta = counted - lot.qty;
    if (Math.abs(delta) < 1e-9) return;
    lot.qty = counted;
    move(s, ctx, { lotId: lot.id, productId: lot.productId, locationId: lot.locationId, kind: "adjust", qty: delta, reason: a.reason, ref: lot.code });
  }

  // ---------- sales ----------
  function createSO(s, ctx, a) {
    need(ctx, "sales");
    byId(s.customers, req(a.customerId, "Choose a customer"), "Customer");
    const so = {
      id: uid("so"),
      number: `SO-${s.seq.so++}`,
      customerId: a.customerId,
      status: "draft",
      orderDate: ymd(ctx.now),
      ship: a.ship || null,
      notes: null,
      fulfilledAt: null,
      createdAt: ctx.now,
      lines: [],
    };
    s.sos.push(so);
    return so.id;
  }
  function updateSO(s, ctx, a) {
    need(ctx, "sales");
    const so = byId(s.sos, a.id, "Sales order");
    if (["invoiced", "cancelled"].includes(so.status)) fail("This order is closed");
    so.ship = a.ship || null;
    so.notes = a.notes || null;
  }
  function addSOLine(s, ctx, a) {
    need(ctx, "sales");
    const so = byId(s.sos, a.soId, "Sales order");
    if (so.status !== "draft") fail("Lines can only change while the order is a draft");
    const p = product(s, a.productId);
    unit(p, a.unitId);
    const qty = Number(a.qty);
    const price = Number(a.price);
    if (!(qty > 0)) fail("Enter a quantity");
    if (!(price >= 0) || a.price === "") fail("Enter a price");
    so.lines.push({ id: uid("sl"), productId: p.id, unitId: a.unitId, qty, price, cost: null, allocs: [] });
  }
  function removeSOLine(s, ctx, a) {
    need(ctx, "sales");
    const so = byId(s.sos, a.soId, "Sales order");
    if (so.status !== "draft") fail("Lines can only change while the order is a draft");
    so.lines = so.lines.filter((l) => l.id !== a.lineId);
  }
  function setSOStatus(s, ctx, a) {
    need(ctx, "sales");
    const so = byId(s.sos, a.id, "Sales order");
    if (a.status === "confirmed") {
      if (so.status !== "draft") fail("Only drafts can be confirmed");
      if (!so.lines.length) fail("Add at least one line before confirming");
    } else if (a.status === "draft") {
      if (so.status !== "confirmed") fail("Only confirmed orders can go back to draft");
    } else if (a.status === "cancelled") {
      if (!["draft", "confirmed"].includes(so.status)) fail("Fulfilled orders can't be cancelled. Record a return instead.");
    } else fail("Unknown status");
    so.status = a.status;
  }
  function deleteSO(s, ctx, a) {
    need(ctx, "sales");
    const so = byId(s.sos, a.id, "Sales order");
    if (so.status !== "draft") fail("Only draft orders can be deleted");
    s.sos = s.sos.filter((x) => x.id !== so.id);
  }
  const fifoLots = (s, productId) =>
    s.lots
      .map((l, i) => [l, i])
      .filter(([l]) => l.productId === productId && l.qty > 1e-9)
      .sort((x, y) => (x[0].receivedAt < y[0].receivedAt ? -1 : x[0].receivedAt > y[0].receivedAt ? 1 : x[1] - y[1]))
      .map(([l]) => l);
  function fulfill(s, ctx, a) {
    need(ctx, "sales", "warehouse");
    const so = byId(s.sos, a.id, "Sales order");
    if (so.status !== "confirmed") fail("Only confirmed orders can be fulfilled");
    if (!so.lines.length) fail("Order has no lines");
    const picks = (a.picks || []).filter((p) => Number(p.qtyBase) > 0);
    for (const line of so.lines) {
      const p = product(s, line.productId);
      const need0 = line.qty * unit(p, line.unitId).factor;
      let needQ = need0;
      let cost = 0;
      line.allocs = [];
      const mine = picks.filter((x) => x.lineId === line.id);
      if (mine.length) {
        const total = mine.reduce((t, x) => t + Number(x.qtyBase), 0);
        if (Math.abs(total - need0) > 1e-9) fail(`Picked ${fmtQty(total)} ${p.baseUnit} of ${p.name} but the line needs ${fmtQty(need0)}`);
        for (const pk of mine) {
          const lot = s.lots.find((l) => l.id === pk.lotId);
          if (!lot || lot.productId !== p.id) fail(`A picked lot is not ${p.name} stock`);
          const q = Number(pk.qtyBase);
          if (q > lot.qty + 1e-9) fail(`Lot ${lot.code} only has ${fmtQty(lot.qty)} ${p.baseUnit} of ${p.name}`);
          lot.qty -= q;
          line.allocs.push({ lotId: lot.id, qty: q, cost: lot.cost, returned: 0 });
          move(s, ctx, { lotId: lot.id, productId: p.id, locationId: lot.locationId, kind: "sale", qty: -q, ref: so.number });
          cost += q * lot.cost;
        }
      } else {
        for (const lot of fifoLots(s, p.id)) {
          if (needQ <= 1e-9) break;
          const take = Math.min(needQ, lot.qty);
          lot.qty -= take;
          line.allocs.push({ lotId: lot.id, qty: take, cost: lot.cost, returned: 0 });
          move(s, ctx, { lotId: lot.id, productId: p.id, locationId: lot.locationId, kind: "sale", qty: -take, ref: so.number });
          cost += take * lot.cost;
          needQ -= take;
        }
        if (needQ > 1e-9) fail(`Not enough stock for ${p.name}: short ${fmtQty(needQ)} ${p.baseUnit}`);
      }
      line.cost = round2(cost);
    }
    so.status = "fulfilled";
    so.fulfilledAt = ctx.now;
  }
  function activeInvoice(s, soId) {
    return s.invoices.find((i) => i.soId === soId && i.status !== "void") || null;
  }
  function invoice(s, ctx, a) {
    need(ctx, "sales");
    const so = byId(s.sos, a.id, "Sales order");
    if (so.status !== "fulfilled") fail("Only fulfilled orders can be invoiced");
    const c = byId(s.customers, so.customerId, "Customer");
    const rate = Number(a.taxRate || 0);
    if (!(rate >= 0)) fail("Tax rate can't be negative");
    const sub = round2(so.lines.reduce((t, l) => t + l.qty * l.price, 0));
    const tax = round2((sub * rate) / 100);
    const issued = ymd(ctx.now);
    const inv = {
      id: uid("inv"),
      number: `INV-${s.seq.inv++}`,
      soId: so.id,
      customerId: so.customerId,
      issued,
      due: addDays(issued, c.terms ?? 30),
      subtotal: sub,
      taxRate: rate,
      tax,
      total: round2(sub + tax),
      status: "open",
      paidAt: null,
    };
    s.invoices.push(inv);
    so.status = "invoiced";
    return inv.id;
  }
  function voidInvoice(s, ctx, a) {
    need(ctx, "sales");
    const inv = byId(s.invoices, a.id, "Invoice");
    if (inv.status !== "open") fail("Only open (unpaid) invoices can be voided");
    inv.status = "void";
    const so = s.sos.find((x) => x.id === inv.soId);
    if (so && so.status === "invoiced") so.status = "fulfilled";
  }
  function setInvoicePaid(s, ctx, a) {
    need(ctx, "sales");
    const inv = byId(s.invoices, a.id, "Invoice");
    if (a.paid) {
      if (inv.status !== "open") fail("Only open invoices can be marked paid");
      inv.status = "paid";
      inv.paidAt = ymd(ctx.now);
    } else {
      if (inv.status !== "paid") fail("Only paid invoices can be marked unpaid");
      inv.status = "open";
      inv.paidAt = null;
    }
  }
  function createReturn(s, ctx, a) {
    need(ctx, "sales", "warehouse");
    const so = byId(s.sos, a.soId, "Sales order");
    if (!["fulfilled", "invoiced"].includes(so.status)) fail("Only fulfilled or invoiced orders can take returns");
    const inv = activeInvoice(s, so.id);
    const rate = inv ? inv.taxRate : 0;
    const ret = {
      id: uid("r"),
      number: `RMA-${s.seq.rma++}`,
      soId: so.id,
      customerId: so.customerId,
      at: ctx.now,
      reason: (a.reason || "").trim() || null,
      subtotal: 0,
      tax: 0,
      total: 0,
      credit: "open",
      lines: [],
    };
    for (const r of a.lines || []) {
      const q = Number(r.qty);
      if (!(q > 0)) continue;
      const line = so.lines.find((l) => l.id === r.lineId) || fail("Line is not on this order");
      const p = product(s, line.productId);
      const f = unit(p, line.unitId).factor;
      let needQ = q * f;
      const done = s.returns.filter((x) => x.soId === so.id).flatMap((x) => x.lines).filter((x) => x.soLineId === line.id).reduce((t, x) => t + x.qtyBase, 0);
      if (done + needQ > line.qty * f + 1e-9)
        fail(`Can't return more ${p.name} than was sold (${fmtQty(done)} ${p.baseUnit} already returned of ${fmtQty(line.qty * f)})`);
      const restock = r.restock !== false;
      const rl = { soLineId: line.id, productId: p.id, qty: q, qtyBase: needQ, restock, credit: round2(q * line.price), cost: 0 };
      // reverse the most recent allocations first
      const allocs = [...line.allocs].sort((x, y) => {
        const lx = s.lots.find((l) => l.id === x.lotId);
        const ly = s.lots.find((l) => l.id === y.lotId);
        return (ly?.receivedAt || "").localeCompare(lx?.receivedAt || "");
      });
      for (const al of allocs) {
        if (needQ <= 1e-9) break;
        const left = al.qty - (al.returned || 0);
        if (left <= 1e-9) continue;
        const take = Math.min(needQ, left);
        al.returned = (al.returned || 0) + take;
        const lot = s.lots.find((l) => l.id === al.lotId);
        lot.qty += take;
        move(s, ctx, { lotId: lot.id, productId: p.id, locationId: lot.locationId, kind: "return", qty: take, reason: ret.reason, ref: ret.number });
        if (!restock) {
          lot.qty -= take;
          move(s, ctx, {
            lotId: lot.id,
            productId: p.id,
            locationId: lot.locationId,
            kind: "shrink",
            qty: -take,
            reason: "Customer return, not resellable" + (ret.reason ? ` — ${ret.reason}` : ""),
            ref: ret.number,
          });
        }
        rl.cost += take * al.cost;
        needQ -= take;
      }
      if (needQ > 1e-9) fail("Could not match the return to the lots this order shipped from");
      rl.cost = round2(rl.cost);
      ret.lines.push(rl);
      ret.subtotal = round2(ret.subtotal + rl.credit);
    }
    if (!ret.lines.length) fail("Enter a quantity to return on at least one line");
    ret.tax = round2((ret.subtotal * rate) / 100);
    ret.total = round2(ret.subtotal + ret.tax);
    s.returns.push(ret);
    return ret.id;
  }
  function setCredit(s, ctx, a) {
    need(ctx, "sales");
    const r = byId(s.returns, a.id, "Return");
    if (!["open", "applied", "refunded"].includes(a.credit)) fail("Unknown credit status");
    r.credit = a.credit;
  }

  // ---------- CSV import (same validation as the real app) ----------
  const IMPORT_COLUMNS = {
    products: ["sku*", "name*", "kind*", "category", "variety", "color", "grade", "stem_length_cm", "base_unit*", "units", "shelf_life_days", "reorder_point_base", "active", "notes"],
    vendors: ["name*", "kind", "contact_name", "email", "phone", "country", "payment_terms", "notes", "active"],
    customers: ["name*", "price_tier", "contact_name", "email", "phone", "address", "payment_terms_days", "resale_certificate", "notes", "active"],
  };
  const IMPORT_ROLE = { products: "buyer", vendors: "buyer", customers: "sales" };
  const truthy = (v, d = true) => (v === undefined || String(v).trim() === "" ? d : /^(true|yes|y|1|active)$/i.test(String(v).trim()));
  function parseUnits(str) {
    if (!str || !str.trim()) return [];
    const out = [];
    for (const part of str.split(/[;|]/)) {
      const t = part.trim();
      if (!t) continue;
      const m = t.match(/^([a-zA-Z][\w\s.-]*?)\s*=\s*([\d.]+)$/);
      if (!m || !(Number(m[2]) > 0)) return `Units must look like "bunch=25; box=250" (got "${t}")`;
      out.push({ name: m[1].trim().toLowerCase(), factor: Number(m[2]) });
    }
    return out;
  }
  function validateImport(s, entity, rows) {
    const seen = new Set();
    return rows.map((r, i) => {
      const errors = [];
      for (const c of IMPORT_COLUMNS[entity]) if (c.endsWith("*") && !(r[c.slice(0, -1)] || "").trim()) errors.push(`${c.slice(0, -1)} is required`);
      let key = "";
      let exists = false;
      let rec = {};
      const n = (v) => (v === undefined || String(v).trim() === "" ? null : Number(v));
      if (entity === "products") {
        key = (r.sku || "").trim().toUpperCase();
        exists = s.products.some((p) => p.sku === key);
        const kind = (r.kind || "").trim().toLowerCase().replace(/[\s-]+/g, "_");
        if (r.kind && !["flower", "hard_good"].includes(kind)) errors.push('kind must be "flower" or "hard_good"');
        const units = parseUnits(r.units || "");
        if (typeof units === "string") errors.push(units);
        for (const f of ["stem_length_cm", "shelf_life_days", "reorder_point_base"]) {
          const v = n(r[f]);
          if (v !== null && (!Number.isFinite(v) || v < 0)) errors.push(`${f} must be a number ≥ 0`);
        }
        rec = {
          sku: key,
          name: (r.name || "").trim(),
          kind,
          category: r.category || null,
          variety: r.variety || null,
          color: r.color || null,
          grade: r.grade || null,
          stem: n(r.stem_length_cm),
          baseUnit: (r.base_unit || "").trim().toLowerCase(),
          units: typeof units === "string" ? [] : units,
          shelfLife: n(r.shelf_life_days),
          reorder: n(r.reorder_point_base) || 0,
          active: truthy(r.active),
          notes: r.notes || null,
        };
      } else if (entity === "vendors") {
        key = (r.name || "").trim().toLowerCase();
        exists = s.vendors.some((v) => v.name.toLowerCase() === key);
        const kind = (r.kind || "grower").trim().toLowerCase();
        if (!VENDOR_KINDS.includes(kind)) errors.push("kind must be grower, distributor or supplier");
        rec = { name: (r.name || "").trim(), kind, contact: r.contact_name || null, email: r.email || null, phone: r.phone || null, country: r.country || null, terms: r.payment_terms || null, notes: r.notes || null, active: truthy(r.active) };
      } else {
        key = (r.name || "").trim().toLowerCase();
        exists = s.customers.some((c) => c.name.toLowerCase() === key);
        const tierName = (r.price_tier || "").trim().toLowerCase();
        const tier = tierName ? s.tiers.find((t) => t.name.toLowerCase() === tierName) : null;
        if (tierName && !tier) errors.push(`price tier "${r.price_tier}" doesn't exist`);
        const terms = n(r.payment_terms_days);
        if (terms !== null && (!Number.isInteger(terms) || terms < 0)) errors.push("payment_terms_days must be a whole number");
        rec = { name: (r.name || "").trim(), tierId: tier ? tier.id : null, contact: r.contact_name || null, email: r.email || null, phone: r.phone || null, address: r.address || null, terms: terms ?? 30, resale: r.resale_certificate || null, notes: r.notes || null, active: truthy(r.active) };
      }
      if (key) {
        if (seen.has(key)) errors.push("duplicate of an earlier row in this file");
        seen.add(key);
      }
      return { row: i + 2, key, rec, errors, action: exists ? "update" : "create" };
    });
  }
  function importRows(s, ctx, a) {
    need(ctx, IMPORT_ROLE[a.entity]);
    const res = validateImport(s, a.entity, a.rows || []);
    const bad = res.filter((r) => r.errors.length);
    if (bad.length) fail(`${bad.length} rows have errors (first: row ${bad[0].row}: ${bad[0].errors[0]}). Nothing was imported.`);
    let created = 0;
    let updated = 0;
    for (const r of res) {
      if (a.entity === "products") {
        const cur = s.products.find((p) => p.sku === r.key);
        if (cur) {
          const { units, baseUnit, ...rest } = r.rec;
          Object.assign(cur, rest);
          for (const u of units) if (!cur.units.some((x) => x.name === u.name)) cur.units.push({ id: uid("u"), ...u });
          updated++;
        } else {
          createProduct(s, ctx, r.rec);
          const p = s.products.find((x) => x.sku === r.key);
          p.active = r.rec.active;
          created++;
        }
      } else {
        const list = a.entity === "vendors" ? s.vendors : s.customers;
        const cur = list.find((x) => x.name.toLowerCase() === r.key);
        if (cur) {
          Object.assign(cur, r.rec);
          updated++;
        } else {
          list.push({ id: uid(a.entity === "vendors" ? "v" : "c"), ...r.rec });
          created++;
        }
      }
    }
    return { created, updated };
  }

  // ---------- derived numbers ----------
  function fmtQty(n) {
    return new Intl.NumberFormat("en-US", { maximumFractionDigits: 2 }).format(Number(n || 0));
  }
  function stockByProduct(s) {
    const m = {};
    for (const l of s.lots) {
      if (l.qty <= 1e-9) continue;
      const x = (m[l.productId] ||= { qty: 0, value: 0, lots: 0, oldest: null });
      x.qty += l.qty;
      x.value += l.qty * l.cost;
      x.lots++;
      if (!x.oldest || l.receivedAt < x.oldest) x.oldest = l.receivedAt;
    }
    for (const k in m) m[k].avgCost = m[k].qty > 0 ? m[k].value / m[k].qty : null;
    return m;
  }
  function suggestedPrice(s, customerId, p, u) {
    const c = s.customers.find((x) => x.id === customerId);
    const tier = c && s.tiers.find((t) => t.id === c.tierId);
    const tp = tier && s.tierPrices.find((t) => t.tierId === tier.id && t.unitId === u.id);
    if (tp) return tp.price;
    const st = stockByProduct(s)[p.id];
    const avg = st?.avgCost ?? lastCostBase(s, p);
    if (avg == null) return null;
    return round2(avg * u.factor * (1 + (tier ? tier.markup : 35) / 100));
  }
  function lastCostBase(s, p) {
    const l = [...s.lots].reverse().find((x) => x.productId === p.id);
    return l ? l.cost : null;
  }

  const OPS = {
    createProduct, updateProduct, addUnit, removeUnit, setTierPrice, removeTierPrice,
    saveVendor, saveCustomer, saveTier, createLocation, toggleLocation,
    createPO, updatePO, addPOLine, removePOLine, setPOStatus, deletePO, receivePO, closePO,
    transfer, shrink, adjust,
    createSO, updateSO, addSOLine, removeSOLine, setSOStatus, deleteSO, fulfill, invoice, voidInvoice, setInvoicePaid,
    createReturn, setCredit, importRows,
  };

  /** Keep the shared demo under its storage limit: roll the oldest fully paid orders
   *  (with their invoices and returns) and used-up lots off the history. */
  function trim(s) {

        if (!snap.exists) throw new DK.UserError("The demo data was cleared. Load the sample data again.");
        out = DK.apply(snap.data(), op, args, ctx);
        await stateRef.set(out.state);
      } else {
        out = DK.apply(S, op, args, ctx);
      }
      S = out.state;
      persistLocal();
      ui.error = null;
      ui.dirty = false;
      ui.pending = false;
      if (opts.after) opts.after(out.result);
      if (opts.msg) toast(typeof opts.msg === "function" ? opts.msg(out.result) : opts.msg);
    } catch (e) {
      ui.error = dbMessage(e);
      ui.notice = null;
    } finally {
      ui.busy = false;
      render();
      if (ui.error) document.querySelector("[data-error]")?.scrollIntoView({ block: "center", behavior: "smooth" });
    }
  }
  async function replaceAll(state, msg) {
    if (ui.busy) return;
    ui.busy = true;
    renderBusy();
    try {
      if (mode === "live" || mode === "empty") {
        await takeLock();
        await stateRef.set(state);
        mode = "live";
      }
      S = state;
      persistLocal();
      toast(msg);
      go("dashboard");
    } catch (e) {
      ui.error = dbMessage(e);
    } finally {
      ui.busy = false;
      render();
    }
  }
  function persistLocal() {

    const cogs = sum(sold, (s) => sum(s.lines, (l) => l.cost)) - sum(S.returns.filter((r) => DK.ymd(r.at) >= since).flatMap((r) => r.lines), (l) => l.cost);

      ${section("Tier pricing", `<p class="note" style="margin:0">Exact prices per customer tier. Without one, sales orders suggest average landed cost plus the tier's markup.</p>

      ${section("Purchase orders", pos.length ? table(["PO", "Status", "Ordered", "Expected", ">Landed total"], pos.map((po) => `<tr><td>${link("po", po.id, esc(po.number), "nowrap")}</td><td>${badge(po.status)}</td><td>${fdate(po.orderDate)}</td><td>${fdate(po.expected)}</td><td class="n">${money(poTotal(po))}</td></tr>`)) : empty("No purchase orders yet."))}
      ${section("Details", `<form class="card form" data-form="saveVendor"><input type="hidden" name="id" value="${v.id}"><fieldset class="form" style="border:0;padding:0;margin:0;grid-column:span 12" ${dis("buyer")}>${vendorFields(v)}<label class="check"><input type="checkbox" name="active" ${v.active ? "checked" : ""}> Active</label>${can("buyer") ? `<div class="actions"><button class="btn btn-p">Save changes</button></div>` : ""}</fieldset>${roleNote("buyer")}</form>`)}`;
  };
  const customerFields = (c) => `
    ${field("Business name", inp("name", c?.name, "required"), "c8")}

      ${can("warehouse") ? section("Add location", `<form class="card row" data-form="createLocation"><label class="f" style="flex:1;min-width:180px"><span>Name</span>${inp("name", "", 'required placeholder="Cooler 3"')}</label>${multi ? `<label class="f"><span>Shop</span>${sel("layoutId", shops.map((x) => [x.id, x.name]), shops[0].id, 'class="w-auto"')}</label>` : ""}<label class="f"><span>Type</span>${sel("kind", [["cooler", "Cooler"], ["shelf", "Shelf"], ["dock", "Dock / staging"], ["other", "Other"]], "cooler", 'class="w-auto"')}</label><label class="f"><span>Temp °C</span>${inp("temp", "", 'type="number" step="0.1" class="w-24"')}</label><button class="btn btn-p" ${dis("warehouse")}>Add location</button></form>`) : roleNote("warehouse")}`;

  };
  function lastCost(p, u) {
    for (let i = S.pos.length - 1; i >= 0; i--) {
      const l = S.pos[i].lines.find((x) => x.unitId === u.id);

  // Product → unit → qty → price picker (unit options and price update without a re-render)
  let pickerSuggest = null;

  function pickerSync(changed) {
    const ps = document.querySelector('[data-pick="product"]');

    const us = document.querySelector('[data-pick="unit"]');
    if (changed !== "unit") {
      const units = p.units.slice().sort((a, b) => a.factor - b.factor);
      const def = pickerSuggest.prefer === "largest" ? units[units.length - 1] : units.find((u) => u.name === "bunch") || units[0];
      us.innerHTML = units.map((u) => `<option value="${u.id}" ${u.id === def.id ? "selected" : ""}>${esc(u.name)}${u.factor !== 1 ? ` (${qty(u.factor)} ${esc(p.baseUnit)})` : ""}</option>`).join("");

      document.querySelector(".pk-note").textContent = `${qty(st?.qty || 0)} ${p.baseUnit} on hand`;
    }
    const u = unitOf(p, us.value);
    const v = pickerSuggest.suggest(p, u);
    const price = document.querySelector(`[name="${pickerSuggest.priceName}"]`);
    price.value = v === null || v === undefined ? "" : Number(v).toFixed(2);

  // ----- inventory -----
  PAGES.inventory = () => {
    const view = ui.q.view === "lots" ? "lots" : "stock";

    let lots = onHandLots().filter((l) => {
      const p = P(l.productId);
      return (!ui.q.location || l.locationId === ui.q.location) && (!ui.q.kind || p.kind === ui.q.kind) && (!ui.q.product || l.productId === ui.q.product) && (!q || `${p.sku} ${p.name} ${l.code}`.toLowerCase().includes(q));

    const byP = {};

      const x = (byP[l.productId] ||= { qty: 0, value: 0, lots: 0, oldest: 0, soonest: null });
      x.qty += l.qty; x.value += l.qty * l.cost; x.lots++;
      x.oldest = Math.max(x.oldest, DK.daysBetween(DK.ymd(l.receivedAt), today()));

      if (d !== null) x.soonest = x.soonest === null ? d : Math.min(x.soonest, d);
    }

    return `${head("Inventory", "What's on hand, where it is, and how old it is", `

        ${stat("Expiring ≤ 3 days", lots.filter((l) => daysTo(l.expires) !== null && daysTo(l.expires) <= 3).length, "", ["inventory", { ...ui.q, view: "lots", sort: "expiry" }], "warn")}</div>

      </form>

      ${!lots.length ? empty("Nothing on hand matches.") : view === "stock"
        ? table(["Product", ">On hand", ">Lots", ">Oldest", "Soonest expiry", ">Value"], Object.entries(byP).sort((a, b) => P(a[0]).name.localeCompare(P(b[0]).name)).map(([pid, x]) => {
            const p = P(pid);
            return `<tr><td><div class="ic">${thumb(p.name, p.img, 32)}<div>${link("product", pid, esc(p.name))}<div class="small code">${esc(p.sku)}</div></div></div></td><td class="n">${qty(x.qty)} ${esc(p.baseUnit)}</td><td class="n"><button type="button" class="lnk" data-go="inventory" data-q='${esc(JSON.stringify({ view: "lots", product: pid }))}'>${x.lots}</button></td><td class="n">${x.oldest}d</td><td>${expiry(x.soonest)}</td><td class="n">${money(x.value)}</td></tr>`;

          }).join("")}</ul>`

            const p = P(l.productId);
            return `<tr><td>${link("lot", l.id, esc(l.code), "code nowrap")}</td><td><div class="ic">${thumb(p.name, l.img || p.img, 28)}<span>${esc(p.name)}</span></div></td><td>${esc(loc(l.locationId)?.name)}</td><td>${fdate(l.receivedAt)}</td><td class="n">${DK.daysBetween(DK.ymd(l.receivedAt), today())}d</td><td>${expiry(daysTo(l.expires))}</td><td class="n">${qty(l.qty)} ${esc(p.baseUnit)}</td><td class="n">${money4(l.cost)}</td><td class="n">${money(l.qty * l.cost)}</td></tr>`;
          }))}`;
  };
  const KIND = { receive: "Received", transfer_in: "Transferred in", transfer_out: "Transferred out", sale: "Sold", shrink: "Shrink", adjust: "Count adjustment", return: "Customer return" };
  const moveRow = (m, withProduct) => {

  PAGES.movements = () => {

  };
  PAGES.lot = () => {

        `<button type="button" class="btn" data-go="labels" data-q='${esc(JSON.stringify({ lot: l.id }))}'>Label</button>`, ["inventory", "Inventory", null])}
      <div class="stats">${stat("On hand", inUnits(l.qty, p), `${qty(l.qty)} of ${qty(l.qtyReceived)} ${esc(p.baseUnit)}`)}${stat("Landed cost", money4(l.cost), `per ${esc(p.baseUnit)} · value ${money(l.qty * l.cost)}`)}
        ${stat("Received", fdate(l.receivedAt))}${stat("Expires", fdate(l.expires), expiry(daysTo(l.expires)))}</div>
      ${work ? `<div class="grid2" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))">

          ${sel("toLocationId", [["", "To location…"], ...S.locations.filter((x) => x.active && x.id !== l.locationId).map((x) => [x.id, x.name])], "", "required")}<button class="btn">Move stock</button></form>
        <form class="card section" data-form="shrink"><h3>Record shrink</h3><div class="row"><input name="qty" type="number" min="0" step="any" required placeholder="Qty" style="flex:1">${unitSel}</div>
          ${sel("reason", ["Spoiled / wilted", "Damaged in handling", "Aged out / dumped", "Broken (hard goods)", "Quality reject", "Other"].map((r) => [r, r]), "Spoiled / wilted")}
          <input name="note" placeholder="Note (optional)"><button class="btn btn-d">Write off</button></form>
        <form class="card section" data-form="adjust"><h3>Cycle count</h3><div class="row"><input name="qty" type="number" min="0" step="any" required placeholder="Counted" style="flex:1">${unitSel}</div>
          <input name="reason" value="Cycle count" required><button class="btn">Set counted qty</button></form></div>` : l.qty > 1e-9 ? roleNote("warehouse") : ""}
      <div class="grid2">
        ${section("Delivery photo", photoControl("lot", l.id, l.img, `Lot ${l.code}`, ["buyer", "warehouse"]) + `<p class="note" style="margin:0">Snap the boxes as they come off the truck: grade, damage, the farm's label.</p>`)}
        ${(() => { const lay = DK.layoutOf(S, DK.locLayout(S, loc(l.locationId))); const hId = DK.homeOf(S, p, lay.id); return section("Location in shop", `<div class="card section">${miniMap(lay, hId, [l.locationId])}<div class="small"><span class="key home"></span> ${esc(loc(hId)?.name || "No home area")} · <span class="key away"></span> This lot: ${esc(loc(l.locationId)?.name)}${DK.layoutsOf(S).length > 1 ? ` (${esc(lay.name)})` : ""}</div>${hId && hId !== l.locationId ? `<p class="t-warn small" style="margin:0">This lot is outside ${esc(p.name)}'s home area.</p>` : ""}</div>`); })()}
      </div>
      ${section("History", table(["When", "What", "Location", ">Qty", "Reference / reason", "By"], S.moves.filter((m) => m.lotId === l.id).map((m) => moveRow(m, false))))}`;
  };

  // ----- labels & scan -----
  PAGES.labels = () => {
    let items = [], title = "", back = ["inventory", "Inventory"];
    if (ui.q.test) {
      items = [{ code: "TEST-LABEL", title: "Test label", sku: "TEST-LABEL", lines: ["If this fits the label, the size is right", "DKaydent Wholesale"] }];

      back = ["settings", "Settings"];

      title = ids.length === 1 ? "Product label" : "Product labels";
      back = ids.length === 1 ? ["product", "Product", ids[0]] : ["products", "Products"];
    } else {
      let lots;
      if (ui.q.lot) {
        lots = S.lots.filter((l) => l.id === ui.q.lot);

      } else if (ui.q.po) {
        const po = S.pos.find((x) => x.id === ui.q.po);
        const ids = new Set(S.moves.filter((m) => m.kind === "receive" && m.ref === po?.number).map((m) => m.lotId));
        lots = S.lots.filter((l) => ids.has(l.id));
        title = `Lots received on ${po?.number}`;
        back = ["po", po?.number || "PO", ui.q.po];
      } else {
        const q = (ui.q.q || "").toLowerCase();
        lots = onHandLots().filter((l) => {
          const p = P(l.productId);

        });

      items = lots.map((l) => {

      ${items.length ? labelSheet(items) : empty("No labels to show.")}`;
  };
  function resolveCode(raw) {
    const code = raw.trim();
    const up = code.toUpperCase();
    const l = S.lots.find((x) => x.code.toUpperCase() === up);
    if (l) return ["lot", l.id];
    const p = S.products.find((x) => x.sku === up);
    if (p) return ["product", p.id];
    const po = S.pos.find((x) => x.number === up);
    if (po) return ["po", po.id];
    const so = S.sos.find((x) => x.number === up);
    if (so) return ["so", so.id];
    const inv = S.invoices.find((x) => x.number === up);
    if (inv) return ["invoice", inv.id];
    const r = S.returns.find((x) => x.number === up);
    if (r) return ["so", r.soId];

    if (sh) return ["shipment", sh.id];
    return null;
  }
  PAGES.scan = () => {
    const examples = onHandLots().slice(-3).map((l) => l.code).concat([S.products[0]?.sku, S.sos[S.sos.length - 1]?.number].filter(Boolean));
    return `${head("Scan", "Scan a lot label to move, write off or count it. Scan a SKU, PO, order or invoice number to open it.")}
      ${ui.scanMsg ? `<div class="banner banner-bad" role="alert">${esc(ui.scanMsg)}</div>` : ""}

      </form>`;
  };

  // ----- sales -----
  const SO_FILTERS = { open: ["draft", "confirmed"], draft: ["draft"], confirmed: ["confirmed"], fulfilled: ["fulfilled"], invoiced: ["invoiced"], cancelled: ["cancelled"], all: null };
  PAGES.sales = () => {

      ${can("sales") ? section("New sales order", `<form class="card row" data-form="createSO">

  PAGES.so = () => {
