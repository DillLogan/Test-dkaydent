    if (isDraft || so.status === "confirmed") acts.push(`<button type="button" class="btn" data-go="pullTicket" data-id="${so.id}">Print pull ticket</button>`);
    if (can("sales") && so.status !== "cancelled") acts.unshift(`<button type="button" class="btn ${so.mustCheck ? "" : "btn-d"}" data-act="mustCheck" ${dis("sales")}>${so.mustCheck ? "Remove MUST CHECK" : "Mark MUST CHECK"}</button>`);
    if (inv) acts.push(`<button type="button" class="btn btn-p" data-go="invoice" data-id="${inv.id}">View ${esc(inv.number)}</button>`);
    const picker = isDraft && can("sales") ? linePicker("addSOLine", "price", "Price per unit", "smallest", (p, u) => DK.suggestedPrice(S, so.customerId, p, u)) : "";
    return `${head(`${esc(so.number)} ${badge(so.status)}`, `${link("customer", so.customerId, esc(c?.name))}${t ? " · " + esc(t.name) : ""} · ordered ${fdate(so.orderDate)}${so.ship ? " · ships " + fdate(so.ship) : ""}${so.recurringId ? ` · ↻ ${link("recurringOne", so.recurringId, esc((S.recurring || []).find((r) => r.id === so.recurringId)?.name || "Recurring order"))}` : ""}`, so.mustCheck ? `<div class="mc-col">${mustCheckBox()}<div class="actions">${acts.join("")}</div></div>` : acts.join(""), ["sales", "Sales orders"])}
      ${short ? `<div class="banner banner-warn">Some lines need more than is on hand. Fulfillment will be blocked until stock is received.</div>` : ""}
      ${section("Lines", so.lines.length ? table(["Product", ">Qty", ">Price", ">Extended", ...(showCost ? [">FIFO cost", ">Margin"] : [">On hand"]), ...(isDraft && can("sales") ? [""] : [])], so.lines.map((l) => {
        const p = P(l.productId), u = unitOf(p, l.unitId), ext = l.qty * l.price;
        return `<tr><td>${esc(p.name)}<div class="small code">${esc(p.sku)}</div></td><td class="n">${qty(l.qty)} ${esc(u.name)}${u.factor !== 1 ? `<div class="small">${qty(l.qty * u.factor)} ${esc(p.baseUnit)}</div>` : ""}</td><td class="n">${money(l.price)}</td><td class="n">${money(ext)}</td>
          ${showCost ? `<td class="n">${money(l.cost)}<div class="small">${l.allocs.map((a) => esc(lot(a.lotId)?.code || "")).join(", ")}</div></td><td class="n">${money(ext - l.cost)}<div class="small">${pct(ext ? (ext - l.cost) / ext : null)}</div></td>`
            : `<td class="n ${needBy[l.productId] > (st[l.productId]?.qty || 0) + 1e-9 ? "t-warn" : ""}">${qty(st[l.productId]?.qty || 0)} ${esc(p.baseUnit)}</td>`}
          ${isDraft && can("sales") ? `<td class="n"><button type="button" class="btn btn-s btn-d" data-act="removeSOLine" data-v="${l.id}" ${dis("sales")}>Remove</button></td>` : ""}</tr>`;
      }), `<tfoot><tr><td colspan="3" class="n"><b>Subtotal</b></td><td class="n"><b>${money(revenue)}</b></td>${showCost ? `<td class="n">${money(cost)}</td><td class="n"><b>${money(revenue - cost)}</b><div class="small">${pct(revenue ? (revenue - cost) / revenue : null)}</div></td>` : "<td></td>"}${isDraft && can("sales") ? "<td></td>" : ""}</tr></tfoot>`) : empty("No lines yet."))}
      ${picker ? section("Add line", `<form class="card section" data-form="addSOLine">${picker}<p class="note" style="margin:0">Suggested price uses the ${esc(t?.name || "default")} tier price, or average landed cost + ${t ? t.markup : 35}% markup.</p><div class="actions"><button class="btn btn-p">Add line</button></div></form>`) : ""}
      ${so.status === "confirmed" && can("sales", "warehouse") ? pickSection(so) : ""}
      ${(["fulfilled", "invoiced"].includes(so.status) || rets.length) ? returnsSection(so, rets, inv) : ""}
      ${so.status === "fulfilled" && can("sales") ? section("Invoice", `<form class="card row" data-form="invoice"><label class="f"><span>Sales tax %</span>${inp("taxRate", c?.resale ? 0 : 6, 'type="number" min="0" step="0.001" class="w-24"')}</label><p class="note" style="margin:0 0 8px">${c?.resale ? "Customer has a resale certificate on file." : "Leave at 0 for resale-exempt customers."}</p><button class="btn btn-p" ${dis("sales")}>Create invoice</button></form>`) : ""}
      ${inv ? payPanel(so, inv.total, "invoice", false, "Payments (take more on the invoice)") : ["draft", "confirmed", "fulfilled"].includes(so.status) && so.lines.length ? payPanel(so, DK.round2(soTotal(so)), "deposit", true, "Deposit (optional)") : ""}
      ${section("Details", `<form class="card form" data-form="updateSO"><fieldset class="form" style="border:0;padding:0;margin:0;grid-column:span 12" ${["invoiced", "cancelled"].includes(so.status) ? "disabled" : dis("sales")}>
        ${field("Ship / pickup date", inp("ship", so.ship, 'type="date"'), "c3")}${field("Notes", inp("notes", so.notes), "c8")}
        ${can("sales") && !["invoiced", "cancelled"].includes(so.status) ? `<div class="actions"><button class="btn btn-p">Save details</button></div>` : ""}</fieldset></form>`)}`;
  };
  function suggestPicks(so) {
    const picks = {};
    const used = {};
    for (const l of so.lines) {
      let need = l.qty * lineFactor(l);
      for (const lt of DK.fifoLots(S, l.productId)) {
        const avail = lt.qty - (used[lt.id] || 0);
        const take = Math.max(0, Math.min(need, avail));
        picks[`${l.id}:${lt.id}`] = take;
        used[lt.id] = (used[lt.id] || 0) + take;
        need -= take;
      }
    }
    return picks;
  }
  function pickSection(so) {
    if (!ui.picks || ui.picks.so !== so.id) ui.picks = { so: so.id, q: suggestPicks(so), open: false };
    const pk = ui.picks;
    const body = !pk.open
      ? `<button type="button" class="btn" data-act="openPicks">Hand-pick lots / scan to pick</button>`
      : `<div class="card section"><span class="lbl">Scan lot labels to pick from them</span>
          <div class="row"><input id="pick-scan" class="code" placeholder="Scan or type a lot code, then Enter" style="flex:1" autocomplete="off"><button type="button" class="btn" data-act="pickScan">Go</button></div>
          ${ui.pickMsg ? `<p class="small" style="margin:0">${esc(ui.pickMsg)}</p>` : ""}</div>
        ${so.lines.map((l) => {
          const p = P(l.productId), need = l.qty * lineFactor(l);
          const lots = DK.fifoLots(S, l.productId);
          const picked = sum(lots, (lt) => pk.q[`${l.id}:${lt.id}`] || 0);
          const ok = Math.abs(picked - need) < 1e-9;
          return `<div class="tw"><div class="section-head" style="padding:8px 12px;border-bottom:1px solid var(--line);background:var(--surface-2)"><div><b>${esc(p.name)}</b> <span class="small code">${esc(p.sku)}</span></div><div class="small ${ok ? "t-good" : "t-warn"}" id="pk-${l.id}">Picked ${qty(picked)} of ${qty(need)} ${esc(p.baseUnit)}</div></div>
            ${lots.length ? `<table><thead><tr><th>Lot</th><th>Location</th><th>Received</th><th>Expires</th><th class="n">Available</th><th class="n">Pick (${esc(p.baseUnit)})</th></tr></thead><tbody>${lots.map((lt) => {
              const key = `${l.id}:${lt.id}`;
              return `<tr class="${pk.flash === key ? "flash" : ""}"><td class="code">${esc(lt.code)}</td><td>${esc(loc(lt.locationId)?.name)}</td><td>${fdate(lt.receivedAt)}</td><td>${expiry(daysTo(lt.expires))}</td><td class="n">${qty(lt.qty)}</td>
                <td class="n"><input type="number" min="0" max="${lt.qty}" step="any" class="w-24" style="text-align:right" data-pick-key="${key}" data-line="${l.id}" value="${pk.q[key] || 0}"></td></tr>`;
            }).join("")}</tbody></table>` : `<p class="t-bad" style="padding:8px 12px;margin:0">No stock on hand.</p>`}</div>`;
        }).join("")}
        <div class="actions"><button type="button" class="btn" data-act="resetPicks">Reset to oldest-first</button><button type="button" class="btn btn-p" data-act="fulfillPicked">Fulfill with these lots</button></div>`;
    return section("Or choose lots", body);
  }
  function returnsSection(so, rets, inv) {
    const returned = {};
    for (const r of rets) for (const rl of r.lines) returned[rl.soLineId] = (returned[rl.soLineId] || 0) + rl.qtyBase;
    const canRet = ["fulfilled", "invoiced"].includes(so.status) && can("sales", "warehouse");
    return section("Returns & credits", `
      ${rets.length ? table(["Return", "When", "Items", "Reason", ">Credit", "Credit status"], rets.map((r) => `<tr><td class="nowrap"><b>${esc(r.number)}</b></td><td class="nowrap">${fdt(r.at)}</td>
        <td>${r.lines.map((rl) => { const p = P(rl.productId), sl = so.lines.find((x) => x.id === rl.soLineId); return `<div>${qty(rl.qty)} ${esc(unitOf(p, sl?.unitId)?.name || p.baseUnit)} ${esc(p.name)} <span class="${rl.restock ? "t-good" : "t-bad"}">(${rl.restock ? "restocked" : "written off"})</span></div>`; }).join("")}</td>
        <td>${esc(r.reason || "—")}</td><td class="n">${money(r.total)}</td><td><div class="row" style="align-items:center">${badge(r.credit)}${can("sales") && r.credit === "open" ? `<button type="button" class="btn btn-s" data-act="credit" data-id="${r.id}" data-v="applied" ${dis("sales")}>Applied</button><button type="button" class="btn btn-s" data-act="credit" data-id="${r.id}" data-v="refunded" ${dis("sales")}>Refunded</button>` : ""}</div></td></tr>`)) : ""}
      ${canRet ? `<details><summary class="btn">Record a return</summary><form class="card section" data-form="createReturn" style="margin-top:10px">
        ${table(["Product", ">Sold", ">Returnable", "Return qty", "Resellable?"], so.lines.map((l) => {
          const p = P(l.productId), u = unitOf(p, l.unitId), left = l.qty - (returned[l.id] || 0) / u.factor;
          return `<tr><td>${esc(p.name)}</td><td class="n">${qty(l.qty)} ${esc(u.name)}</td><td class="n">${qty(left)} ${esc(u.name)}</td><td><input name="rqty_${l.id}" type="number" min="0" max="${left}" step="any" class="w-24" ${left <= 1e-9 ? "disabled" : ""}></td><td><label class="check"><input type="checkbox" name="restock_${l.id}" checked ${left <= 1e-9 ? "disabled" : ""}> Restock</label></td></tr>`;
        }))}
        ${field("Reason", inp("reason", "", 'placeholder="Wrong color, damaged in transit, over-shipped…"'), "")}
        <p class="note" style="margin:0">Restocked items go back into the exact lots they shipped from. Unchecked items are returned and written off as shrink. The customer gets a credit at the sale price${inv ? " plus the invoice's tax rate" : ""}.</p>
        <div class="actions"><button class="btn btn-p" ${dis("sales", "warehouse")}>Record return</button></div></form></details>` : ""}`);
  }

  // ----- invoices & returns -----
  PAGES.invoices = () => {
    const f = ["open", "overdue", "paid", "void", "all"].includes(ui.q.status) ? ui.q.status : "open";
    const list = S.invoices.filter((i) => f === "all" || (f === "overdue" ? invStatus(i) === "overdue" : i.status === f)).slice().reverse();
    return `${head("Invoices", `${list.length} shown · ${money(sum(list, (i) => i.total))}`, `<button type="button" class="btn" data-act="export" data-v="invoices">Export CSV</button>`)}
      ${tabs(["open", "overdue", "paid", "void", "all"].map((k) => [k, k[0].toUpperCase() + k.slice(1)]), f, "invTab2")}
      ${list.length ? table(["Invoice", "Customer", "Order", "Status", "Issued", "Due", ">Total"], list.map((i) => {
        const so = S.sos.find((x) => x.id === i.soId);
        return `<tr><td>${link("invoice", i.id, `<b>${esc(i.number)}</b>`, "nowrap")}</td><td>${esc(cust(i.customerId)?.name)}</td><td>${so ? link("so", so.id, esc(so.number), "nowrap") : "—"}</td><td>${badge(invStatus(i))}</td><td>${fdate(i.issued)}</td><td class="${invStatus(i) === "overdue" ? "t-bad" : ""}">${fdate(i.due)}</td><td class="n">${money(i.total)}</td></tr>`;
      })) : empty("No invoices here. Invoices are created from fulfilled sales orders.")}`;
  };
  PAGES.invoice = () => {
    const i = S.invoices.find((x) => x.id === ui.id);
    if (!i) return empty("That invoice no longer exists.");
    const so = S.sos.find((x) => x.id === i.soId), c = cust(i.customerId);
    const rets = S.returns.filter((r) => r.soId === i.soId);
    const acts = [];
    const paidAmt = DK.soPaid(S, i.soId);
    if (can("sales") && i.status === "open") acts.push(`<button type="button" class="btn btn-d" data-act="voidInvoice" ${dis("sales")}>Void</button>`, ...(paidAmt ? [] : [`<button type="button" class="btn btn-p" data-act="paid" data-v="1" ${dis("sales")}>Mark paid</button>`]));
    if (can("sales") && i.status === "paid" && !paidAmt) acts.push(`<button type="button" class="btn" data-act="paid" data-v="0" ${dis("sales")}>Mark unpaid</button>`);
    return `${head(esc(i.number), `${badge(invStatus(i))}`, acts.join(""), ["invoices", "Invoices"])}
      <article class="card" style="max-width:760px;width:100%;margin:0 auto;padding:28px;display:grid;gap:22px">
        <div class="head"><div><div class="small" style="letter-spacing:.14em;text-transform:uppercase;color:var(--brand);font-weight:600">DKaydent</div><div style="font-size:20px;font-weight:650">Wholesale</div></div>
          <div style="text-align:right"><div style="font-size:22px;font-weight:650">Invoice</div><div class="code">${esc(i.number)}</div></div></div>
        <div class="grid2" style="gap:16px"><div><div class="lbl">Bill to</div><b>${esc(c?.name)}</b>${c?.contact ? `<div>${esc(c.contact)}</div>` : ""}${c?.email ? `<div class="small">${esc(c.email)}</div>` : ""}${c?.resale ? `<div class="small">Resale cert #${esc(c.resale)}</div>` : ""}</div>
          <div class="small" style="display:grid;grid-template-columns:auto auto;gap:2px 16px;justify-content:end"><span>Issued</span><span>${fdate(i.issued)}</span><span>Due</span><span class="${invStatus(i) === "overdue" ? "t-bad" : ""}">${fdate(i.due)}</span><span>Terms</span><span>Net ${c?.terms}</span><span>Order</span><span>${so ? link("so", so.id, esc(so.number)) : "—"}</span>${i.paidAt ? `<span>Paid</span><span>${fdate(i.paidAt)}</span>` : ""}</div></div>
        ${table(["Item", ">Qty", ">Price", ">Amount"], (so?.lines || []).map((l) => { const p = P(l.productId); return `<tr><td>${esc(p.name)}<div class="small code">${esc(p.sku)}</div></td><td class="n">${qty(l.qty)} ${esc(unitOf(p, l.unitId)?.name)}</td><td class="n">${money(l.price)}</td><td class="n">${money(l.qty * l.price)}</td></tr>`; }))}
        <div style="margin-left:auto;width:min(100%,280px);display:grid;gap:4px"><div class="head"><span class="small">Subtotal</span><span class="n">${money(i.subtotal)}</span></div><div class="head"><span class="small">Tax (${i.taxRate}%)</span><span class="n">${money(i.tax)}</span></div><div class="head" style="border-top:1px solid var(--line);padding-top:6px;font-weight:650"><span>${paidAmt ? "Total" : "Total due"}</span><span class="n">${money(i.total)}</span></div>
          ${paidAmt ? `<div class="head"><span class="small">Paid</span><span class="n">−${money(paidAmt)}</span></div><div class="head" style="font-weight:650"><span>Balance due</span><span class="n">${money(Math.max(0, i.total - paidAmt))}</span></div>` : ""}</div>
      </article>
      ${i.status !== "void" && so ? payPanel(so, i.total, "invoice", i.status === "open", "Payments") : ""}
      ${rets.length ? section("Credits on this order", table(["Return", "Date", "Status", ">Credit"], rets.map((r) => `<tr><td>${link("so", r.soId, esc(r.number), "nowrap")}</td><td>${fdate(r.at)}</td><td>${badge(r.credit)}</td><td class="n">${money(r.total)}</td></tr>`))) : ""}`;
  };
  PAGES.returns = () => {
    const f = ["open", "applied", "refunded", "all"].includes(ui.q.status) ? ui.q.status : "open";
    const list = S.returns.filter((r) => f === "all" || r.credit === f).slice().reverse();
    return `${head("Returns & credits", `${list.length} shown · ${money(sum(list, (r) => r.total))} in credits. Record a return from a fulfilled or invoiced sales order.`, `<button type="button" class="btn" data-act="export" data-v="returns">Export CSV</button>`)}
      ${tabs(["open", "applied", "refunded", "all"].map((k) => [k, k[0].toUpperCase() + k.slice(1)]), f, "retTab")}
      ${list.length ? table(["Return", "Customer", "Order", "When", "Items", ">Credit", "Status"], list.map((r) => {
        const so = S.sos.find((x) => x.id === r.soId);
        return `<tr><td class="nowrap"><b>${esc(r.number)}</b></td><td>${link("customer", r.customerId, esc(cust(r.customerId)?.name))}</td><td>${so ? link("so", so.id, esc(so.number), "nowrap") : "—"}</td><td class="nowrap">${fdt(r.at)}</td>
          <td>${r.lines.map((rl) => `<div>${qty(rl.qtyBase)} ${esc(P(rl.productId)?.baseUnit)} ${esc(P(rl.productId)?.name)} <span class="${rl.restock ? "t-good" : "t-bad"}">(${rl.restock ? "restocked" : "written off"})</span></div>`).join("")}${r.reason ? `<div class="small">${esc(r.reason)}</div>` : ""}</td>
          <td class="n">${money(r.total)}</td><td><div class="row" style="align-items:center">${badge(r.credit)}${can("sales") && r.credit === "open" ? `<button type="button" class="btn btn-s" data-act="credit" data-id="${r.id}" data-v="applied" ${dis("sales")}>Applied</button><button type="button" class="btn btn-s" data-act="credit" data-id="${r.id}" data-v="refunded" ${dis("sales")}>Refunded</button>` : ""}</div></td></tr>`;
      })) : empty("No returns here.")}`;
  };

  // ----- reports -----
  PAGES.reports = () => {
    const to = ui.q.to || today();
    const from = ui.q.from || DK.addDays(to, -29);
    const inRange = (iso) => { const d = DK.ymd(iso); return d >= from && d <= to; };
    const lines = S.sos.filter((s) => s.fulfilledAt && inRange(s.fulfilledAt)).flatMap((s) => s.lines.map((l) => ({ ...l, customerId: s.customerId })));
    const rets = S.returns.filter((r) => inRange(r.at));
    const rl = rets.flatMap((r) => r.lines.map((l) => ({ ...l, customerId: r.customerId })));
    const gross = sum(lines, (l) => l.qty * l.price), credits = sum(rl, (l) => l.credit);
    const rev = gross - credits, cogs = sum(lines, (l) => l.cost) - sum(rl, (l) => l.cost);
    const shrinkMoves = S.moves.filter((m) => m.kind === "shrink" && inRange(m.at));
    const shrinkVal = sum(shrinkMoves, (m) => -m.qty * (lot(m.lotId)?.cost || 0));
    const agg = (key) => {
      const m = {};
      for (const l of lines) { const x = (m[key(l)] ||= { qty: 0, rev: 0, cost: 0, ret: 0, retCost: 0 }); x.qty += l.qty * lineFactor(l); x.rev += l.qty * l.price; x.cost += l.cost; }
      for (const l of rl) { const x = (m[key(l)] ||= { qty: 0, rev: 0, cost: 0, ret: 0, retCost: 0 }); x.ret += l.credit; x.retCost += l.cost; if (key === byProd) x.qty -= l.qtyBase; }
      return Object.entries(m).sort((a, b) => b[1].rev - a[1].rev);
    };
    const byProd = (l) => l.productId;
    const marginTable = (rows, nameFn, qtyLabel, unitFn) => {
      const max = Math.max(1, ...rows.map(([, x]) => x.rev - x.ret));
      return table(["Name", `>${qtyLabel}`, ">Sales", ">Returns", ">Net cost", ">Margin", ">Margin %", ""], rows.map(([k, x]) => {
        const net = x.rev - x.ret, m = net - (x.cost - x.retCost);
        return `<tr><td>${nameFn(k)}</td><td class="n">${qty(x.qty)} ${unitFn ? esc(unitFn(k)) : ""}</td><td class="n">${money(x.rev)}</td><td class="n ${x.ret ? "t-bad" : "t-faint"}">${x.ret ? "−" + money(x.ret) : "—"}</td><td class="n">${money(x.cost - x.retCost)}</td><td class="n">${money(m)}</td><td class="n ${net && m / net < 0.15 ? "t-warn" : ""}">${pct(net ? m / net : null)}</td>
          <td style="width:90px"><div class="bar-bg"><div class="bar" style="width:${Math.max(0, (net / max) * 100)}%"></div></div></td></tr>`;
      }));
    };
    const flow = {};
    for (const m of S.moves.filter((m) => inRange(m.at))) {
      const f = (flow[m.productId] ||= { rec: 0, sold: 0, shr: 0 });
      if (m.kind === "receive") f.rec += m.qty;
      if (m.kind === "sale") f.sold -= m.qty;
      if (m.kind === "return") f.sold -= m.qty;
      if (m.kind === "shrink") f.shr -= m.qty;
    }
    const buckets = [["0–2 days", -1, 2], ["3–5 days", 2, 5], ["6–10 days", 5, 10], ["11–30 days", 10, 30], ["31+ days", 30, 1e9]].map(([label, lo, hi]) => {
      const ls = onHandLots().filter((l) => { const a = DK.daysBetween(DK.ymd(l.receivedAt), today()); return a > lo && a <= hi; });
      return [label, ls.length, sum(ls.filter((l) => P(l.productId).kind === "flower"), (l) => l.qty * l.cost), sum(ls.filter((l) => P(l.productId).kind === "hard_good"), (l) => l.qty * l.cost)];
    });
    const reasons = {};
    for (const m of shrinkMoves) { const r = (m.reason || "Unspecified").split(" — ")[0]; reasons[r] = (reasons[r] || 0) + -m.qty * (lot(m.lotId)?.cost || 0); }
    return `${head("Reports", `${fdate(from)} – ${fdate(to)}`, `<button type="button" class="btn" data-act="export" data-v="sales-lines">Export sales</button><button type="button" class="btn" data-act="export" data-v="shrink">Export shrink</button>`)}
      <form class="row" data-filter><label class="f"><span>From</span>${inp("from", from, 'type="date"')}</label><label class="f"><span>To</span>${inp("to", to, 'type="date"')}</label><button class="btn">Run</button>
        <button type="button" class="btn" data-go="reports" data-q='${esc(JSON.stringify({ from: DK.addDays(today(), -6), to: today() }))}'>Last 7 days</button>

  function parseCSV(text) {
    const src = text.replace(/^﻿/, "");
    const rows = [];
    let row = [], f = "", qd = false;
    for (let i = 0; i < src.length; i++) {
      const ch = src[i];
      if (qd) { if (ch === '"') { if (src[i + 1] === '"') { f += '"'; i++; } else qd = false; } else f += ch; continue; }
      if (ch === '"') qd = true;
      else if (ch === ",") { row.push(f); f = ""; }
      else if (ch === "\n" || ch === "\r") { if (ch === "\r" && src[i + 1] === "\n") i++; row.push(f); rows.push(row); row = []; f = ""; }
      else f += ch;
    }
    if (f !== "" || row.length) { row.push(f); rows.push(row); }
    const clean = rows.filter((r) => r.some((c) => c.trim() !== ""));
    const [h, ...body] = clean;
    if (!h) return { headers: [], rows: [] };
    const headers = h.map((x) => x.trim().toLowerCase().replace(/[\s-]+/g, "_"));
    return { headers, rows: body.map((r) => Object.fromEntries(headers.map((k, i) => [k, (r[i] ?? "").trim()]))) };
  }

  function pickScan(code) {
    const so = S.sos.find((x) => x.id === ui.id);
    const c = code.trim().toUpperCase();
    if (!c) return;
    for (const l of so.lines) {
      const lots = DK.fifoLots(S, l.productId);
      const hit = lots.find((x) => x.code.toUpperCase() === c);
      if (!hit) continue;
      const need = l.qty * lineFactor(l);
      const from = Math.min(need, hit.qty);
      let rest = need - from;
      ui.picks.q[`${l.id}:${hit.id}`] = from;
      for (const o of lots) {
        if (o.id === hit.id) continue;
        const k = `${l.id}:${o.id}`;
        const keep = Math.min(ui.picks.q[k] || 0, rest);
        ui.picks.q[k] = keep;
        rest -= keep;
      }
      ui.picks.flash = `${l.id}:${hit.id}`;
      ui.pickMsg = `${hit.code} → ${qty(from)} ${P(l.productId).baseUnit} of ${P(l.productId).name}`;
      render();
      setTimeout(() => document.getElementById("pick-scan")?.focus(), 0);
      return;
    }
    ui.pickMsg = `${code} isn't an available lot for any line on this order.`;
    render();
    setTimeout(() => document.getElementById("pick-scan")?.focus(), 0);
  }

        cur.onerror = () => res();
      });

        upload: (blob) => new Promise((res, rej) => {
          const id = Array.from(crypto.getRandomValues(new Uint8Array(16)), (b) => b.toString(16).padStart(2, "0")).join("");
          const tx = db0.transaction("img", "readwrite");
          tx.objectStore("img").put(blob, id);

  async function resizeImage(file, maxSide) {
    const bmp = await createImageBitmap(file);
    const scale = Math.min(1, maxSide / Math.max(bmp.width, bmp.height));

    c.width = Math.round(bmp.width * scale);
    c.height = Math.round(bmp.height * scale);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise((r) => c.toBlob(r, "image/webp", 0.85));
    if (blob && blob.type === "image/webp") return { blob, w: c.width, h: c.height };

    const f = feetOf(curLayout()), [sx, sy] = steps(curLayout());
    const w = f ? Math.min(60, 10 / f.x) : 20, h = f ? Math.min(60, 8 / f.y) : 16; // 10 × 8 ft when the floor size is known
    const snap = (v, st) => Math.round(v / st) * st;
    ui.fp.sel = el.dataset.v; ui.fp.door = null; ui.fp.vtx = null;
    commit("saveArea", { id: el.dataset.v, pts: DK.shapes.rect(snap(50 - w / 2, sx), snap(50 - h / 2, sy), snap(w, sx), snap(h, sy)), c: DK.AREA_COLORS[S.locations.filter((l) => l.map).length % DK.AREA_COLORS.length] }, { msg: "Placed. Drag it where it goes." });
  };
  ACTS.fpDoorRemove = () => { const id = ui.fp.door; ui.fp.door = null; commit("removeDoor", { id }, { msg: "Removed" }); };
  FORMS.addDoor = (o) => commit("addDoor", { layoutId: curLayout().id, kind: o.kind, label: o.label }, { after: (id) => { ui.fp.door = id; ui.fp.sel = null; }, msg: "Added. Drag it along the wall to where it is." });
  FORMS.saveDoor = (o) => commit("saveDoor", { id: o.id, kind: o.kind, label: o.label }, { msg: "Saved" });
  FORMS.layoutForm = (o) => {
    const f = ui.fp.form, lay = curLayout();
    const done = (to) => { ui.fp.form = null; ui.fp.sel = null; ui.fp.door = null; if (to) { ui.fp.layout = to; go("floorplan", null, { layout: to }); } };
    if (f === "new") commit("createLayout", { name: o.name }, { after: (id) => done(id), msg: "Layout created" });
    else if (f === "rename") commit("renameLayout", { id: lay.id, name: o.name }, { after: () => done(), msg: "Renamed" });
    else if (f === "delete") commit("deleteLayout", { id: lay.id, moveTo: o.moveTo }, { after: (to) => done(to), msg: "Layout deleted" });
  };
  // move, reshape, resize and rotate areas; slide entries and exits along the walls
  let drag = null, lastTap = null;
  const planPt = (ev, raw) => {
    const b = document.getElementById("plan").getBoundingClientRect();
    const x = ((ev.clientX - b.left) / b.width) * 100, y = ((ev.clientY - b.top) / b.height) * 100;
    return raw ? [x, y] : [DK.shapes.clamp(x, 0, 100), DK.shapes.clamp(y, 0, 100)];
  };
  function paintShape(id, pts) {
    const lay = curLayout(), SH = DK.shapes;
    const poly = document.querySelector(`#plan-svg [data-area="${id}"]`);
    if (poly) poly.setAttribute("points", SH.svg(pts, lay.aspect));
    const lbl = document.querySelector(`[data-lbl="${id}"]`);
    if (lbl) { const [cx, cy] = SH.centroid(pts, lay.aspect); lbl.style.left = cx + "%"; lbl.style.top = cy + "%"; const ct = lbl.querySelector(".ct"); if (ct) ct.textContent = sizeText(lay, SH.bbox(pts)); }
    const h = document.getElementById("plan-h");
    if (h) h.innerHTML = handlesHtml(lay, pts);
  }
  app.addEventListener("pointerdown", (ev) => {
    if (ui.page !== "floorplan" || ev.button > 0 || !ui.fp.edit) return;
    const dEl = ev.target.closest("[data-door]");
    if (dEl) {
      const d = (S.doors || []).find((x) => x.id === dEl.dataset.door);
      drag = { door: true, el: dEl, id: d.id, plan: document.getElementById("plan").getBoundingClientRect(), moved: false, cur: { side: d.side, pos: d.pos } };
    } else {
      const SH = DK.shapes, lay = curLayout();
      const hEl = ev.target.closest("[data-h-rot],[data-h-scale],[data-h-add],[data-h-v]");
      const aEl = !hEl && ev.target.closest("[data-area]");
      if (!hEl && !aEl) return;
      const id = hEl ? ui.fp.sel : aEl.dataset.area;
      const l = loc(id);
      if (!l || !l.map) return;
      const pts = DK.areaPts(l);
      if (aEl) {
        if (ui.fp.sel !== id) { ui.fp.vtx = null; ui.fp.sel = id; ui.fp.door = null; render(); }
        drag = { id, mode: "move", start: pts, p0: planPt(ev), moved: false, cur: pts };
      } else if (hEl.dataset.hRot !== undefined) drag = { id, mode: "rotate", start: pts, a0: SH.angle(SH.centroid(pts, lay.aspect), planPt(ev), lay.aspect), moved: false, cur: pts };
      else if (hEl.dataset.hScale) drag = { id, mode: "scale", start: pts, box: SH.bbox(pts), handle: hEl.dataset.hScale, p0: planPt(ev, true), moved: false, cur: pts };
      else if (hEl.dataset.hAdd !== undefined) {
        const i = Number(hEl.dataset.hAdd), next = SH.insert(pts, i);
        ui.fp.vtx = i + 1;
        drag = { id, mode: "vertex", start: next, vi: i + 1, moved: true, cur: next };
        paintShape(id, next);
      } else {
        const i = Number(hEl.dataset.hV), key = id + ":" + i;
        if (lastTap && lastTap.key === key && ev.timeStamp - lastTap.at < 350) { // a double tap removes the corner
          lastTap = null;
          ev.preventDefault();
          if (pts.length > 3) { ui.fp.vtx = null; saveShape(id, SH.remove(pts, i)); } else { ui.error = "A shape needs at least 3 corners."; render(); }
          return;
        }
        lastTap = { key, at: ev.timeStamp };
        ui.fp.vtx = i;
        drag = { id, mode: "vertex", start: pts, vi: i, moved: false, cur: pts };
        document.querySelectorAll(".h-v").forEach((v) => v.classList.toggle("on", v.dataset.hV === String(i)));
      }
    }
    document.getElementById("plan").setPointerCapture(ev.pointerId);
    ev.preventDefault();
  });
  app.addEventListener("pointermove", (ev) => {
    if (!drag) return;
    if (drag.door) {
      const b = drag.plan;
      const px = Math.min(b.width, Math.max(0, ev.clientX - b.left)), py = Math.min(b.height, Math.max(0, ev.clientY - b.top));
      const side = [["top", py], ["bottom", b.height - py], ["left", px], ["right", b.width - px]].sort((x, y) => x[1] - y[1])[0][0];
      const along = side === "top" || side === "bottom" ? (px / b.width) * 100 : (py / b.height) * 100;
      const pos = Math.round(Math.min(97, Math.max(3, along)) * 2) / 2;
      drag.cur = { side, pos }; drag.moved = true;
      const st = drag.el.style;
      st.left = st.right = st.top = st.bottom = "";
      if (side === "top" || side === "bottom") { st.left = pos + "%"; st[side] = "2px"; st.transform = "translateX(-50%)"; }
      else { st.top = pos + "%"; st[side] = "2px"; st.transform = "translateY(-50%)"; }
      return;
    }
    const SH = DK.shapes, lay = curLayout(), [sx, sy] = steps(lay);
    const snX = (v) => Math.round(v / sx) * sx, snY = (v) => Math.round(v / sy) * sy;
    const d = drag;
    let pts;
    if (d.mode === "move") {
      const p = planPt(ev), b = SH.bbox(d.start);
      pts = SH.translate(d.start, snX(b.x + p[0] - d.p0[0]) - b.x, snY(b.y + p[1] - d.p0[1]) - b.y);
    } else if (d.mode === "vertex") {
      const p = planPt(ev);
      pts = d.start.map((q, i) => (i === d.vi ? [snX(p[0]), snY(p[1])] : q));
    } else if (d.mode === "scale") {
      // the handle follows the pointer; sizes snap to ½ ft steps from the edge that stays put
      const p = planPt(ev, true), b = d.box, dx = p[0] - d.p0[0], dy = p[1] - d.p0[1];
      let x1 = b.x, y1 = b.y, x2 = b.x + b.w, y2 = b.y + b.h;
      if (d.handle.includes("w")) x1 = x2 - Math.max(snX(b.w - dx), sx * 2);
      if (d.handle.includes("e")) x2 = x1 + Math.max(snX(b.w + dx), sx * 2);
      if (d.handle.includes("n")) y1 = y2 - Math.max(snY(b.h - dy), sy * 2);
      if (d.handle.includes("s")) y2 = y1 + Math.max(snY(b.h + dy), sy * 2);
      x1 = Math.max(0, x1); y1 = Math.max(0, y1); x2 = Math.min(100, x2); y2 = Math.min(100, y2);
      pts = SH.fit(d.start, { x: x1, y: y1, w: x2 - x1, h: y2 - y1 });
    } else {
      const p = planPt(ev);
      let deg = SH.angle(SH.centroid(d.start, lay.aspect), p, lay.aspect) - d.a0;
      if (!ev.shiftKey) deg = Math.round(deg / 5) * 5;
      pts = SH.rotate(d.start, deg, lay.aspect);
    }
    d.moved = true;
    d.cur = pts;
    paintShape(d.id, pts);
  });
  app.addEventListener("pointerup", (ev) => {
    if (!drag) return;
    const d = drag;
    drag = null;
    const plan = document.getElementById("plan");
    if (plan && plan.hasPointerCapture(ev.pointerId)) plan.releasePointerCapture(ev.pointerId);
    if (d.door) { ui.fp.door = d.id; ui.fp.sel = null; if (d.moved) commit("saveDoor", { id: d.id, ...d.cur }); else render(); return; }
    ui.fp.sel = d.id; ui.fp.door = null;
    if (d.moved) saveShape(d.id, d.cur);
    else render();
  });
  app.addEventListener("click", (ev) => {
    if (ui.page !== "floorplan" || ui.fp.edit) return;
    const dEl = ev.target.closest("[data-door]");
    if (dEl) { ui.fp.door = dEl.dataset.door; ui.fp.sel = null; return render(); }
    const a = ev.target.closest("[data-area]");
    if (a) { ui.fp.sel = a.dataset.area; ui.fp.door = null; render(); }
  });
  app.addEventListener("change", (ev) => {
    if (ev.target.matches && ev.target.matches("[data-move-loc]")) return commit("moveLocationShop", { id: ev.target.dataset.moveLoc, layoutId: ev.target.value }, { msg: "Moved. It's off the old plan and no longer anyone's home there." });
    if (ev.target.matches && ev.target.matches("[data-fp-layout]")) { ui.fp.sel = null; ui.fp.door = null; ui.fp.form = null; go("floorplan", null, { layout: ev.target.value }); }
  });
  app.addEventListener("keydown", (ev) => {
    const a = ev.target.closest && ev.target.closest("[data-area]");

    if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); ui.fp.sel = a.dataset.area; ui.fp.door = null; return render(); }

  });

  // ---------- category rules ----------
  PAGES.categories = () => {

      <div class="grid2" style="grid-template-columns:minmax(0,2fr) minmax(260px,1fr)">

        <div class="section">

            <p class="small" style="margin:0" id="try-out">${hit ? `→ <b>${esc(hit.c)}</b> <span>matched “${esc(hit.k)}”</span>` : `<span class="t-warn">No rule matches. It would be imported as Uncategorized.</span>`}</p></form>
          ${can("buyer") ? `<form class="card section" data-form="addRule"><h3 style="margin:0">Add a rule</h3>${field("Keyword", inp("k", "", 'required placeholder="sweet pea"'), "")}${field("Category", inp("c", "", 'required placeholder="Sweet Peas" list="cats"') + `<datalist id="cats">${Object.keys(groups).map((c) => `<option value="${esc(c)}">`).join("")}</datalist>`, "")}
            ${field("Type", sel("t", [["flower", "Flower / greens"], ["hard_good", "Hard good"], ["", "Either"]], "flower"), "")}<div class="actions"><button class="btn btn-p" ${dis("buyer")}>Add rule</button></div></form>` : roleNote("buyer")}

  ACTS.rmRule = (el) => commit("removeCatRule", { id: el.dataset.v });
  ACTS.sortUnc = () => commit("sortUncategorized", {}, { msg: (n) => (n ? `Sorted ${n} items` : "No uncategorized items matched a rule") });
  app.addEventListener("input", (ev) => {
    if (!ev.target.matches("[data-try]")) return;
    const hit = DK.categorize(S, ev.target.value);
    document.getElementById("try-out").innerHTML = hit ? `→ <b>${esc(hit.c)}</b> <span>matched “${esc(hit.k)}”</span>` : `<span class="t-warn">No rule matches. It would be imported as Uncategorized.</span>`;
  });

  // ---------- stock batch import ----------
  const SAMPLE_STOCK = "sku,Item,Quantity,unit,Cost,location,category,units,shelf_life_days,lot_code\nRO-FRE-60,,2,boxes,104.50,Cooler 1,,,,ANDES-7781\nPE-SAR-BN,Peony Sarah Bernhardt,6,bunch,18,Cooler 2,,bunch=10; box=50,6,\nLI-CAL-WH,Calla Lily White,4,bunch,22,,,bunch=10,9,\nHG-CYL-12,Glass Cylinder 12in,2,case,27,Hard Goods Shelf A,,case=6,,\nXX-MYS-01,Mystery Stem,5,stem,1,,Specialty,,,\nBAD-1,,3,pallet,2,Attic,,,,\n";
  function stockBatchView() {
    const sb = ui.sb;
    const defLoc = sb?.loc || S.locations.find((l) => /receiv|dock/i.test(l.name))?.id || S.locations[0]?.id;

    return `<div class="card section">
        <div class="row"><label class="f"><span>Default location</span>${sel("sbLoc", S.locations.filter((l) => l.active).map((l) => [l.id, l.name]), defLoc, 'class="w-auto" data-sbloc')}</label>
          <label class="f" style="flex:1;min-width:200px"><span>Batch reference</span><input id="sb-ref" value="${esc(sb?.ref || "BATCH-" + today().replace(/-/g, ""))}" maxlength="60"></label></div>

        ${allowed ? "" : roleNote("buyer", "warehouse")}
        <p class="small" style="margin:0">Columns: <span class="code">${DK.STOCK_COLUMNS.join(", ")}</span>. Headings like Quantity, Cost, Item and Expiry work too. New SKUs become new items (Buyer only) and are sorted into categories by the rules. Each row becomes its own lot. The whole batch is saved together, or not at all.</p>

        ${table(["Row", "Item", "Category", ">Qty", ">Cost", "Location", "Problems"], res.map((r) => `<tr class="${r.errors.length ? "bad-row" : ""}"><td class="n">${r.row}</td><td>${esc(r.name || "—")} ${r.isNew ? `<span class="badge b-blue">NEW</span>` : ""}<div class="small code">${esc(r.sku)}</div></td>
          <td>${r.category ? esc(r.category) : `<span class="t-warn">Uncategorized</span>`}${r.source === "rules" ? ` <span class="badge b-green">auto</span>` : ""}</td><td class="n">${qty(r.qty || 0)} ${esc(r.unitName)}</td><td class="n">${Number.isFinite(r.cost) ? money(r.cost) : "—"}</td><td>${esc(loc(r.locId)?.name || "—")}</td><td class="t-bad small">${esc(r.errors.join("; "))}</td></tr>`))}
        <div class="actions"><button type="button" class="btn btn-p" data-act="doStock" ${errs || !res.length ? "disabled" : ""} ${dis("buyer", "warehouse")}>Receive ${res.length} lots into inventory</button>${errs ? `<span class="small t-bad">Fix the errors in your file and choose it again.</span>` : ""}</div>` : ""}`;
  }
  ACTS.sampleStock = () => { loadStock(SAMPLE_STOCK, "sample-stock-batch.csv"); };
  function loadStock(text, fileName) {

    ui.sb = { rows: rows.map((r) => { const o = {}; for (const k in r) o[DK.normHeader(k)] = r[k]; return o; }), fileName, loc: ui.sb?.loc, ref: document.getElementById("sb-ref")?.value };

  };

  // ---------- receiving ----------
  const SHP_OPEN = ["planned", "in_transit", "arrived"];
  const shipment = (id) => S.shipments.find((x) => x.id === id);
  const shpPOs = (sh) => S.pos.filter((p) => p.shipmentId === sh.id && p.status !== "cancelled");
  const shpValue = (sh) => sum(shpPOs(sh), poTotal);
  const isLate = (sh) => ["planned", "in_transit"].includes(sh.status) && sh.eta < today();
  const shortDay = (d) => new Date(d + "T12:00:00").toLocaleDateString("en-US", { month: "short", day: "numeric" });
  const weekStart = (d) => DK.addDays(d, -((new Date(d + "T12:00:00").getDay() + 6) % 7));
  PAGES.receiving = () => {
    const view = ["plan", "list", "new"].includes(ui.q.view) ? ui.q.view : "plan";
    const now = today(), horizon = DK.oneYear(now);
    const late = S.shipments.filter(isLate);
    const virt = DK.virtualDeliveries(S, now);
    const canPlan = can("buyer", "warehouse");
    let body = "";
    if (view === "plan") {
      const weeks = [];
      for (let w = weekStart(now); w <= horizon; w = DK.addDays(w, 7)) weeks.push({ start: w, items: [] });
      const idx = (d) => Math.max(0, Math.min(weeks.length - 1, Math.floor(DK.daysBetween(weeks[0].start, d) / 7)));
      for (const sh of S.shipments) if (sh.status !== "cancelled" && (sh.eta >= weeks[0].start || isLate(sh)) && sh.eta <= horizon) weeks[idx(sh.eta)].items.push({ sh });
      for (const v of virt) weeks[idx(v.date)].items.push({ v });
      const months = {};
      for (const w of weeks) (months[(w.start < now ? now : w.start).slice(0, 7)] ||= []).push(w);
      body = Object.entries(months).map(([m, ws]) => {
        const items = ws.flatMap((w) => w.items);
        const val = sum(items, (it) => (it.sh ? shpValue(it.sh) : it.v.value));
        return `<section class="section"><div class="head" style="align-items:baseline"><h2 style="margin:0;font-size:15px">${new Date(m + "-01T12:00:00").toLocaleDateString("en-US", { month: "long", year: "numeric" })}</h2><span class="small">${items.length} shipment${items.length === 1 ? "" : "s"} · ${money(val)}</span></div>
          <div class="weeks">${ws.map((w) => `<div class="wk"><div class="small wk-l">Week of ${shortDay(w.start)}${w.start === weekStart(now) ? ` <b class="t-good">· now</b>` : ""}</div><div class="row" style="gap:6px">${w.items.length ? w.items.map((it) => {
            if (it.sh) { const sh = it.sh, pos = shpPOs(sh), vend = [...new Set(pos.map((p) => vendor(p.vendorId)?.name))].join(", "); return `<button type="button" class="shp ${isLate(sh) ? "late" : sh.status}" data-go="shipment" data-id="${sh.id}" title="${esc(sh.number)} · ${esc(sh.status.replace("_", " "))}"><b>${shortDay(sh.eta)}</b> <span class="tr">${esc(vend || "No POs yet")}</span>${pos.some((p) => p.standingId) ? " ↻" : ""}${isLate(sh) ? ` <b>late</b>` : ""} <span class="small">${money(shpValue(sh))}</span></button>`; }

          <div><span class="lbl">Purchase orders on this shipment</span>${open.length ? `<div class="po-picks">${open.map((p) => `<label class="check card"><input type="checkbox" name="po_${p.id}"> <b>${esc(p.number)}</b> ${esc(vendor(p.vendorId)?.name)} <span class="small">${fdate(p.expected)}</span> ${badge(p.status)}</label>`).join("")}</div>` : `<p class="small" style="margin:0">No open purchase orders without a shipment. Plan it now and add POs later.</p>`}</div>

  };
  ACTS.shpView = (el) => go("receiving", null, { view: el.dataset.v });
  ACTS.shpTab = (el) => go("receiving", null, { view: "list", status: el.dataset.v });
  FORMS.createShipment = (o) => commit("createShipment", { eta: o.eta, carrier: o.carrier, tracking: o.tracking, notes: o.notes, poIds: Object.keys(o).filter((k) => k.startsWith("po_") && o[k]).map((k) => k.slice(3)) }, { after: (id) => go("shipment", id), msg: "Shipment planned" });

  PAGES.shipment = () => {

      ${canPlan && open && addable.length ? `<form class="row" data-form="shpAddPO"><label class="f"><span>Add a purchase order</span>${sel("poId", [["", "Choose…"], ...addable.map((p) => [p.id, `${p.number} · ${vendor(p.vendorId)?.name} (${p.status.replace("_", " ")})`])], "", 'class="w-auto" required')}</label><button class="btn" ${dis("buyer", "warehouse")}>Add to shipment</button></form>` : ""}

      ${S.standing.length ? table(["Name", "Vendor", "Schedule", ">Per delivery", "Next arrival", ">Planned", "Status"], S.standing.map((so) => {
        const dates = virt.filter((v) => v.standingId === so.id).map((v) => v.date).concat(S.pos.filter((p) => p.standingId === so.id && ["draft", "ordered", "partially_received"].includes(p.status) && p.occurrence >= now).map((p) => p.occurrence)).sort();

        ${field("First arrival", inp("start", DK.addDays(now, 7), `type="date" required min="${now}" max="${DK.oneYear(now)}"`), "c4")}${field("Last arrival (optional)", inp("end", "", 'type="date"'), "c4")}${field("Order lead time (days)", inp("lead", 7, 'type="number" min="0" max="120"'), "c4")}
        ${field("Carrier", inp("carrier", "", 'placeholder="KLM Cargo"'), "c6")}${field("Freight per delivery", inp("freight", 0, 'type="number" min="0" step="0.01"'), "c6")}
        <div class="actions"><button class="btn btn-p" ${dis("buyer")}>Create and add items</button></div></form>`) : roleNote("buyer")}`;
  };
  FORMS.createStanding = (o) => commit("createStanding", o, { after: (id) => go("standingOne", id), msg: "Standing order created. Add the items it brings in." });
  PAGES.standingOne = () => {

    const skipped = so.skips.filter((d) => d >= now && !real.some((r) => r.date === d)).map((d) => ({ date: d, skipped: true }));

      ${section("Items each delivery", `${so.lines.length ? table(["Product", ">Qty", ">Unit cost", ">Extended", ""], so.lines.map((l) => { const p = P(l.productId), u = unitOf(p, l.unitId); return `<tr><td>${esc(p.name)}<div class="small code">${esc(p.sku)}</div></td><td class="n">${qty(l.qty)} ${esc(u.name)}</td><td class="n">${money(l.cost)}</td><td class="n">${money(l.qty * l.cost)}</td><td class="n">${can("buyer") ? `<button type="button" class="btn btn-s btn-d" data-act="rmStandLine" data-v="${l.id}" ${dis("buyer")}>Remove</button>` : ""}</td></tr>`; })) : empty("No items yet. Nothing is planned until you add at least one.")}
        ${picker ? `<form class="card section" data-form="addStandingLine">${picker}<p class="note" style="margin:0">Changes to items apply to planned deliveries you haven't edited.</p><div class="actions"><button class="btn btn-p">Add item</button></div></form>` : ""}`)}

        const po = r.po, sh = po && shipment(po.shipmentId), skip = r.skipped || po?.status === "cancelled";
        return `<tr class="${skip ? "t-faint" : ""}"><td class="nowrap">${fdate(r.date)}</td><td class="nowrap">${skip ? "—" : fdate(DK.addDays(r.date, -so.lead) < now ? now : DK.addDays(r.date, -so.lead))}</td>
          <td>${po ? link("po", po.id, esc(po.number)) + (po.edited ? ` <span class="small t-warn">edited</span>` : "") : `<span class="small">not yet created</span>`}</td><td>${sh ? link("shipment", sh.id, esc(sh.number)) : "—"}</td><td class="n">${r.value ? money(r.value) : "—"}</td>

      }).join("")}</tbody></table></div>` : empty(so.active ? "Add items to plan the next 12 months." : "Nothing planned while paused."))}
      <p class="note" style="margin:0">Edit turns that one delivery into its own purchase order, so you can change its quantities or prices. It's then kept if you pause, end or change the standing order.</p>
      ${section("Schedule", `<form class="card form" data-form="updateStanding"><fieldset class="form" style="border:0;padding:0;margin:0;grid-column:span 12" ${ended ? "disabled" : dis("buyer")}>
        ${field("Name", inp("name", so.name, "required"), "c4")}${field("Repeats", sel("cadence", Object.entries(CADENCE), so.cadence), "c4")}${field("First arrival", inp("start", so.start, 'type="date" required'), "c4")}
        ${field("Last arrival (optional)", inp("end", so.end, 'type="date"'), "c4")}${field("Order lead time (days)", inp("lead", so.lead, 'type="number" min="0" max="120"'), "c4")}${field("Carrier", inp("carrier", so.carrier), "c4")}${field("Freight per delivery", inp("freight", so.freight, 'type="number" min="0" step="0.01"'), "c4")}

  ACTS.rmStandLine = (el) => commit("removeStandingLine", { standingId: ui.id, lineId: el.dataset.v });
  ACTS.standState = (el) => {
    const v = el.dataset.v;

        <div class="row">${sizeFields(s, "pjob")}${s.mode === "regular" ? `<label class="f"><span>Paper</span><select data-pset="pjob" data-k="paper">${Object.entries(PAPERS).map(([k, [l]]) => `<option value="${k}" ${s.paper === k ? "selected" : ""}>${l}</option>`).join("")}</select></label>` : ""}
          <label class="f"><span>Copies each</span><select data-pset="pjob" data-k="copies" aria-label="Copies each">${[1, 2, 3, 4, 5, 6, 8, 10, 12, 20, 25, 50].map((n) => `<option ${n === copies ? "selected" : ""}>${n}</option>`).join("")}</select></label>
          <button type="button" class="btn btn-p" data-act="printNow" ${s.mode === "regular" && !fits ? "disabled" : ""}>Print ${all.length} label${all.length === 1 ? "" : "s"}</button></div>
        <p class="small" style="margin:0" data-testid="print-summary">${s.mode === "label" ? `Label printer: ${all.length} page${all.length === 1 ? "" : "s"} of ${s.w} × ${s.h} in, no margins.` : fits ? `Regular printer: ${perRow * perCol} labels per ${pname} page (${perRow} across × ${perCol} down), cut along the dashed lines. ${pages} page${pages === 1 ? "" : "s"}.` : `A ${s.w} × ${s.h} in label doesn't fit on ${pname} paper. Choose a smaller size.`} Changes here apply to this print only; set defaults in Settings → Printing.</p>
        <p class="note" style="margin:0">${STANDALONE ? "The preview is actual size. Print opens your computer's print dialog with this page size set." : "The preview is actual size. Printing is blocked inside this demo's frame; in the full app the Print button opens the computer's print dialog with this page size set."}</p></div>
      <div class="print-area">${s.mode === "regular" ? `<div style="overflow-x:auto"><div class="paper" style="width:${pw}in;padding:${M}in"><div class="psheet" style="width:${perRow * s.w}in">${all.map((it) => labelBox(it, s.w, s.h, true)).join("")}</div></div></div>`
        : `<div class="psheet loose">${all.map((it) => labelBox(it, s.w, s.h, false)).join("")}</div>`}</div>`;
  }
  function savePrint(s) { store.set("dk-print", JSON.stringify(s)); }
  ACTS.pdef = (el) => { savePrint({ ...readPrint(), [el.dataset.k]: el.dataset.v }); toast("Saved on this computer"); render(); };
  ACTS.pdefReset = () => { savePrint({ ...PDEF }); toast("Print settings reset"); render(); };
  ACTS.pjob = (el) => { ui.pj.s = { ...ui.pj.s, [el.dataset.k]: el.dataset.v }; render(); };
  ACTS.printNow = () => { if (STANDALONE) return window.print(); try { window.print(); } catch {} toast("Printing is blocked inside the demo. In the full app this opens the print dialog."); };
  ACTS.printSelected = () => {
    const ids = [...document.querySelectorAll("[data-pl]:checked")].map((x) => x.dataset.pl);
    if (!ids.length) { ui.error = "Tick at least one product to print labels."; return render(); }
    go("labels", null, { products: ids.join(",") });
  };
  app.addEventListener("change", (ev) => {
    const t = ev.target;
    if (!t.matches("[data-pset]")) return;
    const job = t.dataset.pset === "pjob", k = t.dataset.k;
    if (job && k === "copies") { ui.pj.copies = Number(t.value); return render(); }
    let s = job ? ui.pj.s : readPrint();
    if (k === "size") s = withSize(s, t.value);
    else if (k === "w" || k === "h") s = withSize(s, "custom", k === "w" ? t.value : s.w, k === "h" ? t.value : s.h);
    else s = { ...s, [k]: t.value };
    if (job) ui.pj.s = s; else { savePrint(s); toast("Saved on this computer"); }
    render();
  });

  // ---------- recurring sales orders ----------
  PAGES.recurring = () => {
    const now = today();
    const cid = ui.q.customer || "";
    const c0 = cid ? cust(cid) : null;
    const list = (S.recurring || []).filter((r) => !cid || r.customerId === cid);
    const virt = DK.virtualRecurring(S, now);
    return `${head("Recurring orders", "Repeat customer orders that plan their orders 12 months ahead, priced at the customer's current tier price.", cid ? `<button type="button" class="btn" data-go="recurring">All customers</button>` : "", c0 ? ["customer", c0.name, cid] : ["sales", "Sales orders"])}
      ${list.length ? table(["Name", "Customer", "Schedule", ">Items", "Next ship date", ">Planned", "Status"], list.map((r) => {
        const dates = virt.filter((v) => v.recurringId === r.id).map((v) => v.date).concat(S.sos.filter((so) => so.recurringId === r.id && ["draft", "confirmed"].includes(so.status) && so.occurrence >= now).map((so) => so.occurrence)).sort();
        const ended = !r.active && r.end && r.end <= now;
        return `<tr><td>${link("recurringOne", r.id, `<b>${esc(r.name)}</b>`)}</td><td>${esc(cust(r.customerId)?.name)}</td><td>${CADENCE[r.cadence]}<div class="small">from ${fdate(r.start)}${r.end ? " to " + fdate(r.end) : ""}</div></td><td class="n">${r.lines.length}</td><td>${dates[0] ? fdate(dates[0]) : "—"}</td><td class="n">${dates.length}</td><td>${r.active ? `<span class="badge b-green">Active</span>` : `<span class="badge">${ended ? "Ended" : "Paused"}</span>`}</td></tr>`;
      })) : empty("No recurring orders yet.")}
      ${can("sales") ? section("New recurring order", `<form class="card form" data-form="createRecurring">
        ${field("Customer", sel("customerId", [["", "Choose…"], ...S.customers.filter((x) => x.active && x.name !== "Walk-in").map((x) => [x.id, x.name])], cid, "required"), "c4")}${field("Name", inp("name", "", 'required placeholder="Weekly shop flowers"'), "c4")}${field("Repeats", sel("cadence", Object.entries(CADENCE), "weekly"), "c4")}
        ${field("First ship / pickup date", inp("start", DK.addDays(now, 1), `type="date" required min="${now}"`), "c6")}${field("Last date (optional)", inp("end", "", 'type="date"'), "c6")}
        <div class="actions"><button class="btn btn-p" ${dis("sales")}>Create and add items</button></div></form>`) : roleNote("sales")}`;
  };
  FORMS.createRecurring = (o) => commit("createRecurring", o, { after: (id) => go("recurringOne", id), msg: "Recurring order created. Add the items the customer takes each time." });
  PAGES.recurringOne = () => {
    const r = (S.recurring || []).find((x) => x.id === ui.id);
    if (!r) return empty("That recurring order no longer exists.");
    const now = today();
    const c = cust(r.customerId);
    const ended = !r.active && r.end && r.end <= now;
    const prices = r.lines.map((l) => DK.recurringPrice(S, r, l));
    const per = r.lines.reduce((t, l, i) => t + l.qty * prices[i], 0);
    const virt = DK.virtualRecurring(S, now).filter((v) => v.recurringId === r.id).map((v) => ({ date: v.date, so: null, total: per }));
    const real = S.sos.filter((so) => so.recurringId === r.id && so.occurrence >= DK.addDays(now, -30)).map((so) => ({ date: so.occurrence, so, total: soTotal(so) }));
    const skipped = r.skips.filter((d) => d >= now && !real.some((x) => x.date === d)).map((d) => ({ date: d, skipped: true }));
    const rows = [...virt, ...real, ...skipped].sort((a, b) => a.date.localeCompare(b.date));
    const acts = can("sales") ? (r.active ? `<button type="button" class="btn" data-act="recState" data-v="pause" ${dis("sales")}>Pause</button><button type="button" class="btn btn-d" data-act="recState" data-v="end" ${dis("sales")}>End</button>` : !ended ? `<button type="button" class="btn btn-p" data-act="recState" data-v="resume" ${dis("sales")}>Resume</button>` : "") : "";
    const picker = can("sales") && !ended ? linePicker("addRecurringLine", "price", "Price", "smallest", () => 0) : "";
    return `${head(`${esc(r.name)} ${r.active ? `<span class="badge b-green">Active</span>` : `<span class="badge">${ended ? "Ended" : "Paused"}</span>`}`, `${link("customer", r.customerId, esc(c?.name))} · ${esc(tier(c?.tierId)?.name || "No tier")} · ${CADENCE[r.cadence]} from ${fdate(r.start)}${r.end ? " to " + fdate(r.end) : ""} · about ${money(per)} per order at today's prices`, acts, ["recurring", "Recurring orders"])}
      ${section("Items each order", `${r.lines.length ? table(["Product", ">Qty", ">Price today", ">Extended", ""], r.lines.map((l, i) => { const p = P(l.productId), u = unitOf(p, l.unitId); return `<tr><td>${esc(p.name)}<div class="small code">${esc(p.sku)}</div></td><td class="n">${qty(l.qty)} ${esc(u.name)}</td><td class="n">${money(prices[i])}</td><td class="n">${money(l.qty * prices[i])}</td><td class="n">${can("sales") ? `<button type="button" class="btn btn-s btn-d" data-act="rmRecLine" data-v="${l.id}" ${dis("sales")}>Remove</button>` : ""}</td></tr>`; })) : empty("No items yet. Nothing is planned until you add at least one.")}
        ${picker ? `<form class="card section rec-pick" data-form="addRecurringLine">${picker}<p class="note" style="margin:0">Each order is priced at the customer's current tier price when it's created.</p><div class="actions"><button class="btn btn-p">Add item</button></div></form>` : ""}`)}
      ${section(`Planned orders (${rows.filter((x) => !x.skipped && (!x.so || x.so.status !== "cancelled") && x.date >= now).length} ahead)`, rows.length ? `<div class="tw" style="max-height:520px;overflow:auto"><table><thead><tr><th>Ships</th><th>Order</th><th class="n">Total</th><th>Status</th><th></th></tr></thead><tbody>${rows.map((x) => {
        const so = x.so, skip = x.skipped || so?.status === "cancelled";
        return `<tr class="${skip ? "t-faint" : ""}"><td class="nowrap">${fdate(x.date)}</td><td>${so ? link("so", so.id, esc(so.number)) : `<span class="small">not yet created</span>`}</td><td class="n">${x.total ? money(x.total) : "—"}</td>
          <td>${skip ? `<span class="small">Skipped</span>` : so ? badge(so.status) : `<span class="badge">planned</span>`}</td>
          <td class="n nowrap">${!skip && !so && can("sales") ? `<button type="button" class="btn btn-s" data-act="planRec" data-id="${r.id}" data-v="${x.date}" ${dis("sales")}>Open</button>` : ""}${!skip && (!so || ["draft", "confirmed"].includes(so.status)) && can("sales") ? ` <button type="button" class="btn btn-s" data-act="skipRec" data-id="${r.id}" data-v="${x.date}" ${dis("sales")}>Skip</button>` : ""}</td></tr>`;
      }).join("")}</tbody></table></div>` : empty(r.active ? "Add items to plan the next 12 months." : "Nothing planned while paused."))}
      <p class="note" style="margin:0">Open turns that one delivery into a draft sales order at today's prices, ready to edit and confirm. Opened orders are kept if you pause or end the recurring order.</p>
      ${section("Schedule", `<form class="card form" data-form="updateRecurring"><fieldset class="form" style="border:0;padding:0;margin:0;grid-column:span 12" ${ended ? "disabled" : dis("sales")}>
        ${field("Name", inp("name", r.name, "required"), "c4")}${field("Repeats", sel("cadence", Object.entries(CADENCE), r.cadence), "c4")}${field("First ship / pickup date", inp("start", r.start, 'type="date" required'), "c4")}${field("Last date (optional)", inp("end", r.end, 'type="date"'), "c4")}
        ${can("sales") && !ended ? `<div class="actions"><button class="btn btn-p">Save schedule</button></div>` : ""}</fieldset></form>`)}`;
  };
  FORMS.updateRecurring = (o) => commit("updateRecurring", { ...o, id: ui.id }, { msg: "Saved" });
  FORMS.addRecurringLine = (o) => commit("addRecurringLine", { productId: o.productId, unitId: o.unitId, qty: o.qty, recurringId: ui.id }, { msg: "Item added" });
  ACTS.rmRecLine = (el) => commit("removeRecurringLine", { recurringId: ui.id, lineId: el.dataset.v });
  ACTS.planRec = (el) => commit("planRecurring", { id: el.dataset.id, date: el.dataset.v }, { after: (soId) => go("so", soId), msg: "Draft order created at today's prices" });
  ACTS.skipRec = (el) => ask(`Skip the ${fdate(el.dataset.v)} order?`, "That one order won't be made. The rest of the schedule stays.", "Skip order", () => commit("skipRecurring", { id: el.dataset.id, date: el.dataset.v }, { msg: "Skipped" }));
  ACTS.recState = (el) => {
    const v = el.dataset.v;
    const run = () => commit("setRecurringState", { id: ui.id, action: v }, { msg: (n) => (v === "resume" ? "Resumed. The next 12 months are planned again." : `${v === "pause" ? "Paused" : "Ended"}. ${n} planned order${n === 1 ? "" : "s"} removed; orders you opened are kept.`) });
    if (v === "resume") run();
    else ask(v === "pause" ? "Pause this recurring order?" : "End this recurring order?", "Planned orders that haven't been opened are removed. Opened orders are kept.", v === "pause" ? "Pause" : "End", run);
  };


  // ---------- MUST CHECK ----------
  const mustCheckBox = () => `<div class="mc-box" data-testid="must-check" role="note" aria-label="MUST CHECK, signature required"><div class="mc-title">MUST CHECK</div><div class="mc-space"></div><div class="mc-line"></div><div class="mc-sig">Signature</div></div>`;
  ACTS.mustCheck = () => { const so = S.sos.find((x) => x.id === ui.id); commit("setMustCheck", { id: so.id, on: !so.mustCheck }, { msg: so.mustCheck ? "MUST CHECK removed" : "Marked MUST CHECK" }); };

  // ---------- pull ticket ----------
  PAGES.pullTicket = () => {
    const so = S.sos.find((x) => x.id === ui.id);
    if (!so) return empty("That sales order no longer exists.");
    const t = DK.pullTicket(S, so);
    const showShop = DK.layoutsOf(S).length > 1;
    const c = S.customers.find((x) => x.id === so.customerId);
    const rows = (list, short) => `<table class="pt-table"><colgroup><col style="width:28px"><col><col style="width:130px"><col style="width:170px"></colgroup>
      <thead><tr><th aria-label="Pulled"></th><th>Item</th><th>${short ? "" : "Lot"}</th><th class="n">${short ? "Short by" : "Pull"}</th></tr></thead>
      <tbody>${list.map((r) => `<tr><td><span class="pt-box" aria-hidden="true"></span></td><td><b>${esc(r.name)}</b><div class="pt-sku">${esc(r.sku)}</div></td><td class="pt-lot">${short ? "" : esc(r.lot || "—")}${r.expires ? `<div>exp ${fdate(r.expires)}</div>` : ""}</td><td class="n"><b>${esc(DK.ticketQty(r))}</b></td></tr>`).join("")}</tbody></table>`;
    const printCss = `<style>@media print { .topbar, .side, .toast, .pending, .busy-bar, body::before, .wrap > :not(.print-area) { display: none !important; } .shell { display: block !important; min-height: 0 !important; } .main { padding: 0 !important; min-height: 0 !important; } #app { min-height: 0 !important; } .wrap { display: block !important; max-width: none !important; animation: none !important; transform: none !important; } html, body { background: #fff !important; height: auto !important; margin: 0 !important; padding: 0 !important; } .pt { border: 0 !important; box-shadow: none !important; padding: 0 !important; max-width: none !important; } } @page { size: letter; margin: 0.5in; }</style>`;
    const done = so.status !== "draft" && so.status !== "confirmed";
    return `${printCss}${head(`Pull ticket · ${esc(so.number)}`, "Items grouped by section, A to Z", `<button type="button" class="btn btn-p" data-act="printNow">Print / PDF</button>`, ["so", so.number, so.id])}
      ${done ? `<div class="banner banner-warn">This order is ${esc(so.status)}; the ticket shows where its items are in stock now.</div>` : ""}
      <div class="print-area"><article class="pt" data-testid="pull-ticket">
        <header class="pt-head"><div><div class="pt-kicker">Pull ticket</div><h1>${esc(so.number)}</h1><div>${esc(c?.name || "")}</div></div>
          <dl><dt>Ships</dt><dd>${fdate(so.ship)}</dd><dt>Lines</dt><dd>${so.lines.length}</dd><dt>Printed</dt><dd>${esc(new Date().toLocaleString("en-US", { month: "short", day: "numeric", year: "numeric", hour: "numeric", minute: "2-digit" }))}</dd></dl>${so.mustCheck ? mustCheckBox() : ""}</header>
        ${so.notes ? `<p class="pt-note">Note: ${esc(so.notes)}</p>` : ""}
        ${!so.lines.length ? `<p>This order has no lines yet.</p>` : ""}
        ${t.shops.map((shop) => `<section>${showShop ? `<h2 class="pt-shop">${esc(shop.name)}</h2>` : ""}${shop.sections.map((sec) => `<div class="pt-sec" data-section="${esc(sec.name)}"><h3>${esc(sec.name)}</h3>${rows(sec.rows)}</div>`).join("")}</section>`).join("")}
        ${t.short.length ? `<div class="pt-sec" data-section="Not in stock"><h3 class="pt-short">Not in stock</h3>${rows(t.short, true)}</div>` : ""}
      </article></div>`;
  };


  function afterRender() {
    if (document.querySelector('[data-pick="product"]')) pickerSync("product");
    if (window.JsBarcode) {
      document.querySelectorAll("svg.bc").forEach((svg) => {
        try { window.JsBarcode(svg, svg.dataset.code, { format: "CODE128", displayValue: false, margin: 4, height: 54, width: 1.6, background: "#ffffff", lineColor: "#111111" }); } catch {}
        if (svg.classList.contains("pl-bc")) {
          // let the label's size decide the barcode's size
          const w = svg.getAttribute("width"), h = svg.getAttribute("height");
          if (w && h) { svg.setAttribute("viewBox", `0 0 ${parseFloat(w)} ${parseFloat(h)}`); svg.removeAttribute("width"); svg.removeAttribute("height"); svg.setAttribute("preserveAspectRatio", "none"); }
        }
      });
    }
    if (ui.page === "scan") document.getElementById("scan-code")?.focus({ preventScroll: true });
  }

  // ---------- live updates ----------
  function onRemote() {
    const busyTyping = ui.dirty && document.activeElement && document.activeElement.closest && document.activeElement.closest("form");
    if (busyTyping) {
      if (!ui.pending) {
        ui.pending = true;
        app.insertAdjacentHTML("beforeend", `<button type="button" class="btn btn-p pending" data-act="showPending">Your team made changes · Show</button>`);
      }
      return;
    }
    render();
  }

  // ---------- boot ----------
  async function boot() {
    try { const h = (location.hash || "").slice(1); if (HASHABLE.has(h)) ui.page = h; } catch {}
    render();
    const claude = window.claude;
    const [dbNs, userNs, dl, as] = claude && claude.use ? await Promise.all([claude.use("db"), claude.use("user"), claude.use("downloads"), claude.use("assets")]).catch(() => [null, null, null, null]) : [null, null, null, null];
    downloads = dl;
    assets = as;
    if (!dbNs) {
      mode = "local";
      S = null;
      if (STANDALONE) {
        downloads = localDownloads;
        assets = await localAssets();
        try { const saved = JSON.parse(localStorage.getItem(SAVE_KEY) || "null"); if (saved && saved.v3 && saved.products) S = saved; } catch {}
      }
      if (!S) { S = DK.buildSample(new Date().toISOString()); persistLocal(); }
      ui.notice = null;
      render();
      return;
    }
    db = dbNs;
    stateRef = db.doc("demo/state");
    lockRef = db.doc("demo/lock");
    if (userNs) {
      try { const w = await userNs.can("data.write"); if (w === false) canWrite = false; } catch {}
    }
    stateRef.onSnapshot(
      (snap) => {
        const first = mode === "loading";
        if (!snap.exists) { S = null; mode = "empty"; return render(); }
        const remote = !first && S && snap.data().version !== S.version;
        S = snap.data();
        mode = canWrite ? "live" : "readonly";
        if (first) {
          render();
          // bring older shared data up to date with the new features (once, for everyone)
          if (!S.v3 && canWrite) commit("upgrade", {}, { msg: "Demo updated with photos, receiving, floor plan and payments" });
        } else if (remote && !ui.busy) onRemote();
      },
      () => {
        if (!S) { mode = "local"; S = DK.buildSample(new Date().toISOString()); }
        else mode = "readonly";
        render();
      },
    );
  }
  boot();
})();

</script>

</body>
</html>
