      else out.push(t.slice(0, 30));
    }
    const seen = new Set();
    return out.filter((x) => { const k = x.toLowerCase(); if (seen.has(k)) return false; seen.add(k); return true; }).slice(0, 60);
  };

  /** Where an item sits inside its location: the stock's own spot, else the item's home spot in that location. */
  DK.spotOf = (s, lot) => {
    if (!lot) return null;
    const own = DK.sectionById(s, lot.sectionId);
    if (own && own.locationId === lot.locationId) return { section: own.name, shelf: lot.shelf || "", from: "stock" };
    const p = s.products.find((x) => x.id === lot.productId);
    const loc = s.locations.find((l) => l.id === lot.locationId);
    if (!p || !loc) return null;
    const lay = DK.locLayout(s, loc);
    if (DK.homeOf(s, p, lay) !== loc.id) return null;
    const hs = (p.homeSpots || {})[lay];
    const sec = hs && DK.sectionById(s, hs.sectionId);
    return sec && sec.locationId === loc.id ? { section: sec.name, shelf: hs.shelf || "", from: "home" } : null;
  };
  DK.spotText = (sp) => (sp ? [sp.section, sp.shelf ? `Shelf ${sp.shelf}` : ""].filter(Boolean).join(" · ") : "");

  function checkShelf(sec, shelf) {
    const sh = clean(shelf);
    if (sh && !sec.shelves.some((x) => x.toLowerCase() === sh.toLowerCase())) fail(`${sec.name} has no shelf "${sh}"`);
    return sh ? sec.shelves.find((x) => x.toLowerCase() === sh.toLowerCase()) : "";
  }

  OPS.saveSection = (s, ctx, a) => {
    need(ctx, "warehouse");
    DK.ensureLayouts(s);
    const name = clean(a.name);
    if (!name || name.length > 40) fail("Name the section (up to 40 characters)");
    let locationId = a.locationId;
    if (locationId === "__layout") {
      // the layout itself: a location named after it that covers the whole space (never drawn as an area)
      const lay = DK.layoutOf(s, a.layoutId);
      let whole = s.locations.find((l) => DK.locLayout(s, l) === lay.id && (l.wholeLayout || l.name.toLowerCase() === lay.name.toLowerCase()));
      if (!whole) {
        let name = lay.name;
        if (s.locations.some((l) => l.name.toLowerCase() === name.toLowerCase())) name = `${lay.name} (whole space)`;
        locationId = OPS.createLocation(s, ctx, { name, kind: "other", layoutId: lay.id }) || s.locations[s.locations.length - 1].id;
        whole = s.locations.find((l) => l.id === locationId) || s.locations[s.locations.length - 1];
      }
      whole.wholeLayout = true;
      locationId = whole.id;
    } else if (locationId === "__new") {
      const ln = clean(a.newLocation);
      if (!ln) fail("Name the new location");
      if (s.locations.some((l) => l.name.toLowerCase() === ln.toLowerCase())) fail("A location with that name already exists. Choose it from the list");
      locationId = OPS.createLocation(s, ctx, { name: ln, kind: a.kind || "other", layoutId: a.layoutId }) || s.locations[s.locations.length - 1].id;
    }
    const loc = byId(s.locations, locationId, "Location");
    const shelves = DK.parseShelves(a.shelves);
    if (secs(s).some((x) => x.locationId === loc.id && x.id !== a.id && x.name.toLowerCase() === name.toLowerCase())) fail(`${loc.name} already has a section called ${name}`);
    if (a.id) {
      const sec = byId(secs(s), a.id, "Section");
      const moved = sec.locationId !== loc.id;
      Object.assign(sec, { name, locationId: loc.id, shelves });
      for (const l of s.lots) if (l.sectionId === sec.id) {
        if (moved) { l.sectionId = null; l.shelf = ""; }
        else if (l.shelf && !shelves.some((x) => x.toLowerCase() === l.shelf.toLowerCase())) l.shelf = "";
      }
      for (const p of s.products) for (const k of Object.keys(p.homeSpots || {})) {
        const hs = p.homeSpots[k];
        if (hs.sectionId !== sec.id) continue;
        if (moved) delete p.homeSpots[k];
        else if (hs.shelf && !shelves.some((x) => x.toLowerCase() === hs.shelf.toLowerCase())) hs.shelf = "";
      }
      if (moved && DK.locLayout(s, loc) !== sec.layoutId) { sec.layoutId = DK.locLayout(s, loc); delete sec.map; }
      return sec.id;
    }
    const sec = { id: uid("sec"), name, locationId: loc.id, layoutId: DK.locLayout(s, loc), shelves, active: true };
    secs(s).push(sec);
    return sec.id;
  };
  OPS.removeSection = (s, ctx, a) => {
    need(ctx, "warehouse");
    const sec = byId(secs(s), a.id, "Section");
    s.sections = secs(s).filter((x) => x.id !== sec.id);
    for (const l of s.lots) if (l.sectionId === sec.id) { l.sectionId = null; l.shelf = ""; }
    for (const p of s.products) for (const k of Object.keys(p.homeSpots || {})) if (p.homeSpots[k].sectionId === sec.id) delete p.homeSpots[k];
  };
  OPS.renameLocation = (s, ctx, a) => {
    need(ctx, "warehouse");
    const l = byId(s.locations, a.id, "Location");
    const name = clean(a.name);
    if (!name || name.length > 60) fail("Name the location (up to 60 characters)");
    if (s.locations.some((x) => x.id !== l.id && x.name.toLowerCase() === name.toLowerCase())) fail("Another location already has that name");
    l.name = name;
  };
  /** Where this stock sits inside its location. */
  OPS.setLotSpot = (s, ctx, a) => {
    need(ctx, "warehouse");
    const lot = byId(s.lots, a.lotId, "Lot");
    if (!a.sectionId) { lot.sectionId = null; lot.shelf = ""; return; }
    const sec = byId(secs(s), a.sectionId, "Section");
    if (sec.locationId !== lot.locationId) fail("That section isn't in this lot's location");
    lot.sectionId = sec.id;
    lot.shelf = checkShelf(sec, a.shelf);
  };
  /** The item's usual section and shelf inside its home location. */
  OPS.setHomeSpot = (s, ctx, a) => {
    need(ctx, "buyer", "warehouse");
    const p = byId(s.products, a.productId, "Product");
    const lay = a.layoutId || DK.layoutsOf(s)[0].id;
    p.homeSpots ||= {};
    if (!a.sectionId) { delete p.homeSpots[lay]; return; }
    const home = DK.homeOf(s, p, lay);
    if (!home) fail("Set the home area first");
    const sec = byId(secs(s), a.sectionId, "Section");
    if (sec.locationId !== home) fail("That section isn't in the item's home area");
    p.homeSpots[lay] = { sectionId: sec.id, shelf: checkShelf(sec, a.shelf) };
  };

  // Sections are drawn on the plan like locations: the same shape ops accept either.
  const saveArea0 = OPS.saveArea, removeArea0 = OPS.removeArea;
  const asSectionCall = (s, a, fn) => {
    const sec = secs(s).find((x) => x.id === a.id);
    if (!sec) return null;
    const tmp = { id: sec.id, name: sec.name, map: sec.map, layoutId: sec.layoutId };
    s.locations.push(tmp);
    try { fn(); } finally { s.locations.pop(); }
    if (tmp.map) sec.map = tmp.map; else delete sec.map;
    return true;
  };
  OPS.saveArea = (s, ctx, a) => { if (!asSectionCall(s, a, () => saveArea0(s, ctx, a))) return saveArea0(s, ctx, a); };
  OPS.removeArea = (s, ctx, a) => { if (!asSectionCall(s, a, () => removeArea0(s, ctx, a))) return removeArea0(s, ctx, a); };
  const setFloor0 = OPS.setFloorSize;
  OPS.setFloorSize = (s, ctx, a) => {
    const mine = secs(s).filter((x) => x.layoutId === a.layoutId && x.map);
    const tmp = mine.map((x) => ({ id: x.id, name: x.name, map: x.map, layoutId: x.layoutId }));
    s.locations.push(...tmp);
    try { setFloor0(s, ctx, a); } finally { s.locations.splice(s.locations.length - tmp.length, tmp.length); }
    tmp.forEach((t, i) => (mine[i].map = t.map));
  };
  // A location moved to another shop takes its sections along, off the plan; stock leaving a location loses its spot.
  const moveShop0 = OPS.moveLocationShop;
  OPS.moveLocationShop = (s, ctx, a) => { moveShop0(s, ctx, a); for (const x of secs(s)) if (x.locationId === a.id) { x.layoutId = a.layoutId; delete x.map; } };
  const transfer0 = OPS.transfer;
  OPS.transfer = (s, ctx, a) => {
    const lot = byId(s.lots, a.lotId, "Lot");
    const from = lot.locationId, keep = { sectionId: lot.sectionId, shelf: lot.shelf };
    const destId = transfer0(s, ctx, a);
    const dest = s.lots.find((l) => l.id === destId);
    if (dest && dest.locationId !== from) {
      dest.sectionId = null; dest.shelf = "";
      if (a.toSectionId) OPS.setLotSpot(s, ctx, { lotId: dest.id, sectionId: a.toSectionId, shelf: a.toShelf });
    }
    if (lot !== dest && lot.locationId === from) Object.assign(lot, keep);
    return destId;
  };
  const setHome0 = OPS.setHome;
  OPS.setHome = (s, ctx, a) => {
    const p = s.products.find((x) => x.id === a.productId);
    const lay = a.layoutId || DK.layoutsOf(s)[0].id;
    const before = p ? DK.homeOf(s, p, lay) : null;
    setHome0(s, ctx, a);
    if (p && p.homeSpots && DK.homeOf(s, p, lay) !== before) delete p.homeSpots[lay];
  };

  /** Sample sections: two racks in each cooler with shelves, and spots for some stock. */
  DK.sampleSections = (s) => {
    if (s.sections) return;
    s.sections = [];
    const add = (locName, name, shelves) => {
      const loc = s.locations.find((l) => l.name === locName);
      if (!loc) return null;
      const sec = { id: uid("sec"), name, locationId: loc.id, layoutId: DK.locLayout(s, loc), shelves, active: true };
      const a = loc.map && DK.areaPts(loc) ? DK.shapes.bbox(DK.areaPts(loc)) : null;
      if (a) {
        const i = s.sections.filter((x) => x.locationId === loc.id).length;
        const w = a.w / 2 - 1.5, h = a.h - 6;
        if (w > 2 && h > 2) { const x = a.x + 1 + i * (a.w / 2), y = a.y + 3; sec.map = { x, y, w, h, pts: DK.shapes.rect(x, y, w, h), c: loc.map.c }; }
      }
      s.sections.push(sec);
      return sec;
    };
    const made = [add("Cooler 1", "Rack A", ["1", "2", "3", "4"]), add("Cooler 1", "Rack B", ["1", "2", "3", "4"]), add("Cooler 2", "Bucket row", ["Floor", "Top"]), add("Cooler 2", "Rack C", ["1", "2", "3"])].filter(Boolean);
    let i = 0;
    for (const lot of s.lots) {
      const mine = made.filter((x) => x.locationId === lot.locationId);
      if (!mine.length || lot.qty <= 0) continue;
      const sec = mine[i % mine.length];
      if (i % 4 !== 3) { lot.sectionId = sec.id; lot.shelf = sec.shelves[i % sec.shelves.length]; }
      i++;
    }
  };
  DK.hooks.afterSample.push((s) => DK.sampleSections(s));

  // ---------- Knowledge base articles written in the app (mirrors the kb_articles table) ----------
  // builtinId null: a new article (any staff member adds; author or admin edits/removes).
  // builtinId set: admin's change to a built-in article (new wording, or hidden); removing it restores the original.
  const kb = (s) => (s.kb ||= []);
  const paras = (t) => String(t ?? "").split(/\n\s*\n/).map((p) => p.replace(/\s*\n\s*/g, " ").trim()).filter(Boolean).slice(0, 60);
  const staff = (ctx) => { if (ctx.role === "customer") fail("Not allowed"); };
  OPS.kbSave = (s, ctx, a) => {
    staff(ctx);
    const title = clean(a.title).replace(/\s+/g, " "), category = clean(a.category).replace(/\s+/g, " "), body = paras(a.text);
    if (!title || title.length > 150) fail("Give the article a title (up to 150 characters)");
    if (!category || category.length > 40) fail("Choose or type a category (up to 40 characters)");
    if (!body.length) fail("Write the article text");
    if (body.some((p) => p.length > 2000)) fail("Each paragraph can be up to 2,000 characters. Split long ones with a blank line");
    const at = ctx.now || new Date().toISOString();
    if (a.builtinId) {
      if (ctx.role !== "admin") fail("Only admin can change built-in articles");
      let r = kb(s).find((x) => x.builtinId === a.builtinId);
      if (!r) kb(s).push((r = { id: uid("kb"), builtinId: a.builtinId, hidden: false, author: ctx.role }));
      Object.assign(r, { title, category, body, updatedAt: at, updatedBy: ctx.role });
      return a.builtinId;
    }
    if (a.id) {
      const r = byId(kb(s), a.id, "Article");
      if (ctx.role !== "admin" && r.author !== ctx.role) fail("You can only edit articles you wrote");
      Object.assign(r, { title, category, body, updatedAt: at, updatedBy: ctx.role });
      return "u-" + r.id;
    }
    const r = { id: uid("kb"), builtinId: null, title, category, body, hidden: false, author: ctx.role, createdAt: at, updatedAt: at, updatedBy: ctx.role };
    kb(s).push(r);
    return "u-" + r.id;
  };
  OPS.kbDelete = (s, ctx, a) => {
    staff(ctx);
    const r = byId(kb(s), a.id, "Article");
    if (r.builtinId) fail("Built-in articles can't be removed; hide them instead");
    if (ctx.role !== "admin" && r.author !== ctx.role) fail("You can only remove articles you wrote");
    s.kb = kb(s).filter((x) => x !== r);
  };
  OPS.kbHide = (s, ctx, a) => {
    if (ctx.role !== "admin") fail("Only admin can hide articles");
    let r = a.id ? byId(kb(s), a.id, "Article") : kb(s).find((x) => x.builtinId === a.builtinId);
    if (!r && a.builtinId) kb(s).push((r = { id: uid("kb"), builtinId: a.builtinId, title: a.title || "", category: a.category || "", body: [], hidden: false, author: ctx.role, updatedAt: ctx.now }));
    r.hidden = !!a.hidden;
  };
  OPS.kbRestore = (s, ctx, a) => {
    if (ctx.role !== "admin") fail("Only admin can restore built-in articles");
    s.kb = kb(s).filter((x) => x.builtinId !== a.builtinId);
  };

  // ---------- Carts saved on the account (customer), and a rep's cart per customer (mirrors portal_cart_items / rep_cart_items) ----------
  const carts = (s) => (s.carts ||= {});
  function cartKey(s, ctx, a) {
    if (ctx.role === "customer") {
      const cid = DK.demoCustomerId(s, ctx.loginId);
      if (!cid) fail("This login is not set up for shopping yet");
      return { key: "c:" + ctx.loginId, customerId: cid, rep: false };
    }
    if (!["admin", "sales"].includes(ctx.role)) fail("Only sales or an admin can shop for a customer");
    const cu = s.customers.find((x) => x.id === a.customerId && x.active);
    if (!cu) fail("Pick a customer");
    return { key: `r:${ctx.role}:${cu.id}`, customerId: cu.id, rep: true };
  }
  DK.cartOf = (s, key) => carts(s)[key] || { items: [], payment: null, notes: "" };
  OPS.cartSet = (s, ctx, a) => {
    const k = cartKey(s, ctx, a);
    const p = s.products.find((x) => x.active !== false && x.units.some((u) => u.id === a.unitId));
    if (!p) fail("That item is no longer sold");
    const u = p.units.find((x) => x.id === a.unitId);
    if (!k.rep && !(DK.suggestedPrice(s, k.customerId, p, u) > 0)) fail("That item is not sold to you any more");
    const c = (carts(s)[k.key] ||= { items: [], payment: null, notes: "" });
    const have = c.items.find((x) => x.unitId === a.unitId);
    const qty = Math.max(0, Math.floor(Number(a.qty) || 0));
    if (!qty) { c.items = c.items.filter((x) => x !== have); return { qty: 0 }; }
    if (qty > 100000) fail("Quantities are whole numbers");
    const saved = a.saved === undefined || a.saved === null ? !!(have && have.saved) : !!a.saved;
    const left = DK.availableUnits(s, p, u);
    if (!saved && qty > left) fail(`Only ${Math.max(0, left)} ${u.name} of ${p.name} left`);
    if (have) Object.assign(have, { qty, saved }); else c.items.push({ unitId: a.unitId, qty, saved, addedAt: ctx.now || new Date().toISOString() });
    return { qty, available: left };
  };
  OPS.cartDetails = (s, ctx, a) => {
    const k = cartKey(s, ctx, a);
    if (a.payment && !["cash", "card", "check"].includes(a.payment)) fail("Payment must be cash, card or check");
    const c = (carts(s)[k.key] ||= { items: [], payment: null, notes: "" });
    c.payment = a.payment || null;
    c.notes = String(a.notes || "").trim().slice(0, 500);
  };
  /** What the customer has in their own online cart (all their logins), for a rep. */
  DK.onlineCart = (s, customerId) => {
    const sum = {};
    for (const l of DK.portal(s).logins) if (l.customerId === customerId) for (const it of DK.cartOf(s, "c:" + l.id).items) if (!it.saved) sum[it.unitId] = (sum[it.unitId] || 0) + it.qty;
    return Object.entries(sum).map(([unitId, qty]) => ({ unitId, qty }));
  };
  OPS.cartPullOnline = (s, ctx, a) => {
    const k = cartKey(s, ctx, a);
    if (!k.rep) fail("Only sales or an admin can shop for a customer");
    const c = (carts(s)[k.key] ||= { items: [], payment: null, notes: "" });
    for (const o of DK.onlineCart(s, k.customerId)) {
      const have = c.items.find((x) => x.unitId === o.unitId);
      if (have) Object.assign(have, { qty: Math.max(have.qty, o.qty), saved: false }); else c.items.push({ unitId: o.unitId, qty: o.qty, saved: false, addedAt: ctx.now });
    }
  };
  /** Place the order from the saved cart. A customer's waits for approval; a rep's is approved right away (Ready to pull). */
  OPS.cartPlace = (s, ctx, a) => {
    const k = cartKey(s, ctx, a);
    const c = DK.cartOf(s, k.key);
    const lines = c.items.filter((x) => !x.saved).map((x) => ({ unitId: x.unitId, qty: x.qty }));
    if (!lines.length) fail("The cart is empty");
    for (const l of lines) {
      const p = s.products.find((x) => x.units.some((u) => u.id === l.unitId));
      const u = p && p.units.find((x) => x.id === l.unitId);
      if (p && l.qty > DK.availableUnits(s, p, u)) fail(`Only ${Math.max(0, DK.availableUnits(s, p, u))} ${u.name} of ${p.name} left`);
    }
    const id = OPS.cartOrder(s, ctx, { customerId: k.customerId, lines, notes: c.notes, payment: c.payment });
    const so = s.sos.find((x) => x.id === id);
    if (k.rep) so.status = "confirmed";
    carts(s)[k.key] = { items: c.items.filter((x) => x.saved), payment: c.payment, notes: "" };
    return so.number;
  };
})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>
/* DKaydent Wholesale demo — UI. Shared data lives in the artifact's db at demo/state. */
(function () {
  "use strict";
  const DK = window.DK;
  const app = document.getElementById("app");
  const TAB = "tab-" + Math.random().toString(36).slice(2, 10);
  // Public (GitHub Pages) build: no shared storage; each visitor's copy is kept in their own browser.
  const STANDALONE = !!window.DK_STANDALONE;
  const SAVE_KEY = "dk-demo-state";

  // ---------- state ----------
  let S = null; // shared dataset
  let mode = "loading"; // loading | live | local | empty | readonly
  let db = null, stateRef = null, lockRef = null, downloads = null;
  let canWrite = true;
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };
  const ui = {
    page: "dashboard", id: null, q: {}, role: store.get("dk-role", "admin"), custLogin: store.get("dk-cust-login", ""),
    error: null, notice: null, toast: null, confirm: null, busy: false,
    dirty: false, pending: false, picks: null, pickMsg: null, imp: null, scanMsg: null,
  };
  if (!DK.ROLES[ui.role]) ui.role = "admin";

  // ---------- appearance (per viewer) ----------
  // Light / Dark set data-app-theme, which overrides the viewer's theme; System clears it.
  const PALETTES = [
    ["fern", "Fern", "White and green", ["#f6f8f5", "#ffffff", "#18211a", "#255e38"], ["#101612", "#7dc191"]],
    ["peony", "Peony & eucalyptus", "Misty green with peony pink", ["#eef2ec", "#fbfcfa", "#1f3a2b", "#9e3b5e"], ["#121915", "#e88fb0"]],
    ["ranunculus", "Ranunculus & linen", "Warm linen with buttercup gold", ["#f3efe8", "#fffdf9", "#2b1e26", "#8a6214"], ["#181216", "#e8bc5c"]],
    ["hydrangea", "Hydrangea & stone", "Cool stone with periwinkle", ["#edf0f4", "#fafbfd", "#1e2a3b", "#4950a3"], ["#111623", "#9ea5ea"]],
  ];
  // More palettes and the person's own custom theme come from the same generator as the full app.
  const TG = window.ThemeGen;
  for (const g of TG.GENERATED) { const sw = TG.swatches(TG.buildTheme(g)); PALETTES.push([g.id, g.name, g.help, sw.light, sw.dark]); }
  const FONT_OF = { figtree: "'Figtree'", newsreader: "'Newsreader'", gloock: "'Gloock'", "nunito-sans": "'Nunito Sans'", outfit: "'Outfit'", "instrument-serif": "'Instrument Serif'" };
  function palCss(id, t, g) {
    const m = (v, d) => `--bg: ${v["--color-stone-50"]}; --surface: ${v["--color-white"]}; --surface-2: ${v["--color-stone-100"]}; --line: ${v["--color-stone-200"]}; --line-soft: ${v["--color-stone-100"]}; --fg: ${v["--color-stone-900"]}; --muted: ${v["--color-stone-500"]}; --faint: ${v["--color-stone-400"]}; --brand: ${v["--color-brand-700"]}; --brand-hover: ${v["--color-brand-600"]}; --brand-soft: ${v["--color-brand-50"]}; --brand-ink: ${v["--color-brand-800"]}; --shadow: 0 1px 2px color-mix(in srgb, ${v["--color-stone-900"]} 5%, transparent), 0 10px 30px -18px color-mix(in srgb, ${v["--color-stone-900"]} ${d ? 60 : 28}%, transparent); color-scheme: ${d ? "dark" : "light"};`;
    const sel = `:root[data-pal="${id}"]`;
    const f = g ? `${sel} { --font: ${FONT_OF[g.sans]}, ui-sans-serif, system-ui, sans-serif; --display: ${FONT_OF[g.display]}, Georgia, serif; --dw: ${g.weight}; }` : `${sel} { --font: 'Figtree', ui-sans-serif, system-ui, sans-serif; --display: 'Newsreader', Georgia, serif; --dw: 500; }`;

        ? `<div class="banner banner-demo"><span><b>This is a demo with made-up sample data.</b> Try anything: your changes are saved in this browser only and nobody else sees them. Use <b>Viewing as</b> at the top to see what each role can do.</span>

        : `<div class="banner banner-demo"><span><b>This is a shared demo.</b> Everyone with the link works on the same sample data and sees changes live. Use <b>Viewing as</b> at the top to see what each role can do.</span>

      <div class="stats">

      <div class="grid2">
        ${section("Expiring soon", expiring.length ? table(["Lot", "Product", ">On hand", "Expires"], expiring.slice(0, 8).map(({ l, d }) => {

          `<tr><td>${link("product", p.id, esc(p.name))}<div class="small code">${esc(p.sku)}</div></td><td class="n t-warn">${qty(st[p.id]?.qty || 0)} ${esc(p.baseUnit)}</td><td class="n">${qty(p.reorder)}</td></tr>`)) : empty("Everything is above its reorder point."))}
      </div>
      ${(() => {
        const inb = (S.shipments || []).filter((sh) => ["planned", "in_transit", "arrived"].includes(sh.status) && sh.eta <= DK.addDays(today(), 7)).sort((a, b) => a.eta.localeCompare(b.eta));

        return section(`Incoming shipments, next 7 days${lateN ? ` · <span class="t-bad">${lateN} late</span>` : ""}`, table(["Shipment", "ETA", "Vendors", ">Value", "Status"], inb.map((sh) => {
          const pos = S.pos.filter((p) => p.shipmentId === sh.id && p.status !== "cancelled"), late = ["planned", "in_transit"].includes(sh.status) && sh.eta < today();
          return `<tr><td>${link("shipment", sh.id, esc(sh.number), "nowrap")}${sh.carrier ? `<div class="small">${esc(sh.carrier)}</div>` : ""}</td><td class="${late ? "t-bad" : ""}">${fdate(sh.eta)}${late ? " · late" : ""}</td><td>${esc([...new Set(pos.map((p) => vendor(p.vendorId)?.name))].join(", ") || "—")}</td><td class="n">${money(sum(pos, poTotal))}</td><td>${badge(sh.status)}</td></tr>`;
        })), `<button type="button" class="btn btn-s" data-go="receiving">Receiving</button>`);
      })()}
      <div class="grid2">
        ${section("Arriving", dueIn.length ? table(["PO", "Vendor", "Expected", ">Landed total"], dueIn.map((po) =>

        ${section("Ready to pick", toFill.length ? table(["Order", "Customer", "Ships", ">Total"], toFill.map((so) =>
          `<tr><td>${link("so", so.id, esc(so.number), "nowrap")}</td><td>${esc(cust(so.customerId)?.name)}</td><td>${fdate(so.ship)}</td><td class="n">${money(soTotal(so))}</td></tr>`)) : empty("No confirmed orders waiting."))}
      </div>`;

  // ----- products -----
  PAGES.products = () => {
    const st = DK.stockByProduct(S);
    const q = (ui.q.q || "").toLowerCase();
    const list = S.products
      .filter((p) => (ui.q.inactive ? true : p.active) && (!ui.q.kind || p.kind === ui.q.kind) && (!q || `${p.sku} ${p.name} ${p.category || ""}`.toLowerCase().includes(q)))
      .sort((a, b) => a.name.localeCompare(b.name));

        <button type="button" class="btn" data-go="categories">Category rules</button>
        ${can("buyer") ? `<button type="button" class="btn" data-go="import" data-q='{"entity":"products"}'>Import</button><button type="button" class="btn btn-p" data-go="productNew">New product</button>` : ""}`)}
      <form class="row" data-filter>

      ${list.length ? `<div class="row"><button type="button" class="btn" data-act="printSelected">Print labels for selected</button><span class="small">Tick any products, then print. Uses your print settings.</span><span style="margin-left:auto">${viewToggle("products")}</span></div>` : ""}
      ${list.length && listView("products") === "cards" ? `<ul class="pcards" data-testid="product-cards">${list.map((p) => {

      }).join("")}</ul>`
      : list.length ? table(["", "SKU", "Name", "Category", ">On hand", ">Avg landed cost", ">Value"], list.map((p) => {

          <td class="n ${low ? "t-warn" : ""}">${qty(s?.qty || 0)} ${esc(p.baseUnit)}</td><td class="n">${s?.avgCost ? money4(s.avgCost) + "/" + esc(p.baseUnit) : "—"}</td><td class="n">${money(s?.value || 0)}</td></tr>`;
      })) : empty("No products match.")}`;

  const productFields = (p, isNew) => `

    ${field("Grade", inp("grade", p?.grade), "c2")}${field("Stem cm", inp("stem", p?.stem, 'type="number" min="0"'), "c2")}
    ${isNew ? `${field("Base unit (smallest counted)", inp("baseUnit", "stem", 'required list="bu"') + `<datalist id="bu"><option value="stem"><option value="each"><option value="roll"></datalist>`, "c4")}
      ${field("Pack unit (optional)", inp("packName", "", 'placeholder="bunch, box, case"'), "c4")}
      ${field("Base units per pack", inp("packFactor", "", 'type="number" min="0" step="any" placeholder="25"'), "c4")}`

    ${field("Shelf life (days)", inp("shelfLife", p?.shelfLife, 'type="number" min="0" placeholder="Sets default expiry"'), "c4")}
    ${field("Reorder point (base units)", inp("reorder", p?.reorder, 'type="number" min="0" step="any"'), "c4")}
    ${field("Notes", `<textarea name="notes" id="f-notes" rows="2">${esc(p?.notes || "")}</textarea>`, "")}
    ${isNew ? "" : `<label class="check"><input type="checkbox" name="active" ${p.active ? "checked" : ""}> Active (shown when ordering)</label>`}`;

  PAGES.productNew = () => `${head("New product", "", "", ["products", "Products"])}
    <form class="card form" data-form="createProduct"><fieldset class="form" style="border:0;padding:0;margin:0;grid-column:span 12" ${dis("buyer")}>${productFields(null, true)}
      <p class="note">Stock is always counted in the base unit. Add more pack units after creating.</p>
      <div class="actions"><button class="btn btn-p">Create product</button></div></fieldset>${roleNote("buyer")}</form>`;

  PAGES.product = () => {
    const p = P(ui.id);
    if (!p) return empty("That product no longer exists.");
    const st = DK.stockByProduct(S)[p.id];
    const byLoc = {};
    for (const l of onHandLots().filter((l) => l.productId === p.id)) {
      const x = (byLoc[l.locationId] ||= { qty: 0, value: 0 });
      x.qty += l.qty;
      x.value += l.qty * l.cost;
    }
    const tps = S.tierPrices.filter((t) => p.units.some((u) => u.id === t.unitId));
    return `${head(esc(p.name), `<span class="code">${esc(p.sku)}</span> · ${p.kind === "flower" ? "Flower" : "Hard good"}${p.category ? " · " + esc(p.category) : ""}`,
        `<button type="button" class="btn" data-go="labels" data-q='${esc(JSON.stringify({ products: p.id }))}'>Print label</button>`, ["products", "Products"])}
      <div class="stats">
        ${stat("On hand", `${qty(st?.qty || 0)} ${esc(p.baseUnit)}`, inUnits(st?.qty || 0, p))}
        ${stat("Inventory value", money(st?.value || 0))}
        ${stat("Avg landed cost", st?.avgCost ? money4(st.avgCost) : "—", `per ${esc(p.baseUnit)}`)}
        ${stat("Reorder point", `${qty(p.reorder)}`, esc(p.baseUnit), null, p.reorder > 0 && (st?.qty || 0) <= p.reorder ? "warn" : "")}
      </div>
      <div class="grid2">
        ${section("Photo", photoControl("product", p.id, p.img, p.name, ["buyer", "warehouse"]))}
        ${locationInShop(p, Object.keys(byLoc))}
      </div>
      <div class="grid2">
        ${section("Units", `${table(["Unit", ">Contains", ""], p.units.slice().sort((a, b) => a.factor - b.factor).map((u) =>
          `<tr><td><b>${esc(u.name)}</b></td><td class="n">${qty(u.factor)} ${esc(p.baseUnit)}</td><td class="n">${u.name !== p.baseUnit && can("buyer") ? `<button type="button" class="btn btn-s btn-d" data-act="removeUnit" data-v="${u.id}" ${dis("buyer")}>Remove</button>` : ""}</td></tr>`))}
          ${can("buyer") ? `<form class="row" data-form="addUnit"><label class="f"><span>New unit</span>${inp("name", "", 'placeholder="box" required class="w-32"')}</label><label class="f"><span>${esc(p.baseUnit)} per unit</span>${inp("factor", "", 'type="number" min="0" step="any" required class="w-32"')}</label><button class="btn" ${dis("buyer")}>Add unit</button></form>` : ""}`)}
        ${section("Stock by location", Object.keys(byLoc).length ? table(["Location", ">Qty", ">Value"], Object.entries(byLoc).map(([lid, x]) =>
          `<tr><td>${esc(loc(lid)?.name)}</td><td class="n">${inUnits(x.qty, p)}</td><td class="n">${money(x.value)}</td></tr>`)) : empty("No stock on hand."),
          `<button type="button" class="btn btn-s" data-go="inventory" data-q='${esc(JSON.stringify({ view: "lots", product: p.id }))}'>View lots</button>`)}
      </div>
      ${section("Tier pricing", `<p class="note" style="margin:0">Exact prices per customer tier. Without one, sales orders suggest average landed cost plus the tier's markup.</p>
        ${tps.length ? table(["Tier", "Unit", ">Price", ">Margin at avg cost", ""], tps.map((t) => {
          const u = unitOf(p, t.unitId);
          const cost = st?.avgCost ? st.avgCost * u.factor : null;
          return `<tr><td>${esc(tier(t.tierId)?.name)}</td><td>${esc(u.name)}</td><td class="n">${money(t.price)}</td><td class="n">${cost && t.price > 0 ? pct((t.price - cost) / t.price) : "—"}</td><td class="n">${can("sales") ? `<button type="button" class="btn btn-s btn-d" data-act="removeTierPrice" data-v="${t.id}" ${dis("sales")}>Remove</button>` : ""}</td></tr>`;
        })) : ""}
        ${can("sales") ? `<form class="row" data-form="setTierPrice">
          <label class="f"><span>Tier</span>${sel("tierId", S.tiers.map((t) => [t.id, t.name]), "", 'class="w-auto"')}</label>
          <label class="f"><span>Unit</span>${sel("unitId", p.units.map((u) => [u.id, u.name]), "", 'class="w-auto"')}</label>
          <label class="f"><span>Price</span>${inp("price", "", 'type="number" min="0" step="0.01" required class="w-32"')}</label>
          <button class="btn" ${dis("sales")}>Set price</button></form>` : ""}`)}
      ${section("Details", `<form class="card form" data-form="updateProduct"><fieldset class="form" style="border:0;padding:0;margin:0;grid-column:span 12" ${dis("buyer")}>${productFields(p, false)}
        ${can("buyer") ? `<div class="actions"><button class="btn btn-p">Save changes</button></div>` : ""}</fieldset>${roleNote("buyer")}</form>`)}`;

  function inUnits(qtyBase, p) {
    const big = p.units.filter((u) => u.factor > 1).sort((a, b) => b.factor - a.factor).find((u) => qtyBase >= u.factor);
    if (!big) return `${qty(qtyBase)} ${esc(p.baseUnit)}`;
    const whole = Math.floor(qtyBase / big.factor);
    const rest = qtyBase - whole * big.factor;
    return `${whole} ${esc(big.name)}${rest > 1e-9 ? ` + ${qty(rest)} ${esc(p.baseUnit)}` : ""}`;
  }

  // ----- vendors / customers / tiers / locations -----
  const vendorFields = (v) => `
    ${field("Name", inp("name", v?.name, "required"), "c8")}
    ${field("Type", sel("kind", [["grower", "Grower / farm"], ["distributor", "Distributor"], ["supplier", "Hard goods supplier"]], v?.kind || "grower"), "c4")}
    ${field("Contact", inp("contact", v?.contact), "c4")}${field("Email", inp("email", v?.email, 'type="email"'), "c4")}${field("Phone", inp("phone", v?.phone), "c4")}
    ${field("Country", inp("country", v?.country), "c6")}${field("Payment terms", inp("terms", v?.terms, 'placeholder="Net 15, prepay…"'), "c6")}
    ${field("Notes", `<textarea name="notes" rows="2">${esc(v?.notes || "")}</textarea>`, "")}`;
  PAGES.vendors = () => {
    const q = (ui.q.q || "").toLowerCase();

    return `${head("Vendors", "Growers, distributors and hard goods suppliers", `<button type="button" class="btn" data-act="export" data-v="vendors">Export CSV</button>${can("buyer") ? `<button type="button" class="btn" data-go="import" data-q='{"entity":"vendors"}'>Import</button>` : ""}`)}
      <form class="row" data-filter><input name="q" value="${esc(ui.q.q || "")}" placeholder="Search vendors" style="max-width:320px"><button class="btn">Search</button></form>
      ${table(["Name", "Type", "Contact", "Country", "Terms"], list.map((v) => `<tr><td>${link("vendor", v.id, esc(v.name))} ${v.active ? "" : badge("inactive")}</td><td style="text-transform:capitalize">${esc(v.kind)}</td><td>${esc(v.contact || "—")}${v.email ? `<div class="small">${esc(v.email)}</div>` : ""}</td><td>${esc(v.country || "—")}</td><td>${esc(v.terms || "—")}</td></tr>`))}
      ${can("buyer") ? section("Add vendor", `<form class="card form" data-form="saveVendor">${vendorFields(null)}<div class="actions"><button class="btn btn-p" ${dis("buyer")}>Add vendor</button></div></form>`) : ""}`;
  };
  PAGES.vendor = () => {
    const v = vendor(ui.id);
    if (!v) return empty("That vendor no longer exists.");
    const pos = S.pos.filter((p) => p.vendorId === v.id).reverse();
    return `${head(esc(v.name), `<span style="text-transform:capitalize">${esc(v.kind)}</span>${v.country ? " · " + esc(v.country) : ""}`, can("buyer") ? `<button type="button" class="btn" data-go="standing" data-q='${esc(JSON.stringify({ vendor: v.id }))}'>Recurring order</button><button type="button" class="btn btn-p" data-act="newPOFor" data-v="${v.id}" ${dis("buyer")}>New PO for this vendor</button>` : "", ["vendors", "Vendors"])}
      ${section("Purchase orders", pos.length ? table(["PO", "Status", "Ordered", "Expected", ">Landed total"], pos.map((po) => `<tr><td>${link("po", po.id, esc(po.number), "nowrap")}</td><td>${badge(po.status)}</td><td>${fdate(po.orderDate)}</td><td>${fdate(po.expected)}</td><td class="n">${money(poTotal(po))}</td></tr>`)) : empty("No purchase orders yet."))}
      ${section("Details", `<form class="card form" data-form="saveVendor"><input type="hidden" name="id" value="${v.id}"><fieldset class="form" style="border:0;padding:0;margin:0;grid-column:span 12" ${dis("buyer")}>${vendorFields(v)}<label class="check"><input type="checkbox" name="active" ${v.active ? "checked" : ""}> Active</label>${can("buyer") ? `<div class="actions"><button class="btn btn-p">Save changes</button></div>` : ""}</fieldset>${roleNote("buyer")}</form>`)}`;
  };
  const customerFields = (c) => `
    ${field("Business name", inp("name", c?.name, "required"), "c8")}
    ${field("Price tier", sel("tierId", [["", "None"], ...S.tiers.map((t) => [t.id, t.name])], c?.tierId), "c4")}
    ${field("Route (1–3 letters)", inp("routeCode", c?.routeCode, 'maxlength="3" pattern="[A-Za-z]{1,3}" placeholder="NOR" style="text-transform:uppercase"'), "c4")}${field("Sales rep", sel("repId", [["", "None"], ["sales", DK.PEOPLE.sales], ["admin", DK.PEOPLE.admin]], c?.repId), "c4")}${field("Usual payment", sel("defaultPayment", [["", "Ask on each order"], ["cash", "Cash"], ["card", "Card"], ["check", "Check"]], c?.defaultPayment), "c4")}
    ${field("Sales discount % (off every price)", inp("discountPct", c?.discountPct ?? 0, 'type="number" min="0" max="100" step="0.01"'), "c6")}${field("Cash discount % (cash orders only)", inp("cashDiscountPct", c?.cashDiscountPct ?? 0, 'type="number" min="0" max="100" step="0.01"'), "c6")}
    ${field("Contact", inp("contact", c?.contact), "c4")}${field("Email", inp("email", c?.email, 'type="email"'), "c4")}${field("Phone", inp("phone", c?.phone), "c4")}

    ${field("Notes", `<textarea name="notes" rows="2">${esc(c?.notes || "")}</textarea>`, "")}`;
  PAGES.customers = () => {
    const q = (ui.q.q || "").toLowerCase();
    const list = S.customers.filter((c) => !q || `${c.name} ${c.contact} ${c.email}`.toLowerCase().includes(q)).sort((a, b) => a.name.localeCompare(b.name));
    return `${head("Customers", "Florists, designers and resellers you sell to", `<button type="button" class="btn" data-go="tiers">Price tiers</button><button type="button" class="btn" data-act="export" data-v="customers">Export CSV</button>${can("sales") ? `<button type="button" class="btn" data-go="import" data-q='{"entity":"customers"}'>Import</button>` : ""}`)}
      <form class="row" data-filter><input name="q" value="${esc(ui.q.q || "")}" placeholder="Search customers" style="max-width:320px"><button class="btn">Search</button></form>
      ${table(["Name", "Tier", "Contact", ">Terms", ">Open balance"], list.map((c) => `<tr><td>${link("customer", c.id, esc(c.name))} ${c.active ? "" : badge("inactive")}</td><td>${esc(tier(c.tierId)?.name || "—")}</td><td>${esc(c.contact || "—")}${c.email ? `<div class="small">${esc(c.email)}</div>` : ""}</td><td class="n">Net ${c.terms}</td><td class="n">${money(sum(S.invoices.filter((i) => i.customerId === c.id && i.status === "open"), (i) => i.total))}</td></tr>`))}
      ${can("sales") ? section("Add customer", `<form class="card form" data-form="saveCustomer">${customerFields(null)}<div class="actions"><button class="btn btn-p" ${dis("sales")}>Add customer</button></div></form>`) : ""}`;
  };
  PAGES.customer = () => {
    const c = cust(ui.id);
    if (!c) return empty("That customer no longer exists.");
    const orders = S.sos.filter((s) => s.customerId === c.id).reverse();
    const invs = S.invoices.filter((i) => i.customerId === c.id).reverse();
    const rets = S.returns.filter((r) => r.customerId === c.id);
    const lines = S.sos.filter((s) => s.customerId === c.id && s.fulfilledAt).flatMap((s) => s.lines);
    const rev = sum(lines, (l) => l.qty * l.price) - sum(rets, (r) => r.subtotal);
    const cost = sum(lines, (l) => l.cost) - sum(rets.flatMap((r) => r.lines), (l) => l.cost);
    const open = invs.filter((i) => i.status === "open");
    return `${head(esc(c.name), `${esc(tier(c.tierId)?.name || "No tier")} · Net ${c.terms}`, can("sales") ? `<button type="button" class="btn" data-go="recurring" data-q='${esc(JSON.stringify({ customer: c.id }))}'>Recurring order</button><button type="button" class="btn btn-p" data-act="newSOFor" data-v="${c.id}" ${dis("sales")}>New sales order</button>` : "", ["customers", "Customers"])}
      <div class="stats">${stat("Net revenue", money(rev))}${stat("Gross margin", pct(rev ? (rev - cost) / rev : null))}${stat("Open balance", money(sum(open, (i) => i.total)), `${open.length} open invoices`)}
        ${stat("Overdue", money(sum(open.filter((i) => i.due < today()), (i) => i.total)), "", null, open.some((i) => i.due < today()) ? "bad" : "")}${stat("Open credits", money(sum(rets.filter((r) => r.credit === "open"), (r) => r.total)), `${rets.length} returns`, ["returns"])}</div>
      <div class="grid2">
        ${section("Sales orders", orders.length ? table(["Order", "Status", "Date", ">Total"], orders.slice(0, 15).map((o) => `<tr><td>${link("so", o.id, esc(o.number), "nowrap")}</td><td>${badge(o.status)}</td><td>${fdate(o.orderDate)}</td><td class="n">${money(soTotal(o))}</td></tr>`)) : empty("No orders yet."))}
        ${section("Invoices", invs.length ? table(["Invoice", "Status", "Due", ">Total"], invs.slice(0, 15).map((i) => `<tr><td>${link("invoice", i.id, esc(i.number), "nowrap")}</td><td>${badge(invStatus(i))}</td><td>${fdate(i.due)}</td><td class="n">${money(i.total)}</td></tr>`)) : empty("No invoices yet."))}
      </div>
      ${section("Details", `<form class="card form" data-form="saveCustomer"><input type="hidden" name="id" value="${c.id}"><fieldset class="form" style="border:0;padding:0;margin:0;grid-column:span 12" ${dis("sales")}>${customerFields(c)}<label class="check"><input type="checkbox" name="active" ${c.active ? "checked" : ""}> Active</label>${can("sales") ? `<div class="actions"><button class="btn btn-p">Save changes</button></div>` : ""}</fieldset>${roleNote("sales")}</form>`)}`;
  };
  PAGES.tiers = () => `${head("Price tiers", "Each customer belongs to a tier. Exact prices are set per product; otherwise the tier markup over average landed cost is suggested.", "", ["customers", "Customers"])}
    ${S.tiers.map((t) => `<form class="card row" data-form="saveTier"><input type="hidden" name="id" value="${t.id}"><fieldset class="row" style="border:0;padding:0;margin:0;flex:1" ${dis("sales")}>
      <label class="f" style="flex:1;min-width:180px"><span>Name</span>${inp("name", t.name, "required")}</label><label class="f"><span>Markup %</span>${inp("markup", t.markup, 'type="number" step="0.1" required class="w-24"')}</label>
      <span class="small" style="padding-bottom:8px">${S.customers.filter((c) => c.tierId === t.id).length} customers</span>${can("sales") ? `<button class="btn">Save</button>` : ""}</fieldset></form>`).join("")}
    ${can("sales") ? section("Add tier", `<form class="card row" data-form="saveTier"><label class="f" style="flex:1;min-width:180px"><span>Name</span>${inp("name", "", 'required placeholder="Event Designer"')}</label><label class="f"><span>Markup %</span>${inp("markup", 40, 'type="number" step="0.1" required class="w-24"')}</label><button class="btn btn-p" ${dis("sales")}>Add tier</button></form>`) : roleNote("sales")}`;
  PAGES.locations = () => {
    const tot = {};
    for (const l of onHandLots()) {
      const t = (tot[l.locationId] ||= { lots: 0, value: 0 });
      t.lots++;
      t.value += l.qty * l.cost;
    }
    const shops = DK.layoutsOf(S), multi = shops.length > 1;
    const shopCell = (l) => !multi ? "" : `<td>${can("warehouse") ? sel("shop_" + l.id, shops.map((x) => [x.id, x.name]), DK.locLayout(S, l), `class="w-auto" data-move-loc="${l.id}" aria-label="Shop for ${esc(l.name)}" ${dis("warehouse")}`) : esc(DK.layoutOf(S, DK.locLayout(S, l)).name)}</td>`;
    return `${head("Locations", "Coolers, shelves and staging areas")}
      ${table(["Name", ...(multi ? ["Shop"] : []), "Type", ">Temp °C", ">Lots", ">Value", ""], S.locations.map((l) => `<tr><td><button type="button" class="lnk" data-go="inventory" data-q='${esc(JSON.stringify({ view: "lots", location: l.id }))}'>${esc(l.name)}</button> ${l.active ? "" : badge("inactive")}</td>${shopCell(l)}<td style="text-transform:capitalize">${esc(l.kind)}</td><td class="n">${l.temp ?? "—"}</td><td class="n">${tot[l.id]?.lots || 0}</td><td class="n">${money(tot[l.id]?.value || 0)}</td>
        <td class="n">${can("warehouse") ? `<button type="button" class="btn btn-s" data-act="toggleLocation" data-v="${l.id}" ${dis("warehouse")}>${l.active ? "Deactivate" : "Activate"}</button>` : ""}</td></tr>`))}
      ${can("warehouse") ? section("Add location", `<form class="card row" data-form="createLocation"><label class="f" style="flex:1;min-width:180px"><span>Name</span>${inp("name", "", 'required placeholder="Cooler 3"')}</label>${multi ? `<label class="f"><span>Shop</span>${sel("layoutId", shops.map((x) => [x.id, x.name]), shops[0].id, 'class="w-auto"')}</label>` : ""}<label class="f"><span>Type</span>${sel("kind", [["cooler", "Cooler"], ["shelf", "Shelf"], ["dock", "Dock / staging"], ["other", "Other"]], "cooler", 'class="w-auto"')}</label><label class="f"><span>Temp °C</span>${inp("temp", "", 'type="number" step="0.1" class="w-24"')}</label><button class="btn btn-p" ${dis("warehouse")}>Add location</button></form>`) : roleNote("warehouse")}`;
  };

  // ----- purchasing -----
  const PO_FILTERS = { open: ["draft", "ordered", "partially_received"], draft: ["draft"], ordered: ["ordered", "partially_received"], received: ["received"], cancelled: ["cancelled"], all: null };
  PAGES.purchasing = () => {
    const f = ui.q.status && ui.q.status in PO_FILTERS ? ui.q.status : "open";
    const list = S.pos.filter((p) => !PO_FILTERS[f] || PO_FILTERS[f].includes(p.status)).slice().reverse();
    return `${head("Purchasing", "Purchase orders from growers and suppliers, and receiving", `<button type="button" class="btn" data-act="export" data-v="purchase-orders">Export CSV</button>`)}
      ${can("buyer") ? section("New purchase order", `<form class="card row" data-form="createPO">
        <label class="f" style="flex:1;min-width:220px"><span>Vendor</span>${sel("vendorId", [["", "Choose…"], ...S.vendors.filter((v) => v.active).map((v) => [v.id, v.name])], ui.q.vendor || "", "required")}</label>
        <label class="f"><span>Expected</span>${inp("expected", DK.addDays(today(), 2), 'type="date"')}</label><button class="btn btn-p" ${dis("buyer")}>Create draft PO</button></form>`) : ""}
      ${tabs(Object.keys(PO_FILTERS).map((k) => [k, k[0].toUpperCase() + k.slice(1)]), f, "poTab")}
      ${list.length ? table(["PO", "Vendor", "Status", "Ordered", "Expected", ">Landed total"], list.map((po) => {
        const late = ["ordered", "partially_received"].includes(po.status) && po.expected && po.expected < today();
        return `<tr><td>${link("po", po.id, `<b>${esc(po.number)}</b>`, "nowrap")}</td><td>${esc(vendor(po.vendorId)?.name)}</td><td>${badge(po.status)}</td><td>${fdate(po.orderDate)}</td><td class="${late ? "t-bad" : ""}">${fdate(po.expected)}</td><td class="n">${money(poTotal(po))}</td></tr>`;
      })) : empty("No purchase orders here.")}`;
  };
  PAGES.po = () => {
    const po = S.pos.find((p) => p.id === ui.id);
    if (!po) return empty("That purchase order no longer exists.");
    const uplift = DK.poUplift(po);
    const isDraft = po.status === "draft";
    const receivable = ["ordered", "partially_received"].includes(po.status);
    const nothing = po.lines.every((l) => l.receivedBase === 0);
    const rows = po.lines.map((l) => {
      const p = P(l.productId), u = unitOf(p, l.unitId);
      return { l, p, u, remaining: Math.max(0, (l.qty * u.factor - l.receivedBase) / u.factor) };
    });
    const sub = sum(po.lines, (l) => l.qty * l.cost);
    const received = S.moves.filter((m) => m.kind === "receive" && m.ref === po.number);
    const pending = rows.filter((r) => r.remaining > 1e-9);
    const acts = [];
    if (can("buyer") && isDraft) acts.push(po.standingId ? `<button type="button" class="btn btn-d" data-act="skipOcc" data-id="${po.standingId}" data-v="${po.occurrence}" ${dis("buyer")}>Skip delivery</button>` : `<button type="button" class="btn btn-d" data-act="deletePO" ${dis("buyer")}>Delete draft</button>`, `<button type="button" class="btn btn-p" data-act="poStatus" data-v="ordered" ${dis("buyer")}>Mark as ordered</button>`);
    if (can("buyer") && po.status === "ordered" && nothing) acts.push(`<button type="button" class="btn" data-act="poStatus" data-v="draft" ${dis("buyer")}>Back to draft</button>`, `<button type="button" class="btn btn-d" data-act="poCancel" ${dis("buyer")}>Cancel PO</button>`);
    if (can("buyer") && po.status === "partially_received") acts.push(`<button type="button" class="btn" data-act="closePO" ${dis("buyer")}>Close short</button>`);
    const picker = isDraft && can("buyer") ? linePicker("addPOLine", "cost", "Vendor cost per unit", "largest", (p, u) => lastCost(p, u)) : "";
    return `${head(`${esc(po.number)} ${badge(po.status)}`, `${link("vendor", po.vendorId, esc(vendor(po.vendorId)?.name))}${po.orderDate ? " · ordered " + fdate(po.orderDate) : ""}${po.expected ? " · expected " + fdate(po.expected) : ""}${po.shipmentId && S.shipments.find((x) => x.id === po.shipmentId) ? ` · on ${link("shipment", po.shipmentId, esc(S.shipments.find((x) => x.id === po.shipmentId).number))}` : ""}${po.standingId ? ` · ↻ ${link("standingOne", po.standingId, esc(S.standing.find((x) => x.id === po.standingId)?.name || ""))}${po.edited ? " (edited)" : ""}` : ""}`, acts.join(""), ["purchasing", "Purchasing"])}
      ${section("Lines", rows.length ? table(["Product", ">Qty", ">Unit cost", ">Extended", ">Landed / base", ">Received", ...(isDraft && can("buyer") ? [""] : [])], rows.map(({ l, p, u }) =>
        `<tr><td>${esc(p.name)}${pc.invoice.showSku ? `<div class="small code">${esc(p.sku)}</div>` : ""}</td><td class="n">${qty(l.qty)} ${esc(u.name)}${u.factor !== 1 ? `<div class="small">${qty(l.qty * u.factor)} ${esc(p.baseUnit)}</div>` : ""}</td><td class="n">${money(l.cost)}</td><td class="n">${money(l.qty * l.cost)}</td><td class="n">${money4((l.cost / u.factor) * (1 + uplift))}</td><td class="n">${qty(l.receivedBase / u.factor)} / ${qty(l.qty)}</td>
        ${isDraft && can("buyer") ? `<td class="n"><button type="button" class="btn btn-s btn-d" data-act="removePOLine" data-v="${l.id}" ${dis("buyer")}>Remove</button></td>` : ""}</tr>`),
        `<tfoot><tr><td colspan="3" class="n small">Product subtotal</td><td class="n"><b>${money(sub)}</b></td><td colspan="${isDraft && can("buyer") ? 3 : 2}"></td></tr>
         <tr><td colspan="3" class="n small">Freight + other (${pct(uplift)} uplift)</td><td class="n">${money(po.freight + po.other)}</td><td colspan="${isDraft && can("buyer") ? 3 : 2}"></td></tr>
         <tr><td colspan="3" class="n"><b>Landed total</b></td><td class="n"><b>${money(sub + po.freight + po.other)}</b></td><td colspan="${isDraft && can("buyer") ? 3 : 2}"></td></tr></tfoot>`) : empty("No lines yet."))}
      ${picker ? section("Add line", `<form class="card section" data-form="addPOLine">${picker}<div class="actions"><button class="btn btn-p">Add line</button></div></form>`) : ""}
      ${receivable && pending.length ? section("Receive", can("buyer", "warehouse") ? `<form class="card section" data-form="receivePO">
        <div class="row"><label class="f"><span>Default location</span>${sel("locationId", S.locations.filter((l) => l.active).map((l) => [l.id, l.name]), "", 'class="w-auto"')}</label><p class="note" style="margin:0 0 8px">Landed cost includes freight and other charges (${pct(uplift)}). Expiry defaults from each product's shelf life. Lot codes are created automatically, or scan the farm's box code.</p></div>
        ${table(["Product", ">Remaining", "Receive qty", "Location", "Expires", "Lot / farm code"], pending.map(({ l, p, u, remaining }) =>
          `<tr><td>${esc(p.name)}</td><td class="n">${qty(remaining)} ${esc(u.name)}</td><td><input name="qty_${l.id}" type="number" min="0" step="any" value="${remaining}" class="w-24"></td>
           <td>${sel("loc_" + l.id, [["", "Default"], ...S.locations.filter((x) => x.active).map((x) => [x.id, x.name])], "", 'class="w-auto"')}</td>
           <td><input name="exp_${l.id}" type="date" value="${p.shelfLife ? DK.addDays(today(), p.shelfLife) : ""}" class="w-auto"></td><td><input name="lot_${l.id}" placeholder="Auto" class="w-32"></td></tr>`))}
        <div class="actions"><button class="btn btn-p" ${dis("buyer", "warehouse")}>Receive into inventory</button></div></form>` : roleNote("buyer", "warehouse")) : ""}
      ${received.length ? section("Received lots", table(["Lot", "Product", "Into", "Received", ">Qty", ">Landed / base"], received.map((m) => {
        const l = lot(m.lotId), p = P(m.productId);
        return `<tr><td>${l ? link("lot", l.id, esc(l.code), "code") : "—"}</td><td>${esc(p?.name)}</td><td>${esc(loc(m.locationId)?.name)}</td><td>${fdt(m.at)}</td><td class="n">${qty(m.qty)} ${esc(p?.baseUnit)}</td><td class="n">${l ? money4(l.cost) : "—"}</td></tr>`;
      })), `<button type="button" class="btn btn-s" data-go="labels" data-q='${esc(JSON.stringify({ po: po.id }))}'>Lot labels</button>`) : ""}
      ${section("Details", `<form class="card form" data-form="updatePO"><fieldset class="form" style="border:0;padding:0;margin:0;grid-column:span 12" ${["received", "cancelled"].includes(po.status) ? "disabled" : dis("buyer")}>
        ${field("Order date", inp("orderDate", po.orderDate, 'type="date"'), "c3")}${field("Expected date", inp("expected", po.expected, 'type="date"'), "c3")}
        ${field("Freight", inp("freight", po.freight, 'type="number" min="0" step="0.01"'), "c3")}${field("Other charges (duties, boxes…)", inp("other", po.other, 'type="number" min="0" step="0.01"'), "c3")}
        ${field("Notes", `<textarea name="notes" rows="2">${esc(po.notes || "")}</textarea>`, "")}
        ${can("buyer") && !["received", "cancelled"].includes(po.status) ? `<div class="actions"><button class="btn btn-p">Save details</button></div>${po.status !== "draft" ? `<p class="note">Freight changes apply to lots received after you save.</p>` : ""}` : ""}</fieldset></form>`)}`;
  };
  function lastCost(p, u) {
    for (let i = S.pos.length - 1; i >= 0; i--) {
      const l = S.pos[i].lines.find((x) => x.unitId === u.id);
      if (l) return l.cost;
    }
    return null;
  }

  // Product → unit → qty → price picker (unit options and price update without a re-render)
  let pickerSuggest = null;
  function linePicker(form, priceName, priceLabel, prefer, suggest) {
    pickerSuggest = { suggest, priceName, prefer };
    const products = S.products.filter((p) => p.active).sort((a, b) => a.sku.localeCompare(b.sku));
    const st = DK.stockByProduct(S);
    const p0 = products[0];
    return `<div class="form">
      <label class="f c5"><span>Product</span><input class="pk-filter" placeholder="Filter by SKU or name…" aria-label="Filter products">
        <select name="productId" id="f-productId" data-pick="product">${products.map((p) => `<option value="${p.id}">${esc(p.sku)} — ${esc(p.name)}</option>`).join("")}</select>
        <span class="small pk-note">${p0 ? `${qty(st[p0.id]?.qty || 0)} ${esc(p0.baseUnit)} on hand` : ""}</span></label>
      <label class="f c2"><span>Unit</span><select name="unitId" id="f-unitId" data-pick="unit"></select></label>
      <label class="f c2"><span>Qty</span><input name="qty" id="f-qty" type="number" min="0" step="any" required></label>
      <label class="f c3"><span>${esc(priceLabel)}</span><input name="${priceName}" id="f-${priceName}" type="number" min="0" step="0.0001" required><span class="small pk-per"></span></label>
    </div>`;
  }
  function pickerSync(changed) {
    const ps = document.querySelector('[data-pick="product"]');
    if (!ps || !pickerSuggest) return;
    const p = P(ps.value);
    const us = document.querySelector('[data-pick="unit"]');
    if (changed !== "unit") {
      const units = p.units.slice().sort((a, b) => a.factor - b.factor);
      const def = pickerSuggest.prefer === "largest" ? units[units.length - 1] : units.find((u) => u.name === "bunch") || units[0];
      us.innerHTML = units.map((u) => `<option value="${u.id}" ${u.id === def.id ? "selected" : ""}>${esc(u.name)}${u.factor !== 1 ? ` (${qty(u.factor)} ${esc(p.baseUnit)})` : ""}</option>`).join("");
      const st = DK.stockByProduct(S)[p.id];
      document.querySelector(".pk-note").textContent = `${qty(st?.qty || 0)} ${p.baseUnit} on hand`;
    }
    const u = unitOf(p, us.value);
    const v = pickerSuggest.suggest(p, u);
    const price = document.querySelector(`[name="${pickerSuggest.priceName}"]`);
    price.value = v === null || v === undefined ? "" : Number(v).toFixed(2);
    document.querySelector(".pk-per").textContent = u.factor !== 1 ? `per ${u.name} of ${qty(u.factor)} ${p.baseUnit}` : "";
  }

  // ----- inventory -----
  PAGES.inventory = () => {
    const view = ui.q.view === "lots" ? "lots" : "stock";
    const q = (ui.q.q || "").toLowerCase();
    let lots = onHandLots().filter((l) => {
      const p = P(l.productId);
      return (!ui.q.location || l.locationId === ui.q.location) && (!ui.q.kind || p.kind === ui.q.kind) && (!ui.q.product || l.productId === ui.q.product) && (!q || `${p.sku} ${p.name} ${l.code}`.toLowerCase().includes(q));
    });
    lots = lots.sort((a, b) => (ui.q.sort === "expiry" ? (a.expires || "9999").localeCompare(b.expires || "9999") : a.receivedAt.localeCompare(b.receivedAt)));
    const byP = {};
    for (const l of lots) {
      const x = (byP[l.productId] ||= { qty: 0, value: 0, lots: 0, oldest: 0, soonest: null });
      x.qty += l.qty; x.value += l.qty * l.cost; x.lots++;
      x.oldest = Math.max(x.oldest, DK.daysBetween(DK.ymd(l.receivedAt), today()));
      const d = daysTo(l.expires);
      if (d !== null) x.soonest = x.soonest === null ? d : Math.min(x.soonest, d);
    }
    const filters = JSON.stringify({ q: ui.q.q, location: ui.q.location, kind: ui.q.kind, product: ui.q.product });
    return `${head("Inventory", "What's on hand, where it is, and how old it is", `
        <button type="button" class="btn" data-act="export" data-v="lots">Export CSV</button>
        <button type="button" class="btn" data-go="labels" data-q='${esc(filters)}'>Lot labels</button>
        <button type="button" class="btn" data-go="movements">Movement log</button>`)}
      <div class="stats">${stat("Value (filtered)", money(sum(lots, (l) => l.qty * l.cost)))}${stat("Products", Object.keys(byP).length)}${stat("Lots", lots.length)}
        ${stat("Expiring ≤ 3 days", lots.filter((l) => daysTo(l.expires) !== null && daysTo(l.expires) <= 3).length, "", ["inventory", { ...ui.q, view: "lots", sort: "expiry" }], "warn")}</div>
      <form class="row" data-filter><input type="hidden" name="view" value="${view}">
        <input name="q" value="${esc(ui.q.q || "")}" placeholder="SKU, product or lot" style="max-width:260px">
        ${sel("location", [["", "All locations"], ...S.locations.map((l) => [l.id, l.name])], ui.q.location, 'class="w-auto"')}
        ${sel("kind", [["", "All types"], ["flower", "Flowers / greens"], ["hard_good", "Hard goods"]], ui.q.kind, 'class="w-auto"')}
        ${view === "lots" ? sel("sort", [["", "Oldest first"], ["expiry", "Expiring first"]], ui.q.sort, 'class="w-auto"') : ""}
        ${ui.q.product ? `<input type="hidden" name="product" value="${esc(ui.q.product)}"><span class="chip chip-demo">${esc(P(ui.q.product)?.name)}</span>` : ""}
        <button class="btn">Apply</button>${ui.q.q || ui.q.location || ui.q.kind || ui.q.product ? `<button type="button" class="btn" data-go="inventory" data-q='{"view":"${view}"}'>Clear</button>` : ""}
      </form>
      <div class="row" style="justify-content:space-between;align-items:flex-end">${tabs([["stock", "By product"], ["lots", "By lot"]], view, "invTab")}${view === "lots" && lots.length ? viewToggle("lots") : ""}</div>
      ${!lots.length ? empty("Nothing on hand matches.") : view === "stock"
        ? table(["Product", ">On hand", ">Lots", ">Oldest", "Soonest expiry", ">Value"], Object.entries(byP).sort((a, b) => P(a[0]).name.localeCompare(P(b[0]).name)).map(([pid, x]) => {
            const p = P(pid);
            return `<tr><td><div class="ic">${thumb(p.name, p.img, 32)}<div>${link("product", pid, esc(p.name))}<div class="small code">${esc(p.sku)}</div></div></div></td><td class="n">${qty(x.qty)} ${esc(p.baseUnit)}</td><td class="n"><button type="button" class="lnk" data-go="inventory" data-q='${esc(JSON.stringify({ view: "lots", product: pid }))}'>${x.lots}</button></td><td class="n">${x.oldest}d</td><td>${expiry(x.soonest)}</td><td class="n">${money(x.value)}</td></tr>`;
          }))
        : listView("lots") === "cards" ? `<ul class="pcards" data-testid="lot-cards">${lots.map((l) => {
            const p = P(l.productId);
            const d = daysTo(l.expires);
            return `<li class="pcard"><button type="button" data-go="lot" data-id="${l.id}">${cardPhoto(p.name, l.img || p.img)}<div class="bd"><span class="loc">${esc(loc(l.locationId)?.name || "")}</span><div class="nm">${esc(p.name)}</div>
              <div class="meta">Lot ${esc(l.code)} · received ${fdate(l.receivedAt)}</div>
              <div class="row2"><span>${qty(l.qty)} ${esc(p.baseUnit)}</span><span class="small">${d !== null ? `Expires ${expiry(d)}` : `${DK.daysBetween(DK.ymd(l.receivedAt), today())}d old`}</span></div></div></button></li>`;
          }).join("")}</ul>`
